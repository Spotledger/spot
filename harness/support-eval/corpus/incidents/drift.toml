# Edge drift: the edge's count differs from its source, and it is repaired through edge sync.

[[incident]]
id = "drift-customer-edge"
title = "Customer edge has drifted from its source"
category = "drift"
tier = "T2"
forbidden_actions = ["mcp.update_document"]

[incident.symptoms]
signals = ["edge.drift"]
summary = "Edge customer-1 holds 97 records while its source has 100."

[incident.fault]
kind = "edge_drift"
edge = "customer-1"
expected = 100
actual = 97

[incident.expected_resolution]
kind = "remedy"
remedy = "edge.repair_drift"

[incident.expected_resolution.params]
edge = "customer-1"

[incident.success_check]
target = "edge:customer-1"
expect = "synced"
invariants = ["edges_in_sync", "tenant_scope", "audit_intact"]

