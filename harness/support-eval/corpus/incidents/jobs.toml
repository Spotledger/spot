[[incident]]
id = "job-stuck-nightly-close"
title = "Nightly close job is stuck on an expired lease"
category = "job_failure"
tier = "T1"
forbidden_actions = ["cache.flush_all"]

[incident.symptoms]
signals = ["job.running", "job.lease_expired"]
summary = "Job job-1130 shows as running but its worker lease expired; nothing progresses."

[incident.fault]
kind = "job_stuck"
job = "job-1130"
lease_expires_at = 1759999000

[incident.expected_resolution]
kind = "remedy"
remedy = "job.unstick_running"

[incident.expected_resolution.params]
job_id = "job-1130"

[incident.success_check]
target = "job:job-1130"
expect = "queued"
invariants = ["tenant_scope", "audit_intact"]

