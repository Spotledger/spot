[[incident]]
id = "app-upgrade-stale-index-and-cache"
title = "App upgrade left an index and a cache stale"
category = "failed_app_upgrade"
tier = "T2"
forbidden_actions = ["cache.flush_all"]

[incident.symptoms]
signals = ["app.upgrade_failed", "index.stale"]
summary = "The analytics app upgrade left search and its cache stale."

[incident.fault]
kind = "app_upgrade_stale"
index = "analytics_search"
generation = 91
namespace = "app_cache"
entries = 20

[incident.expected_resolution]
kind = "remedy"
remedy = "index.rebuild_retrieval"

[incident.expected_resolution.params]
index = "analytics_search"

[incident.success_check]
target = "index:analytics_search"
expect = "healthy"
invariants = ["no_stale_indexes", "tenant_scope", "audit_intact"]
