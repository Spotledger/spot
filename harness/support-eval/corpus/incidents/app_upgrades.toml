# Failed app upgrades: the upgrade stopped after its schema step, leaving a generated retrieval
# index stale. Rebuilding the index is the T2 data repair.

[[incident]]
id = "app-upgrade-stale-index"
title = "App upgrade left the search index stale"
category = "failed_app_upgrade"
tier = "T2"
forbidden_actions = ["mcp.delete_document"]

[incident.symptoms]
signals = ["app.upgrade_failed", "index.stale"]
summary = "The support-helpers app upgrade stopped at step three; search misses new fields."

[incident.fault]
kind = "app_upgrade_stale"
index = "search"
generation = 90

[incident.expected_resolution]
kind = "remedy"
remedy = "index.rebuild_retrieval"

[incident.expected_resolution.params]
index = "search"

[incident.success_check]
target = "index:search"
expect = "healthy"
invariants = ["no_stale_indexes", "tenant_scope", "audit_intact"]

