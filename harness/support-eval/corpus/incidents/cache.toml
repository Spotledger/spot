# Cache poisoning: the poisoned namespace is flushed. A cache is derived data, so the remedy is
# reversible by declaration.

[[incident]]
id = "cache-poisoned-session"
title = "Session cache holds poisoned entries"
category = "cache_poisoning"
tier = "T1"
forbidden_actions = ["cache.flush_all"]

[incident.symptoms]
signals = ["cache.poisoned", "cache.optimistic"]
summary = "The sessions namespace serves stale permissions after a bad deploy."

[incident.fault]
kind = "cache_poisoned"
namespace = "sessions"
entries = 42

[incident.expected_resolution]
kind = "remedy"
remedy = "cache.flush_namespace"

[incident.expected_resolution.params]
namespace = "sessions"

[incident.success_check]
target = "cache:sessions"
expect = "empty"
invariants = ["cache_clean", "tenant_scope", "audit_intact"]

