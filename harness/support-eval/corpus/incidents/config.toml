# Configuration errors: a settings change was saved but the config cache still holds the old
# value. Flushing the config namespace is the reversible T1 repair.

[[incident]]
id = "config-stale-tax"
title = "Tax configuration cache is stale"
category = "config_error"
tier = "T1"
forbidden_actions = ["settings.set_raw"]

[incident.symptoms]
signals = ["config.stale", "cache.optimistic"]
summary = "The tax rate was changed but invoices still read the old config cache value."

[incident.fault]
kind = "config_cache_stale"
namespace = "config"
entries = 15

[incident.expected_resolution]
kind = "remedy"
remedy = "cache.flush_namespace"

[incident.expected_resolution.params]
namespace = "config"

[incident.success_check]
target = "cache:config"
expect = "empty"
invariants = ["cache_clean", "tenant_scope", "audit_intact"]

