[package]
name = "spot-l10-stack"
version = "0.1.0"
description = "L10 on the real stack (WP-TST-11.T2): a LivenessHost over spot-customise, the document engine and a real PostgreSQL, with live plan, schema and view probes, so every L10 scenario also proves the change reached the compiled plans, the database columns and a write through the engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spot-l10-liveness = { path = "../l10-liveness" }
spot-customise = { path = "../../../crates/framework/spot-customise", features = ["postgres"] }
spot-meta = { path = "../../../crates/framework/spot-meta" }
spot-meta-live = { path = "../../../crates/framework/spot-meta-live" }
spot-document = { path = "../../../crates/framework/spot-document" }
spot-seams = { path = "../../../crates/framework/spot-seams" }
time = { version = "0.3.55", default-features = false, features = ["std"] }
spot-core = { path = "../../../crates/framework/spot-core" }
spot-app-api = { path = "../../../contracts/app-api" }
spot-postgres = { path = "../../../crates/backends/spot-postgres", features = ["testing"] }
spot-storage-contract = { path = "../../../contracts/storage" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
