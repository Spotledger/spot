# The `cluster3` profile (WP-TST-15.T6): the parameters of the three-node cluster proofs in
# tests/cluster3.rs. The proofs drive the cluster themselves (kill, pause, restart, partition),
# so this file is read for its numbers rather than run by the open-loop runner:
#
#   steady_seconds  how long the single-leader proof samples the leases (5 minutes)
#   target_tps      the write rate of the rolling-restart proof (5 writes per second)
#   sessions        concurrent writers during the rolling restart
#   think           the pause between a writer's attempts
#
# `tier = "cluster"` keeps it apart from the single-node tiers. The scale
# (L9_DURATION_SCALE, default 0.1) shortens the sampling window; the rate is never scaled.
name = "cluster3"
tier = "cluster"
sessions = 5
ramp_seconds = 10
steady_seconds = 300
seed = 20261115
target_tps = 5
request_timeout_ms = 10000
sample_every_seconds = 1
report = "task_summary"

[think]
kind = "uniform"
min_ms = 100
max_ms = 300

[mix]
create_submit = 100
