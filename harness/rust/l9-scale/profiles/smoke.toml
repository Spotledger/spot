# The CI smoke profile (WP-TST-15.T1): 5 sessions for 20 s (2 s ramp, 18 s steady) against a
# real `spot serve`. It proves the harness and the stack work together; the tier budgets
# come with WP-TST-15.T2 (tier S) and T3 (tier M).
name = "smoke"
tier = "smoke"
sessions = 5
ramp_seconds = 2
steady_seconds = 18
seed = 20261105
target_tps = 5
request_timeout_ms = 10000
sample_every_seconds = 5
report = "task_summary"

[think]
kind = "uniform"
min_ms = 200
max_ms = 800

[mix]
sign_in = 5
open_form = 40
list = 25
create_submit = 15
update = 10
report_run = 5
