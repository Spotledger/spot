[package]
name = "spot-l7-invariants"
version = "0.1.0"
description = "L7 invariant suite and parallel-load driver, storage level (WP-TST-07.T1): an invariant registry apps extend, the framework invariants, a seeded multi-worker workload driver with a client-side history, and seeded-corruption proofs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# `bin/` directories are git-ignored in this repository, so the binary lives under `src/cli/`.
[[bin]]
name = "spot-l7"
path = "src/cli/main.rs"

[dependencies]
spot-storage-contract = { path = "../../../contracts/storage" }
spot-storage-fake = { path = "../../../crates/backends/spot-storage-fake" }
spot-postgres = { path = "../../../crates/backends/spot-postgres", features = ["testing"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
