# Spotledger desktop PostgreSQL + PostGIS bundle (WP-PRD-02.T7, ADR-087 sections 4.2, 4.3,
# 11.2 and 11.3 S2).
#
# This file is the pinned bill of materials for the PostgreSQL and PostGIS binaries the
# Windows desktop installer ships. It pins, per platform: the two upstream archives, their
# SHA-256 and byte size, and every file the installer must place under the PostgreSQL
# installation prefix (`<prefix>/bin`, `<prefix>/share`, `<prefix>/lib` — the layout
# `spot-pg-supervisor`'s `PgLayout::validate` and first-start provisioning expect).
#
# Path chosen: (a) the EDB-built PostgreSQL with the matching PostGIS Windows bundle, whose
# own README says "The installers are designed to work with EnterpriseDb PostgreSQL
# distributions" (https://postgis.net/windows_downloads/, read 29 Oct 2026). The reasoning,
# the size delta and the timing record are in `docs/packaging/desktop-postgis.md` and
# `packaging/postgis/timing.md`.
#
# No binary is committed to git. Check this file, and any unpacked prefix, with:
#
#   python3 packaging/postgis/verify.py --manifest packaging/postgis/MANIFEST.toml
#   python3 packaging/postgis/verify.py --manifest packaging/postgis/MANIFEST.toml \
#       --files <unpacked prefix> --platform windows-x86_64
#
# The unit test of the verifier is `python3 -m unittest discover -s packaging/postgis -p 'test_*.py'`.
#
# Evidence rule: every version, URL, size and SHA-256 below was obtained by an actual
# download or from an official upstream listing, on 29 Oct 2026; nothing is estimated. A
# value that could not be verified is written as the literal marker
# `todo = "pin before release"` instead of a guess, and `verify.py` reports the manifest as
# not shippable (exit 2) until it is replaced.

schema = 1

# The lowest PostGIS version the catalog accepts, as the contract and `spot-pg-migrate`
# define it: `default_min_version("postgis")` in
# `crates/backends/spot-pg-migrate/src/plan.rs` returns "3.0", and that is what the
# supervisor's first-start `ExtensionRequest::new("postgis")` carries. The bundled version
# must satisfy it; the pinned 3.6.2 does.
min_version = "3.0"

[bundle]
# Platforms the desktop edition must cover. `verify.py` refuses a manifest that lacks one:
# a missing platform is a silently missing install, not a smaller one.
required_platforms = ["windows-x86_64"]
# How the installer treats the extensions the vendor bundle carries but the platform does
# not use. Pruning keeps the installed size (and the notice surface) to what ships.
prune = [
    # Shipped by the vendor archive, not needed for `geometry(Point,4326)`, GiST or
    # ST_DWithin, and each would add its own notice file.
    "share/extension/postgis_raster*",
    "share/extension/postgis_topology*",
    "share/extension/postgis_sfcgal*",
    "share/extension/postgis_tiger_geocoder*",
    "share/extension/address_standardizer*",
    "share/extension/h3*",
    "share/extension/pgrouting*",
    "share/extension/pointcloud*",
    "share/extension/mobilitydb*",
    "share/extension/ogr_fdw*",
    "bin/postgisgui/**",
    "gdal-data/**",
    "lib/h3*.dll",
    "lib/pgrouting*.dll",
    "lib/pointcloud*.dll",
    "lib/MobilityDB*.dll",
    "lib/ogr_fdw.dll",
    "lib/postgis_raster*.dll",
    "lib/postgis_topology*.dll",
    "lib/postgis_sfcgal*.dll",
    "lib/address_standardizer*.dll",
    "lib/pg_sphere.dll",
]

# ---------------------------------------------------------------------------------------
# windows-x86_64: the desktop installer's only target (WP-PRD-02, WP-PRD-03).
# ---------------------------------------------------------------------------------------
[[platform]]
id = "windows-x86_64"
os = "windows"
arch = "x86_64"
# The prefix the archives are merged into, as the installer lays it out.
install_prefix = "pgsql"

[[platform.component]]
name = "postgresql"
version = "18.6"
upstream = "https://www.postgresql.org/"
# Minor version confirmed against https://www.postgresql.org/support/versioning/ on
# 29 Oct 2026 ("18 | 18.6 | Yes").
version_evidence = "https://www.postgresql.org/support/versioning/ (read 29 Oct 2026: 18.6 is the current 18 minor)"
url = "https://get.enterprisedb.com/postgresql/postgresql-18.6-1-windows-x64-binaries.zip"
archive = "postgresql-18.6-1-windows-x64-binaries.zip"
# The archive's own top directory; everything below is stripped when merging.
extract_prefix = "pgsql"
size_bytes = 343808005
sha256 = "fbe23da234ee31547bf8a36d29dfd81e82b849df2d2b78d2eecb43d360252f8c"
# EDB publishes no checksum file for this archive; the hash above was computed by
# downloading the exact URL (HTTP 200, content-length 343808005 bytes) on 29 Oct 2026 and
# running sha256sum. Re-verify with:
#   curl -fLSO <url> && sha256sum postgresql-18.6-1-windows-x64-binaries.zip
sha256_evidence = "computed from a real download on 29 Oct 2026 (content-length matched)"

[[platform.component]]
name = "postgis"
version = "3.6.2"
upstream = "https://postgis.net/"
version_evidence = "https://download.osgeo.org/postgis/windows/pg18/ (listed postgis-bundle-pg18-3.6.2x64.zip on 29 Oct 2026); the bundle's version.txt records POSTGIS: 3.6.2"
url = "https://download.osgeo.org/postgis/windows/pg18/postgis-bundle-pg18-3.6.2x64.zip"
archive = "postgis-bundle-pg18-3.6.2x64.zip"
extract_prefix = "postgis-bundle-pg18-3.6.2x64"
size_bytes = 124037332
sha256 = "0f41241cc536f7404dda43fd2a3f20ffe1fa1d71a8d4f6341428cd25931bf419"
# Cross-checked against the upstream MD5 sidecar
# (https://download.osgeo.org/postgis/windows/pg18/postgis-bundle-pg18-3.6.2x64.zip.md5,
# read 29 Oct 2026); the downloaded file's md5sum matched it exactly, so the SHA-256 above
# is of the genuine artifact.
sha256_evidence = "sha256 of a real download on 29 Oct 2026; the same file's md5sum matched the upstream .md5 sidecar"
upstream_md5 = "9e28723541938d1b1a8efb59a5922741"
upstream_md5_url = "https://download.osgeo.org/postgis/windows/pg18/postgis-bundle-pg18-3.6.2x64.zip.md5"

# The libraries the PostGIS Windows bundle brings and the module links against, with the
# versions the bundle's own version.txt records (read 29 Oct 2026):
#   GEOS VERSION: 3.14          https://github.com/libgeos/geos
#   GDAL VERSION: 3.9.2         https://gdal.org/download.html#current-releases
#   PROJ VERSION: 8.2.1         https://proj.org/download.html#current-release
# No GDAL file is shipped: the bundle's GDAL is only needed by raster I/O, which the
# platform does not use yet, and it is 36 MB (see the `prune` list).

# Every file the installer places under the prefix, with the SHA-256 of the file itself so a
# staged bundle is checked too, not only the archives.
#
# The DLL list is not a guess: it is the transitive import closure of `lib/postgis-3.dll`,
# read with `objdump -p` from the real archives on 29 Oct 2026 (`postgis-3.dll` imports
# libgeos_c, libproj_8_2, libprotobuf-c-1, libstdc++-6, libwinpthread-1 and libxml2-2
# directly, and those in turn pull the rest). Shipping the control file and the module
# without the closure would pass `PgLayout::validate` and then fail `CREATE EXTENSION` with
# "The specified module could not be found".
#
# Two notes the installer must honour:
#   * `libwinpthread-1.dll` comes from the PostgreSQL archive, not from the PostGIS bundle.
#   * `zlib1.dll` exists in BOTH archives; the manifest pins the PostGIS bundle's copy,
#     because the bundle's own README says to copy its files over the PostgreSQL tree.
#   * GDAL is deliberately absent: `postgis-3.dll` does not import it, so nothing that the
#     platform's `geometry(Point,4326)` / GiST / ST_DWithin needs would load it. Raster and
#     GDAL-backed functions are therefore unavailable in the desktop bundle.
#
# `share/contrib/postgis-3.6/proj/proj.db` is PROJ's resource database. PROJ 8.2 looks for
# its resources under `share/proj` relative to its installation root and honours `PROJ_LIB`
# (PROJ 8.2 docs, `environmentvars`); the file lives under `share/contrib/postgis-3.6/proj`
# here, so the service must pass `PROJ_LIB=<prefix>/share/contrib/postgis-3.6/proj` to the
# postgres child (`SupervisorConfig::child_env` carries it), or coordinate transforms fail.

[[platform.file]]
component = "postgresql"
path = "bin/postgres.exe"
role = "program"
size_bytes = 10266624
sha256 = "af5b897cb69c9ce692a4a15ecd022b540db85db1add0f66d2b9f0697be2451a0"

