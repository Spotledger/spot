# Spotledger host configuration (installed as /etc/spot/spot.toml).
#
# This is the documented, safe default template. The service refuses to start
# until an administrator has reviewed it and provisioned at least one site;
# that is deliberate (the package never starts the service on install).
#
# The CLI reads <root>/common.toml, where <root> is the directory passed to
# `spot serve --root` (/var/lib/spot in the packaged unit). Before every start
# the unit creates the symlink /var/lib/spot/common.toml -> /etc/spot/spot.toml
# unless something is already at that path; an operator-written common.toml
# wins and is named in the journal. A `--config` flag is a planned follow-up and
# does not exist yet. See packaging/linux/README.md.
#
# Protect this file (root:spot, mode 0640): it may contain a database password.

# App directories, each containing doctypes/*.toml. Replace with the app
# directories installed for this site host; the list must not be empty.
apps = ["/var/lib/spot/apps"]

[server]
# Loopback only by default. Put a TLS reverse proxy in front for remote
# access; the binary does not terminate TLS yet (ADR/ops baseline).
bind = ["127.0.0.1:8000"]
max_body_bytes = 10485760
request_timeout = 60
# Must stay below the unit's TimeoutStopSec (40 s).
shutdown_grace = 30
trusted_proxies = []
# fallback_site = "demo"

[postgres]
# Administrative PostgreSQL URL. The bundled supervisor listens on 5433 and
# binds loopback only; use verified TLS (sslmode=require) for a remote server.
# The URL is never written to the journal or error output.
admin_url = "postgres://spot@127.0.0.1:5433/postgres"
pool_max_size = 16

[telemetry]
# Logs go to the journal as structured JSON. No file logging, so no logrotate
# stanza is shipped.
filter = "info"
format = "json"
service_name = "spotledger"
node_id = "node-0"
# [telemetry.otlp]
# endpoint = "http://127.0.0.1:4318/v1/traces"
# sample_ppm = 1000000
