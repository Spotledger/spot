# Allow-list of the egress lint (WP-SEC-09.T6). It may only shrink: an entry that matches no hit
# is an error, and `max_gaps` may not be raised. See README.md for the entry format and the kinds.
# One entry per file. A `gap` is a real hole, not an exemption: it names the follow-up that closes it.

max_gaps = 6

# --- egress-implementation: spot-egress itself ---------------------------------------------

[[allow]]
path = "crates/framework/spot-egress/src/connector.rs"
kind = "egress-implementation"
owner_wp = "WP-SEC-09"
reason = "EgressConnector: dials only the addresses the Guard vetted and pinned for the request."

[[allow]]
path = "crates/framework/spot-egress/src/sender.rs"
kind = "egress-implementation"
owner_wp = "WP-SEC-09"
reason = "HttpSender: the hyper client and the TLS connector sit behind EgressConnector, after address vetting and redirect re-validation."

# --- loopback-only ---------------------------------------------------------------------------

[[allow]]
path = "crates/framework/spot-pg-supervisor/src/supervisor.rs"
kind = "loopback-only"
owner_wp = "WP-PG-SUP"
reason = "tcp_probe connects to the supervised PostgreSQL's own listen address and port (layout.listen first_probe_addr), chosen by the supervisor, and drops the connection at once."

# --- peer-pinned -----------------------------------------------------------------------------

[[allow]]
path = "crates/framework/spot-sync-http/src/transport.rs"
kind = "peer-pinned"
owner_wp = "WP-SYN"
pinned_at = "spot-sync-http tls.rs client_config: the root store holds only the hub CA and the client presents its own certificate (mutual TLS); the address comes from the operator's sync configuration"
reason = "The sync channel dials the configured hub address over mutual TLS pinned to the hub CA."

[[allow]]
path = "crates/framework/spot-sync-http/src/tls.rs"
kind = "peer-pinned"
owner_wp = "WP-SYN"
pinned_at = "this file: client_config and server_config build the hub-CA pinned mutual-TLS configurations; the hit is the accepting side (serve_one takes an accepted TcpStream)"
reason = "The TLS module of the pinned sync channel; the only TcpStream mention is the accepted socket of the hub server."

[[allow]]
path = "crates/framework/spot-agent/src/channel/transport.rs"
kind = "peer-pinned"
owner_wp = "WP-AGT"
pinned_at = "this file, TlsTransport::new: the root store holds exactly the certificates of the gateway trust anchor passed in (system roots not added), TLS 1.3, no insecure option; the gateway host and port come from the agent's enrolment configuration"
reason = "The agent channel dials only the gateway its operator enrolled it with, over TLS pinned to the gateway trust anchor; the agent never listens."

[[allow]]
path = "crates/framework/spot-cli/src/commands/mgmt.rs"
kind = "peer-pinned"
owner_wp = "WP-SEC-04"
pinned_at = "this file, trust loading in the `mgmt` client: `--ca` is required and is the only root the server certificate is verified against; there is no --insecure and --url must be https"
reason = "The operator's management client dials the one site the operator names with --url, verified against the operator CA the operator supplies (mutual TLS with the operator certificate)."

[[allow]]
path = "crates/framework/spot-cli/src/services/updater.rs"
kind = "peer-pinned"
owner_wp = "WP-PRD-03"
pinned_at = "this file: HttpsClient verifies the certificate and name (platform roots or the operator's trust anchor), refuses non-https and redirects, caps the body; the downloaded manifest, signature and payload are verified against the pinned update-signing keys (verify_update) before any byte is used"
reason = "The updater fetches only from the update source URL the operator configured; the content is authenticated by the pinned update signature independent of the transport."

[[allow]]
path = "crates/framework/spot-mgmt-api/src/tls.rs"
kind = "peer-pinned"
owner_wp = "WP-SEC-04"
pinned_at = "this file: the TLS acceptor requires a client certificate that chains to the operator CA; the only TcpStream mention is the accepted socket (serve_one)"
reason = "The management API's TLS module: the hit is the accepting side, nothing is dialled."

