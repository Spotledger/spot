# --- gaps: real holes, each with its follow-up ---------------------------------------------------

[[allow]]
path = "crates/framework/spot-http/src/server.rs"
kind = "gap"
tracked_by = "WP-SEC-09.T6"
owner_wp = "WP-HTT"
reason = "Only the accepted (inbound) socket type is named; nothing is dialled. Listed as a gap because no allow-list kind covers an accept-side use; a kind or a narrower rule for it is an open question of WP-SEC-09.T6."

[[allow]]
path = "crates/framework/spot-mail/Cargo.toml"
kind = "gap"
tracked_by = "WP-SEC-09.T6"
owner_wp = "WP-MAIL"
reason = "Depends on lettre, whose SMTP transport smtp.rs uses; the same hole as smtp.rs (the connection is not built on EgressConnector)."

[[allow]]
path = "crates/framework/spot-mail/src/smtp.rs"
kind = "gap"
tracked_by = "WP-SEC-09.T6"
owner_wp = "WP-MAIL"
reason = "The lettre SMTP transport dials either the pinned addresses the caller got from the Guard or, when `SmtpConfig::pinned` is None, resolves the host itself at connect time; nothing in the crate forces the Guard step. Close by making `pinned` mandatory (an `Authorized` value) outside tests."

[[allow]]
path = "crates/framework/spot-mail/src/imap.rs"
kind = "gap"
tracked_by = "WP-SEC-09.T6"
owner_wp = "WP-MAIL"
reason = "dial() connects only to the `pinned` addresses and refuses an empty list, but the addresses are a plain `&[SocketAddr]`: the crate cannot tell that they came from Guard::authorize. Close by taking the guard's `Authorized` value."

[[allow]]
path = "crates/framework/spot-winsvc/src/app.rs"
kind = "gap"
tracked_by = "WP-SEC-09.T6"
owner_wp = "WP-WIN"
reason = "TcpHealthProbe connects to `app.health_addr` from the service config, which config.rs only checks to be host:port (default 127.0.0.1:8080), so it is not enforced loopback. Close by validating a loopback address in config."

[[allow]]
path = "crates/framework/spot-winsvc/src/upgrade.rs"
kind = "gap"
tracked_by = "WP-SEC-09.T6"
owner_wp = "WP-WIN"
reason = "probe_health_ready connects to the same configured health address as app.rs; same fix."
