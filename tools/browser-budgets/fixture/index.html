<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spot browser budgets: fixture page</title>
<style>
  :root { color-scheme: light; font: 13px/1.4 system-ui, sans-serif; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #f6f7f9; color: #1d1f22; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px; background: #ffffff; border-bottom: 1px solid #dcdfe4; }
  header input { flex: 0 0 220px; padding: 4px 6px; border: 1px solid #b9bec6; border-radius: 4px; }
  #tabs { display: flex; gap: 4px; overflow: hidden; }
  .tab { padding: 2px 8px; border: 1px solid #cfd4db; border-radius: 4px 4px 0 0; background: #eef1f5; white-space: nowrap; }
  .tab.active { background: #ffffff; border-bottom-color: #ffffff; }
  #list { flex: 1 1 auto; overflow: auto; outline: none; background: #ffffff; margin: 0 8px 8px; border: 1px solid #dcdfe4; }
  #list table { border-collapse: collapse; width: 100%; }
  #list th, #list td { padding: 2px 8px; border-bottom: 1px solid #eef1f5; text-align: left; font-variant-numeric: tabular-nums; }
  #list th { position: sticky; top: 0; background: #f2f4f7; }
  #status { padding: 2px 8px; color: #5b6270; font-size: 11px; }
</style>
</head>
<body>
<header>
  <input id="field" type="text" inputmode="decimal" value="" aria-label="fixture field">
  <div id="tabs"></div>
</header>
<div id="status">fixture: 1 tab, ready</div>
<main id="list" tabindex="0" aria-label="fixture list">
  <table>
    <thead>
      <tr><th>#</th><th>Code</th><th>Item</th><th>Quantity</th><th>Rate</th><th>Amount</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script type="module" src="./spot-browser.mjs"></script>
</body>
</html>
