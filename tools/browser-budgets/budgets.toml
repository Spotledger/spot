# Browser performance budgets for the Avalonia browser target (WP-UI-09.T3).
#
# Source of truth for `run.sh` and the Playwright driver. `perf-budgets.toml`
# beside it is the projection `tools/ci/ui/perf_gate.py` reads, generated by
# `python3 budget_cli.py gate --write`; a test fails when the two disagree.
#
# Every [[budget]] block carries a `# reference:` comment naming the reference
# hardware and bandwidth profile its number is for; the parser rejects a block
# without one, so a number never travels without the machine it is for.
#
# Values come from docs/spikes/SPK-07/REPORT.md (its "Budget" column) and the
# blueprint's "Browser performance, designed in" section. `proposed = true`
# marks a number no source defines; those are listed under "Open questions".
#
# A budget change is a commitment, not a tuning knob: it needs the lead (see
# README.md). Never raise a max to make a run pass.
#
# `informational = true` on a `[[budget]]` block means its breach is reported
# but never fails the gate; a `informational_reason` string (who decides and
# since when) is then mandatory. A MISSING result for an informational budget
# still fails: absence is never a pass, informational or not. Only one budget
# carries it today (browser.startup.warm) and only because its number is the
# lead's open decision, not a free pass to ignore a budget: see README.md.

[reference]
hardware = "4-core laptop with a hardware GPU (integrated is enough), 16 GB RAM, 1920x1080, Chromium stable on Fedora 44 or Windows 11; SPK-07's 4-vCPU Xeon container without a GPU is not reference hardware"
network = "50 Mbit/s down and up, 20 ms round-trip latency (DevTools throttling, latency assumed), empty HTTP cache for cold and populated on-disk HTTP cache for warm"
browser = "Chromium as pinned by package-lock.json (Playwright 1.64.1, Chromium 156), headless, viewport 1280x800, device scale factor 1"

# Multipliers are reviewed data, never derived from a CI flag. Only the
# reference label is declared; a self-hosted `ci-linux` run uses the 3x default
# documented in clients/avalonia/docs/testing.md until the lead publishes
# reviewed factors (open question in the PR report).
[runner.reference]
multiplier = 1.0

# Bytes that cross the wire on one cold load (Brotli pre-compressed files served
# with Content-Encoding).
[[budget]]
# reference: 50 Mbit/s link, 20 ms RTT, 4-core laptop with a GPU. No source
# defines a number: SPK-07 measured 9.80 MB of Brotli files (AOT) and 5.62 MB
# (interpreted), marked the row "report", and the draft ADR asks WP-UI-09 to add
# an explicit download-size budget. Proposed at 10 MiB on the wire.
id = "browser.download.compressed"
metric = "max"
max = 10485760
unit = "bytes"
quick = true
runner = "reference"
profile = "fifty"
proposed = true
note = "sum of encodedDataLength over the cold load; proposed, no source number"

# Navigation start to the resolution of `window.spotBrowser.ready`, empty cache.
[[budget]]
# reference: 50 Mbit/s link, 20 ms RTT, 4-core laptop with a GPU. SPK-07's draft
# budget for the AOT build is <= 4 s; it measured p95 3.84 s on its 4-vCPU
# container without a GPU.
id = "browser.startup.cold"
metric = "p95"
max = 4000
unit = "ms"
quick = true
runner = "reference"
profile = "fifty"
note = "SPK-07 draft budget; page mark js.marksMs.ready, not the Node wall clock"

# The same measure on a populated on-disk HTTP cache.
[[budget]]
# reference: 50 Mbit/s link, 20 ms RTT, 4-core laptop with a GPU. SPK-07's draft
# budget is <= 1.5 s and the AOT build missed it by 0.15 s (p95 1.67 s) because
# runtime start alone takes 1.2 to 2.4 s; REPORT.md proposes <= 2 s. Left at the
# draft on purpose: adjusting a budget is the lead's call (see Open questions).
id = "browser.startup.warm"
metric = "p95"
max = 1500
unit = "ms"
quick = true
runner = "reference"
profile = "fifty"
informational = true
informational_reason = "SPK-07 draft 1.5 s; CI runner measured 1.67 s; decision pending (architecture owner)"
note = "SPK-07 draft; its own AOT run missed this by 0.15 s on non-reference hardware"

# `openForm` call to the end of the second painted frame, 200-row sales invoice.
[[budget]]
# reference: 4-core laptop with a GPU, no network throttling (the record is
# open, not download). SPK-07's draft budget is <= 500 ms; AOT measured p95
# 75 ms, so the number is loose by design and belongs to real hardware.
id = "browser.form.open"
metric = "p95"
max = 500
unit = "ms"
quick = true
runner = "reference"
profile = "local"
note = "SPK-07 draft budget; measures the shell's form tab until T2 lands real views"

# p95 of the page's animation-frame intervals while PageDown is held: 20 ms is
# one frame at 50 Hz.
[[budget]]
# reference: 4-core laptop with a GPU, no network throttling. SPK-07's draft
# budget is p95 <= 20 ms; AOT measured p95 16.8 ms with PageDown held and missed
# only when scrolling was driven in-app once per frame (33.4 ms).
id = "browser.list.scroll.frame"
metric = "p95"
max = 20
unit = "ms"
quick = true
runner = "reference"
profile = "local"
note = "SPK-07 draft budget; frame intervals are floats from requestAnimationFrame"

# Key down to the end of the second painted frame in the 200-row child table,
# including the totals recompute.
[[budget]]
# reference: 4-core laptop with a GPU, no network throttling. SPK-07's draft
# budget is p95 <= 50 ms; AOT measured p95 62.9 ms on CPU-rendered WebGL, where
# the two-frame measure alone floors at ~33 ms, so the number waits for the
# SPK-07.T2 re-run on a GPU laptop. It is not relaxed here.
id = "browser.child-edit.key"
metric = "p95"
max = 50
unit = "ms"
quick = true
runner = "reference"
profile = "local"
note = "SPK-07 draft budget; needs the T2 child grid before it means cell editing"

# Ten tabs open: the page's JS heap plus the WebAssembly linear memory.
[[budget]]
# reference: 4-core laptop with a GPU, 10 tabs alternating the 200-row form and
# the 100,000-row list, unthrottled. SPK-07's draft budget is <= 600 MB and the
# AOT build measured 344 MB (179 MB JS heap + 166 MB Wasm).
id = "browser.tabs.memory"
metric = "max"
max = 629145600
unit = "bytes"
quick = true
runner = "reference"
profile = "local"
note = "600 MB = 629145600 bytes; JS heap + sum of WebAssembly linear memories"
