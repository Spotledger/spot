[package]
name = "spot-sdk-conformance"
description = "The guest-SDK conformance contract kit (WP-STR-07.T1): loads a guest component the way spot-wasm loads an app, checks the world contract (parses, exports on-event, imports within the granted set) and runs the sample-app contract cases from tools/sdk-conformance/cases.json, emitting one JSON result"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.98.1"

[[bin]]
name = "spot-sdk-conformance"
path = "src/main.rs"

[dependencies]
# The host the contract is defined against. The runner is deliberately the only place that
# links it, so the Python harness stays standard-library-only and container-free.
spot-wasm = { path = "../../../crates/framework/spot-wasm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }

# Detached from the spot workspace on purpose, like spot-sample-app/tests/app-validate: the
# runner is a tool, not a workspace member, so it never enters the root workspace's dependency
# or lint graph (and the WP's owned paths stay `sdk/templates/` and `tools/sdk-conformance/`).
[workspace]

# The workspace lints, spelled out because this crate sits outside the workspace.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
float_arithmetic = "deny"
unwrap_used = "deny"
expect_used = "warn"
