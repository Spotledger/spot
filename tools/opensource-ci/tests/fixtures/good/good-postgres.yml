name: t
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
env:
  SPOT_REQUIRE_PG: 1
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash tools/ci/start-postgres.sh
      - run: cargo test --workspace
