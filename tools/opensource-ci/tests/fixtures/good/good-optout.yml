name: t
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    # lint-allow: no-postgres pure unit tests of a tool, no database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 tools/ci/run_python_suites.py
