x-spot-error-codes:
  # code: [HTTP status, retryable, meaning]
  mgmt.unauthenticated: [401, false, "No verified client certificate (checked before any body is read), or the certificate is not trusted, expired or revoked."]
  mgmt.forbidden: [403, false, "The operator principal may not call this operation."]
  mgmt.unknown_operation: [404, false, "No operation with this id in the catalogue that the caller may see."]
  mgmt.unknown_command: [404, false, "No command with this id that the caller may see."]
  mgmt.invalid_parameter: [422, false, "A parameter is missing, unknown or out of bounds; details.parameter names it, never its value."]
  mgmt.signature_invalid: [401, false, "The signed envelope is missing, malformed, wrongly signed, signed by an untrusted key, for another audience, or short of the signatures the operation needs."]
  mgmt.signature_expired: [401, false, "The envelope is expired, issued in the future beyond the clock skew, or lives longer than 10 minutes."]
  mgmt.replayed: [409, false, "The nonce or command id was already used inside the durable replay window."]
  mgmt.approval_required: [403, false, "The operation needs approval records (WP-MIG-04 or WP-ADM-03) that the command does not carry or that do not verify."]
  mgmt.conflict: [409, true, "Another command holds this operation's lock (or the site-wide exclusive lock of a destructive operation); retry after Retry-After."]
  mgmt.refused_by_policy: [403, false, "The site's policy refuses the command (a maintenance window, a hold or a separation-of-duties rule); the reason code is audited."]
  mgmt.not_available_here: [501, false, "The operation is not supported on this platform."]
  mgmt.rate_limited: [429, true, "Too many requests or too many concurrent commands; wait for Retry-After."]
  mgmt.body_too_large: [413, false, "The body is larger than 64 KiB."]
  mgmt.internal: [500, false, "An unexpected server error; the request id identifies it in the logs. The message never carries a secret, a path outside the site root or a stack."]
