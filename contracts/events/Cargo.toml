[package]
name = "spot-events-contract"
version = "0.1.0"
description = "Event and outbox schema contract v0.1 for the Spotledger Platform: payload metadata, the external envelope, payload schemas and the compatibility checker"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spot-storage-contract = { path = "../storage" }
# JSON payloads and the external envelope; decimals stay strings (ADR-055 value encoding).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.55", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
uuid = { version = "1.26", default-features = false, features = ["std"] }

[lints]
workspace = true
