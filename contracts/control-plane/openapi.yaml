x-spot-error-codes:
  # code: [HTTP status, retryable, meaning]
  cp.unauthenticated: [401, false, "No verified client certificate (checked before any body is read), or the certificate is untrusted, expired, revoked, or a host that is not enrolled."]
  cp.forbidden: [403, false, "The principal may not call this operation (a host calling an operator operation, or the reverse)."]
  cp.not_found: [404, false, "No such tenant, workflow, move, licence, grant or rollout in the caller's scope: the same answer for one that is missing and one that is out of scope, so scope is not an oracle."]
  cp.invalid: [422, false, "The request is not valid; details.fields names field paths only, never values."]
  cp.signature_invalid: [401, false, "The signed command envelope is missing, wrong, for another audience, expired, or does not bind this body."]
  cp.replayed: [409, false, "The nonce, command id or idempotency key was already used with a different body or window."]
  cp.conflict: [409, true, "Another workflow or command holds this tenant; retry after Retry-After."]
  cp.approval_required: [403, false, "The operation needs the signed approval records the request does not carry."]
  cp.limit_exceeded: [403, false, "A quota or licence limit would be exceeded; details.limit names the limit, never another tenant's numbers."]
  cp.not_confirmable: [409, false, "The deprovisioning cannot be confirmed yet: the delay has not passed, or the licence's retention period has not ended."]
  cp.licence_invalid: [422, false, "The licence request is not valid (unknown plan, a period outside the contract, or a conflicting licence)."]
  cp.cardinality_rejected: [422, false, "The telemetry batch is over the series cardinality budget; details.budget names it."]
  cp.rate_limited: [429, true, "Too many requests; wait for Retry-After."]
  cp.body_too_large: [413, false, "The body is larger than the operation allows (256 KiB for a telemetry batch)."]
  cp.internal: [500, false, "An unexpected server error; the request id identifies it in the logs."]
