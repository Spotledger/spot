        repeat is counted once (`duplicates`). Audience: the enrolled tenant host behind the verified
        client certificate (ADR-083: never the consumer audience). Permission: the host's own
        certificate. Rate class `bulk`. Requires an `Idempotency-Key`. Audited: who, what and the
