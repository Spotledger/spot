openapi: 3.1.1
info:
  title: Spotledger control-plane API
  version: 0.1.0
  summary: "The service API for tenants, placements, licences, health, usage, quotas, support grants, moves and rollouts (ADR-098)."
  description: |
    ## ADR note

    The control plane (`docs/adr/ADR-098-control-plane-api-contract-v0.1.md`) is the service that the console, the `spot` CLI, tenant hosts and host agents call about tenants, placements, licences, health, usage, quotas, support grants, moves and rollouts. WS18 exists as libraries and PostgreSQL stores (`spot-tenancy`, `spot-license`, `spot-metering`, `spot-fleet-health`, `spot-support-grants`, `spot-tenant-move`, `spot-fleet-rollout`, `spot-links`); this contract is what serves them. Draft, awaiting architecture-owner approval.

    ## Two audiences, two prefixes

    **Operator** (`/cp/v1/...`): Mutual TLS with an operator client certificate, and the signed command envelope of the management API (`contracts/management-api`) in the `X-Spot-Command` header for every mutation. **Tenant host and agent** (`/cp/v1/host/...`): Mutual TLS with the host's enrolled certificate (`host_mtls`), no operator rights; the agent's own long poll and result report are in the agent-channel contract. A host calling an operator operation, or the reverse, is `403 cp.forbidden`; a missing certificate is `401 cp.unauthenticated` before any body is read.

    ## Rules

    - **The control plane never reads tenant business data**: only counts, sizes, health findings, usage and licence facts cross this API.
    - **Scope.** Every mutation names a tenant by id and is checked against the operator's scope (a regional operator cannot touch another region's tenants). A tenant that is missing and one that is out of scope are the same `404 cp.not_found`, so scope is not an oracle.
    - **Idempotency.** Every create carries an `Idempotency-Key`; a repeat returns the first answer.
    - **Workflows.** A provisioning workflow is resumable and the API exposes its step state (`cp_workflow_get`).
    - **Deprovisioning is two-step**: a request, then a confirmation after a delay with a signed approval; data is never deleted before the retention period of the licence.
    - **Limits.** A quota or licence limit answers `403 cp.limit_exceeded` with the limit name, never another tenant's numbers. Telemetry batches are at most 256 KiB and within the series cardinality budget of `spot-fleet-health::SeriesBudget` (`422 cp.cardinality_rejected`).
    - **Audit.** Every request that reaches authentication is audited with the principal, the operation, the tenant and the outcome, refusals included.

    ## What the console needs (ADM-09, UI stage)

    The console starts from: `cp_tenant_list|get|create|suspend|resume|deprovision`, `cp_workflow_get`, `cp_health_list`, `cp_usage_list`, `cp_quota_list|put`, `cp_licence_list|issue|renew|revoke`, `cp_support_grant_*`, `cp_rollout_*`, `cp_move_*`.

    ## Versioning

    Paths are prefixed `/cp/v1`. Additive changes bump the minor version; clients ignore unknown response fields.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://{host}:{port}
    description: The control plane (mutual TLS).
    variables:
      host: {default: control.example.test}
      port: {default: '8443'}
security:
  - operator_mtls: []
tags:
  - name: control

paths:
  /cp/v1/live:
    get:
      tags: [control]
      operationId: cp_live
      summary: "Liveness"
      description: |
        Liveness. Unauthenticated liveness only. Audience: anyone, no bearer token (the tenant comes
        from the site). Permission: none (liveness only). Rate class `interactive`.
      security: []
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpLiveResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/tenants:
    get:
      tags: [control]
      operationId: cp_tenant_list
      summary: "The tenants in the caller's scope"
      description: |
        The tenants in the caller's scope. Audience: an operator principal behind the verified client
        certificate (ADR-083: never the consumer audience). Permission: an operator principal (only
        tenants in its scope are listed). Rate class `interactive`.
      parameters:
        - {"name": "status", "in": "query", "required": false, "schema": {"type": "string", "maxLength": 30}}
        - {"name": "region", "in": "query", "required": false, "schema": {"type": "string", "maxLength": 60}}
        - {"name": "q", "in": "query", "required": false, "schema": {"type": "string", "maxLength": 100}}
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpTenantListResponse"}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [control]
      operationId: cp_tenant_create
      summary: "Create a tenant (starts the provisioning workflow)"
      description: |
        Create a tenant (starts the provisioning workflow). Answers `202`; the provisioning workflow is
        resumable and `cp_workflow_get` shows its step state. The first administrator is invited by mail
        at the end of the workflow; no credential is in any answer. Audience: an operator principal
        behind the verified client certificate (ADR-083: never the consumer audience). Permission: the
        operator permission `tenants.create` in the target region. Rate class `bulk`. Needs the signed
        command envelope in the `X-Spot-Command` header (the rules of the management API: Ed25519,
        audience, 10 minutes, nonce); it binds the body by its SHA-256 digest. Requires an
        `Idempotency-Key`. Audited: who, what and the outcome; a refusal is audited too.
      parameters:
        - {"$ref": "#/components/parameters/SignedCommand"}
        - {"$ref": "#/components/parameters/IdempotencyKeyRequired"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CpTenantCreateRequest"}}}}
      responses:
        "202": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpTenantCreateResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/tenants/{id}:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    get:
      tags: [control]
      operationId: cp_tenant_get
      summary: "One tenant"
      description: |
        One tenant. Audience: an operator principal behind the verified client certificate (ADR-083:
        never the consumer audience). Permission: an operator principal in the tenant's scope. Rate
        class `interactive`. A cross-tenant id answers `404 cp.not_found` exactly like a missing one.
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpTenantGetResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/tenants/{id}/suspend:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [control]
      operationId: cp_tenant_suspend
      summary: "Suspend a tenant"
      description: |
        Suspend a tenant. Suspends the tenant (it refuses sign-in and writes; data is kept). Audience:
        an operator principal behind the verified client certificate (ADR-083: never the consumer
        audience). Permission: the operator permission `tenants.suspend` in the tenant's scope. Rate
        class `interactive`. Needs the signed command envelope in the `X-Spot-Command` header (the rules
        of the management API: Ed25519, audience, 10 minutes, nonce); it binds the body by its SHA-256
        digest. Takes no `Idempotency-Key`: a repeat is a repeat of the action. Audited: who, what and
        the outcome; a refusal is audited too. A cross-tenant id answers `404 cp.not_found` exactly like
        a missing one.
      parameters:
        - {"$ref": "#/components/parameters/SignedCommand"}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpTenantSuspendResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/tenants/{id}/resume:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [control]
      operationId: cp_tenant_resume
      summary: "Resume a tenant"
      description: |
        Resume a tenant. Resumes a suspended tenant. Audience: an operator principal behind the verified
        client certificate (ADR-083: never the consumer audience). Permission: the operator permission
        `tenants.resume` in the tenant's scope. Rate class `interactive`. Needs the signed command
        envelope in the `X-Spot-Command` header (the rules of the management API: Ed25519, audience, 10
        minutes, nonce); it binds the body by its SHA-256 digest. Takes no `Idempotency-Key`: a repeat
        is a repeat of the action. Audited: who, what and the outcome; a refusal is audited too. A
        cross-tenant id answers `404 cp.not_found` exactly like a missing one.
      parameters:
        - {"$ref": "#/components/parameters/SignedCommand"}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpTenantResumeResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/tenants/{id}/deprovision:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [control]
      operationId: cp_tenant_deprovision_request
      summary: "Request deprovisioning (step one of two)"
      description: |
        Request deprovisioning (step one of two). Deprovisioning is a two-step: this request records it
        and returns when it can be confirmed; nothing is deleted. Confirmation needs a delay and a
        signed approval, and data is never deleted before the retention period of the licence ends.
        Audience: an operator principal behind the verified client certificate (ADR-083: never the
        consumer audience). Permission: the operator permission `tenants.deprovision` in the tenant's
        scope. Rate class `interactive`. Needs the signed command envelope in the `X-Spot-Command`
        header (the rules of the management API: Ed25519, audience, 10 minutes, nonce); it binds the
        body by its SHA-256 digest. Requires an `Idempotency-Key`. Audited: who, what and the outcome; a
        refusal is audited too. A cross-tenant id answers `404 cp.not_found` exactly like a missing one.
      parameters:
        - {"$ref": "#/components/parameters/SignedCommand"}
        - {"$ref": "#/components/parameters/IdempotencyKeyRequired"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CpTenantDeprovisionRequestRequest"}}}}
      responses:
        "202": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpTenantDeprovisionRequestResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/tenants/{id}/deprovision/confirm:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [control]
      operationId: cp_tenant_deprovision_confirm
      summary: "Confirm deprovisioning (step two of two)"
      description: |
        Confirm deprovisioning (step two of two). Audience: an operator principal behind the verified
        client certificate (ADR-083: never the consumer audience). Permission: the operator permission
        `tenants.deprovision` and a second approver's signed approval. Rate class `interactive`. Needs
        the signed command envelope in the `X-Spot-Command` header (the rules of the management API:
        Ed25519, audience, 10 minutes, nonce); it binds the body by its SHA-256 digest. Requires an
        `Idempotency-Key`. Audited: who, what and the outcome; a refusal is audited too. A cross-tenant
        id answers `404 cp.not_found` exactly like a missing one.
      parameters:
        - {"$ref": "#/components/parameters/SignedCommand"}
        - {"$ref": "#/components/parameters/IdempotencyKeyRequired"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CpTenantDeprovisionConfirmRequest"}}}}
      responses:
        "202": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpTenantDeprovisionConfirmResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/workflows/{id}:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    get:
      tags: [control]
      operationId: cp_workflow_get
      summary: "A workflow and its step state"
      description: |
        A workflow and its step state. Audience: an operator principal behind the verified client
        certificate (ADR-083: never the consumer audience). Permission: an operator principal in the
        workflow's tenant scope. Rate class `interactive`. A cross-tenant id answers `404 cp.not_found`
        exactly like a missing one.
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpWorkflowGetResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/placements:
    get:
      tags: [control]
      operationId: cp_placement_list
      summary: "Where tenants run"
      description: |
        Where tenants run. Audience: an operator principal behind the verified client certificate
        (ADR-083: never the consumer audience). Permission: an operator principal (scoped). Rate class
        `interactive`.
      parameters:
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpPlacementListResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/clusters:
    get:
      tags: [control]
      operationId: cp_cluster_list
      summary: "The clusters"
      description: |
        The clusters. Audience: an operator principal behind the verified client certificate (ADR-083:
        never the consumer audience). Permission: an operator principal (scoped). Rate class
        `interactive`.
      parameters:
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpClusterListResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/moves:
    post:
      tags: [control]
      operationId: cp_move_start
      summary: "Request a tenant move"
      description: |
        Request a tenant move. Audience: an operator principal behind the verified client certificate
        (ADR-083: never the consumer audience). Permission: the operator permission `tenants.move` in
        the tenant's scope. Rate class `bulk`. Needs the signed command envelope in the `X-Spot-Command`
        header (the rules of the management API: Ed25519, audience, 10 minutes, nonce); it binds the
        body by its SHA-256 digest. Requires an `Idempotency-Key`. Audited: who, what and the outcome; a
        refusal is audited too. A cross-tenant id answers `404 cp.not_found` exactly like a missing one.
      parameters:
        - {"$ref": "#/components/parameters/SignedCommand"}
        - {"$ref": "#/components/parameters/IdempotencyKeyRequired"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CpMoveStartRequest"}}}}
      responses:
        "202": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpMoveStartResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/moves/{id}:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    get:
      tags: [control]
      operationId: cp_move_get
      summary: "The status of a move"
      description: |
        The status of a move. Audience: an operator principal behind the verified client certificate
        (ADR-083: never the consumer audience). Permission: an operator principal in the tenant's scope.
        Rate class `interactive`. A cross-tenant id answers `404 cp.not_found` exactly like a missing
        one.
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpMoveGetResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/moves/{id}/cancel:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [control]
      operationId: cp_move_cancel
      summary: "Cancel a move"
      description: |
        Cancel a move. Only before cutover; after it the answer is `409 cp.conflict`. Audience: an
        operator principal behind the verified client certificate (ADR-083: never the consumer
        audience). Permission: the operator permission `tenants.move` in the tenant's scope. Rate class
        `interactive`. Needs the signed command envelope in the `X-Spot-Command` header (the rules of
        the management API: Ed25519, audience, 10 minutes, nonce); it binds the body by its SHA-256
        digest. Takes no `Idempotency-Key`: a repeat is a repeat of the action. Audited: who, what and
        the outcome; a refusal is audited too. A cross-tenant id answers `404 cp.not_found` exactly like
        a missing one.
      parameters:
        - {"$ref": "#/components/parameters/SignedCommand"}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpMoveCancelResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/licences:
    get:
      tags: [control]
      operationId: cp_licence_list
      summary: "The licences"
      description: |
        The licences. Audience: an operator principal behind the verified client certificate (ADR-083:
        never the consumer audience). Permission: an operator principal (scoped). Rate class
        `interactive`.
      parameters:
        - {"name": "tenant", "in": "query", "required": false, "schema": {"type": "string", "maxLength": 64}}
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpLicenceListResponse"}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [control]
      operationId: cp_licence_issue
      summary: "Issue a licence"
      description: |
        Issue a licence. Audience: an operator principal behind the verified client certificate
        (ADR-083: never the consumer audience). Permission: the operator permission `licences.issue` in
        the tenant's scope. Rate class `interactive`. Needs the signed command envelope in the
        `X-Spot-Command` header (the rules of the management API: Ed25519, audience, 10 minutes, nonce);
        it binds the body by its SHA-256 digest. Requires an `Idempotency-Key`. Audited: who, what and
        the outcome; a refusal is audited too. A cross-tenant id answers `404 cp.not_found` exactly like
        a missing one.
      parameters:
        - {"$ref": "#/components/parameters/SignedCommand"}
        - {"$ref": "#/components/parameters/IdempotencyKeyRequired"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CpLicenceIssueRequest"}}}}
      responses:
        "201": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpLicenceIssueResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/licences/{id}/renew:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [control]
      operationId: cp_licence_renew
      summary: "Renew a licence"
      description: |
        Renew a licence. Audience: an operator principal behind the verified client certificate
        (ADR-083: never the consumer audience). Permission: the operator permission `licences.issue`.
        Rate class `interactive`. Needs the signed command envelope in the `X-Spot-Command` header (the
        rules of the management API: Ed25519, audience, 10 minutes, nonce); it binds the body by its
        SHA-256 digest. Requires an `Idempotency-Key`. Audited: who, what and the outcome; a refusal is
        audited too. A cross-tenant id answers `404 cp.not_found` exactly like a missing one.
      parameters:
        - {"$ref": "#/components/parameters/SignedCommand"}
        - {"$ref": "#/components/parameters/IdempotencyKeyRequired"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CpLicenceRenewRequest"}}}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpLicenceRenewResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/licences/{id}/revoke:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [control]
      operationId: cp_licence_revoke
      summary: "Revoke a licence"
      description: |
        Revoke a licence. Audience: an operator principal behind the verified client certificate
        (ADR-083: never the consumer audience). Permission: the operator permission `licences.revoke`.
        Rate class `interactive`. Needs the signed command envelope in the `X-Spot-Command` header (the
        rules of the management API: Ed25519, audience, 10 minutes, nonce); it binds the body by its
        SHA-256 digest. Takes no `Idempotency-Key`: a repeat is a repeat of the action. Audited: who,
        what and the outcome; a refusal is audited too. A cross-tenant id answers `404 cp.not_found`
        exactly like a missing one.
      parameters:
        - {"$ref": "#/components/parameters/SignedCommand"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CpLicenceRevokeRequest"}}}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpLicenceRevokeResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/tenants/{id}/entitlements:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    get:
      tags: [control]
      operationId: cp_entitlement_list
      summary: "The entitlements of a tenant"
      description: |
        The entitlements of a tenant. Audience: an operator principal behind the verified client
        certificate (ADR-083: never the consumer audience). Permission: an operator principal in the
        tenant's scope. Rate class `interactive`. A cross-tenant id answers `404 cp.not_found` exactly
        like a missing one.
      parameters:
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpEntitlementListResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/health:
    get:
      tags: [control]
      operationId: cp_health_list
      summary: "Health per tenant and node"
      description: |
        Health per tenant and node. Audience: an operator principal behind the verified client
        certificate (ADR-083: never the consumer audience). Permission: an operator principal (scoped).
        Rate class `interactive`.
      parameters:
        - {"name": "tenant", "in": "query", "required": false, "schema": {"type": "string", "maxLength": 64}}
        - {"name": "node", "in": "query", "required": false, "schema": {"type": "string", "maxLength": 100}}
        - {"name": "state", "in": "query", "required": false, "schema": {"type": "string", "enum": ["green", "amber", "red"]}}
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpHealthListResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /cp/v1/usage:
    get:
      tags: [control]
      operationId: cp_usage_list
      summary: "Usage per period and meter"
      description: |
        Usage per period and meter. Quantities are decimal strings, never floats. Audience: an operator
        principal behind the verified client certificate (ADR-083: never the consumer audience).
        Permission: an operator principal (scoped). Rate class `interactive`.
      parameters:
        - {"name": "tenant", "in": "query", "required": true, "schema": {"type": "string", "maxLength": 64}}
        - {"name": "period", "in": "query", "required": false, "schema": {"type": "string", "maxLength": 20}}
        - {"name": "meter", "in": "query", "required": false, "schema": {"type": "string", "maxLength": 100}}
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
