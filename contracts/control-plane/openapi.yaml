  /cp/v1/host/heartbeat:
    post:
      tags: [control]
      operationId: cp_host_heartbeat
      summary: "A tenant host's telemetry batch"
      description: |
        A tenant host's telemetry batch. At most 256 KiB; the series cardinality budget is that of
        `spot-fleet-health::SeriesBudget` (`422 cp.cardinality_rejected` over it). Counts, sizes and
        health only: the control plane never reads tenant business data. Audience: the enrolled tenant
        host behind the verified client certificate (ADR-083: never the consumer audience). Permission:
        the host's own certificate (it may report only for itself). Rate class `bulk`. Takes no
        `Idempotency-Key`: a repeat is a repeat of the action. Audited: who, what and the outcome; a
        refusal is audited too.
      security:
        - host_mtls: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CpHostHeartbeatRequest"}}}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/CpHostHeartbeatResponse"}}}}
