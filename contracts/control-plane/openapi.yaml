        default: {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    operator_mtls:
      type: mutualTLS
      description: An operator client certificate (TLS 1.3); mutations also carry the signed command envelope.
    host_mtls:
      type: mutualTLS
      description: The enrolled host's client certificate (TLS 1.3); no operator rights.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, pattern: '^[\x21-\x7e]{1,128}$'}
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 1 to 128 visible ASCII characters; a replay returns the first answer.
      schema: {type: string, pattern: '^[\x21-\x7e]{1,128}$'}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version the change is based on, as returned in `ETag`.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    SignedCommand:
      name: X-Spot-Command
      in: header
      required: true
      description: The signed command envelope (base64url of the `spot-signed-command` JSON); it binds the body by its SHA-256 digest.
      schema: {type: string, maxLength: 16384}
  responses:
    Error:
      description: Any error. The status and `error.code` follow the registry.
      headers:
        Retry-After:
          description: Seconds to wait, on 429 and 503.
          schema: {type: integer, minimum: 0}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
  schemas:
    Identifier:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,62}$'
    RecordId:
      type: string
      description: A UUIDv7, canonical lower-case hyphenated form.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    ErrorCode:
      type: string
      pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, request_id]
          properties:
            code: {$ref: "#/components/schemas/ErrorCode"}
            message: {type: string, maxLength: 1000}
            retryable: {type: boolean, description: True when the same request may succeed later unchanged.}
            request_id: {type: string, maxLength: 200}
            details: {type: object, maxProperties: 20, description: "Code-specific data, documented per code; never a secret, a path outside the site root or a stack."}
    CpTenant: {"type": "object", "additionalProperties": false, "required": ["id", "name", "region", "status", "created_at"], "properties": {"id": {"type": "string", "maxLength": 64}, "name": {"type": "string", "maxLength": 200}, "region": {"type": "string", "maxLength": 60}, "cluster": {"type": "string", "maxLength": 100}, "status": {"type": "string", "enum": ["provisioning", "active", "suspended", "deprovisioning", "deprovisioned", "failed"]}, "plan": {"type": "string", "maxLength": 60}, "created_at": {"type": "string", "format": "date-time", "maxLength": 40}, "workflow_id": {"type": ["string", "null"], "maxLength": 64}}}
    CpWorkflow: {"type": "object", "additionalProperties": false, "description": "The state of a resumable workflow and its journal of steps; no tenant business data.", "required": ["id", "kind", "state", "steps"], "properties": {"id": {"type": "string", "maxLength": 64}, "kind": {"type": "string", "enum": ["provision", "deprovision", "move", "rollout"]}, "state": {"type": "string", "enum": ["pending", "running", "waiting", "succeeded", "failed", "cancelled"]}, "steps": {"type": "array", "maxItems": 100, "items": {"type": "object", "additionalProperties": false, "required": ["name", "state"], "properties": {"name": {"type": "string", "maxLength": 100}, "state": {"type": "string", "enum": ["pending", "running", "done", "failed", "skipped"]}, "at": {"type": ["string", "null"], "format": "date-time", "maxLength": 40}, "code": {"type": ["string", "null"], "maxLength": 100}}}}, "resumable": {"type": "boolean"}}}
    CpMove: {"type": "object", "additionalProperties": false, "required": ["id", "tenant_id", "to_cluster", "state"], "properties": {"id": {"type": "string", "maxLength": 64}, "tenant_id": {"type": "string", "maxLength": 64}, "to_cluster": {"type": "string", "maxLength": 100}, "state": {"type": "string", "enum": ["requested", "preparing", "copying", "cutover", "done", "failed", "cancelled"]}, "workflow_id": {"type": "string", "maxLength": 64}, "created_at": {"type": "string", "format": "date-time", "maxLength": 40}}}
    CpLicence: {"type": "object", "additionalProperties": false, "required": ["id", "tenant_id", "plan", "status", "starts_at", "ends_at"], "properties": {"id": {"type": "string", "maxLength": 64}, "tenant_id": {"type": "string", "maxLength": 64}, "plan": {"type": "string", "maxLength": 60}, "status": {"type": "string", "enum": ["active", "expired", "revoked"]}, "starts_at": {"type": "string", "format": "date-time", "maxLength": 40}, "ends_at": {"type": "string", "format": "date-time", "maxLength": 40}, "retention_days": {"type": "integer", "minimum": 0, "maximum": 36500}, "entitlements": {"type": "array", "maxItems": 200, "items": {"type": "string", "maxLength": 100}}}}
    CpHealth: {"type": "object", "additionalProperties": false, "description": "The three-colour state of `spot-fleet-health` and its findings: counts, sizes and codes only, never tenant business data.", "required": ["state", "at"], "properties": {"tenant_id": {"type": ["string", "null"], "maxLength": 64}, "node": {"type": ["string", "null"], "maxLength": 100}, "state": {"type": "string", "enum": ["green", "amber", "red"]}, "findings": {"type": "array", "maxItems": 50, "items": {"type": "object", "additionalProperties": false, "required": ["code", "severity", "since"], "properties": {"code": {"type": "string", "maxLength": 100}, "severity": {"type": "string", "enum": ["info", "warning", "critical"]}, "since": {"type": "string", "format": "date-time", "maxLength": 40}}}}, "at": {"type": "string", "format": "date-time", "maxLength": 40}}}
    CpSupportGrant: {"type": "object", "additionalProperties": false, "required": ["id", "tenant_id", "scope", "starts_at", "ends_at", "status"], "properties": {"id": {"type": "string", "maxLength": 64}, "tenant_id": {"type": "string", "maxLength": 64}, "scope": {"type": "string", "maxLength": 500}, "starts_at": {"type": "string", "format": "date-time", "maxLength": 40}, "ends_at": {"type": "string", "format": "date-time", "maxLength": 40}, "status": {"type": "string", "enum": ["active", "expired", "revoked"]}, "customer_record": {"type": "string", "maxLength": 64}}}
    CpRollout: {"type": "object", "additionalProperties": false, "required": ["id", "target_version", "state", "waves"], "properties": {"id": {"type": "string", "maxLength": 64}, "target_version": {"type": "string", "maxLength": 40}, "state": {"type": "string", "enum": ["planned", "running", "paused", "done", "failed"]}, "waves": {"type": "array", "maxItems": 50, "items": {"type": "object", "additionalProperties": false, "required": ["index", "tenants", "state"], "properties": {"index": {"type": "integer", "minimum": 0}, "tenants": {"type": "array", "maxItems": 500, "items": {"type": "string", "maxLength": 64}}, "state": {"type": "string", "enum": ["pending", "running", "done", "failed"]}}}}, "workflow_id": {"type": "string", "maxLength": 64}}}
    CpLiveResponse: {"type": "object", "additionalProperties": false, "required": ["data"], "properties": {"data": {"type": "object", "additionalProperties": false, "required": ["status"], "properties": {"status": {"type": "string", "const": "live"}}}}}
    CpTenantListResponse: {"type": "object", "additionalProperties": false, "required": ["data", "next_cursor"], "properties": {"data": {"type": "array", "maxItems": 100, "items": {"$ref": "#/components/schemas/CpTenant"}}, "next_cursor": {"type": ["string", "null"], "maxLength": 2048}}}
    CpTenantCreateRequest: {"type": "object", "additionalProperties": false, "required": ["name", "region", "plan", "admin_email"], "properties": {"name": {"type": "string", "maxLength": 200, "minLength": 1}, "region": {"type": "string", "maxLength": 60}, "plan": {"type": "string", "maxLength": 60}, "admin_email": {"type": "string", "maxLength": 320}}}
    CpTenantCreateResponse: {"type": "object", "additionalProperties": false, "required": ["data"], "properties": {"data": {"type": "object", "additionalProperties": false, "required": ["tenant", "workflow_id"], "properties": {"tenant": {"$ref": "#/components/schemas/CpTenant"}, "workflow_id": {"type": "string", "maxLength": 64}}}}}
    CpTenantGetResponse: {"type": "object", "additionalProperties": false, "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/CpTenant"}}}
    CpTenantSuspendResponse: {"type": "object", "additionalProperties": false, "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/CpTenant"}}}
    CpTenantResumeResponse: {"type": "object", "additionalProperties": false, "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/CpTenant"}}}
    CpTenantDeprovisionRequestRequest: {"type": "object", "additionalProperties": false, "required": ["reason"], "properties": {"reason": {"type": "string", "maxLength": 500, "minLength": 1}}}
    CpTenantDeprovisionRequestResponse: {"type": "object", "additionalProperties": false, "required": ["data"], "properties": {"data": {"type": "object", "additionalProperties": false, "required": ["request_id", "confirmable_after", "retention_ends"], "properties": {"request_id": {"type": "string", "maxLength": 64}, "confirmable_after": {"type": "string", "format": "date-time", "maxLength": 40}, "retention_ends": {"type": "string", "format": "date-time", "maxLength": 40}}}}}
    CpTenantDeprovisionConfirmRequest: {"type": "object", "additionalProperties": false, "required": ["request_id", "approval"], "properties": {"request_id": {"type": "string", "maxLength": 64}, "approval": {"type": "string", "maxLength": 16384}}}
    CpTenantDeprovisionConfirmResponse: {"type": "object", "additionalProperties": false, "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/CpWorkflow"}}}
    CpWorkflowGetResponse: {"type": "object", "additionalProperties": false, "required": ["data"], "properties": {"data": {"$ref": "#/components/schemas/CpWorkflow"}}}
    CpPlacementListResponse: {"type": "object", "additionalProperties": false, "required": ["data", "next_cursor"], "properties": {"data": {"type": "array", "maxItems": 100, "items": {"type": "object", "additionalProperties": false, "required": ["tenant_id", "cluster", "node", "region"], "properties": {"tenant_id": {"type": "string", "maxLength": 64}, "cluster": {"type": "string", "maxLength": 100}, "node": {"type": "string", "maxLength": 100}, "region": {"type": "string", "maxLength": 60}}}}, "next_cursor": {"type": ["string", "null"], "maxLength": 2048}}}
