  /api/v1/identity/users:
    get:
      tags: [identity]
      operationId: identity_user_list
      summary: "The users of the tenant"
      description: |
        The users of the tenant. Paged, `limit` 1 to 100. A caller sees only users of their own tenant;
        consumers (ADR-083) are not users and are never listed. Audience: staff (ADR-083: never the
        consumer audience). Permission: the platform permission `identity.read` (held by the Tenant
        Administrator by default). Rate class `interactive`.
      parameters:
        - {"name": "status", "in": "query", "required": false, "schema": {"type": "string", "enum": ["invited", "active", "disabled", "anonymised"]}}
        - {"name": "q", "in": "query", "required": false, "description": "A prefix of the name or e-mail address.", "schema": {"type": "string", "maxLength": 100}}
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/IdentityUserListResponse"}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [identity]
      operationId: identity_user_create
      summary: "Create or invite a user"
      description: |
        Create or invite a user. With `invite: true` (the default) the user is created `invited` and the
        invitation token is delivered by mail only: it is never in the response. With `invite: false`
        the user is created `active` without a password and must be given one by recovery. Audience:
        staff and partner (ADR-083: never the consumer audience). Permission: the platform permission
        `identity.manage` (held by the Tenant Administrator by default). Rate class `interactive`. Needs
        a recent step-up (`403 auth.step_up_required`). Requires an `Idempotency-Key`. Audited: who,
        what and the outcome; a refusal is audited too.
      parameters:
        - {"$ref": "#/components/parameters/IdempotencyKeyRequired"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IdentityUserCreateRequest"}}}}
      responses:
        "201": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/IdentityUserCreateResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/identity/users/{id}:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    get:
      tags: [identity]
      operationId: identity_user_get
      summary: "One user"
      description: |
        One user. Audience: staff (ADR-083: never the consumer audience). Permission: the platform
        permission `identity.read` (held by the Tenant Administrator by default). Rate class
        `interactive`. A cross-tenant id answers `404 identity.not_found` exactly like a missing one.
      responses:
        "200": {description: OK., headers: {"ETag": {"description": "The user's version.", "schema": {"type": "string", "maxLength": 40}}}, content: {application/json: {schema: {$ref: "#/components/schemas/IdentityUserGetResponse"}}}}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [identity]
      operationId: identity_user_patch
      summary: "Change a user's profile"
      description: |
        Change a user's profile. Merge patch of the fields shown; the sign-in name and e-mail address
        change through recovery, not here. Roles change only through assignments. Audience: staff and
        partner (ADR-083: never the consumer audience). Permission: the platform permission
        `identity.manage` (held by the Tenant Administrator by default). Rate class `interactive`. Needs
        a recent step-up (`403 auth.step_up_required`). Takes no `Idempotency-Key`: a repeat is a repeat
        of the action. Requires `If-Match`. Audited: who, what and the outcome; a refusal is audited
        too. A cross-tenant id answers `404 identity.not_found` exactly like a missing one.
      parameters:
        - {"$ref": "#/components/parameters/IfMatch"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IdentityUserPatchRequest"}}}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/IdentityUserPatchResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/identity/users/{id}/disable:
    parameters:
