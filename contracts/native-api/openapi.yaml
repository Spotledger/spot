    post:
      tags: [identity]
      operationId: identity_user_disable
      summary: "Disable a user"
      description: |
        Disable a user. Disables the user and ends their sessions and API keys at once (the leaver
        actions); the answer lists the actions performed. Audience: staff and partner (ADR-083: never
        the consumer audience). Permission: the platform permission `identity.manage` (held by the
        Tenant Administrator by default). Rate class `interactive`. Needs a recent step-up (`403
        auth.step_up_required`). Takes no `Idempotency-Key`: a repeat is a repeat of the action.
        Audited: who, what and the outcome; a refusal is audited too. A cross-tenant id answers `404
        identity.not_found` exactly like a missing one.
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/IdentityUserDisableResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/identity/users/{id}/enable:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [identity]
      operationId: identity_user_enable
      summary: "Enable a user"
      description: |
        Enable a user. Enables a disabled user; the user signs in with the credentials they had.
        Audience: staff and partner (ADR-083: never the consumer audience). Permission: the platform
        permission `identity.manage` (held by the Tenant Administrator by default). Rate class
