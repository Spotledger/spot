  /api/v1/identity/assignments:
    get:
      tags: [identity]
      operationId: identity_assignment_list
      summary: "The role assignments"
      description: |
        The role assignments. Audience: staff (ADR-083: never the consumer audience). Permission: the
        platform permission `identity.read` (held by the Tenant Administrator by default). Rate class
        `interactive`.
      parameters:
        - {"name": "user", "in": "query", "required": false, "schema": {"$ref": "#/components/schemas/RecordId"}}
        - {"name": "role", "in": "query", "required": false, "schema": {"$ref": "#/components/schemas/RecordId"}}
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
