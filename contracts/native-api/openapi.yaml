        answers `404 identity.not_found` exactly like a missing one.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IdentityUserAnonymiseRequest"}}}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/IdentityUserAnonymiseResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

