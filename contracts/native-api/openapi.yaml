    WebhookSigningSecretPut:
      description: |
        Exactly one of a supplied secret (`secret`) and a request that the server generate one
        (`generate: true`). Both, neither or any other key is refused. Written as one object with
        two optional properties and a required-only `oneOf`, not as a `oneOf` of two objects, so
        that the generated clients get one request body type.
      type: object
      additionalProperties: false
      properties:
        secret: {type: string, minLength: 16, maxLength: 256, description: "16 to 256 bytes (the server checks bytes, not characters)."}
        generate: {type: boolean, const: true}
      oneOf:
        - required: [secret]
        - required: [generate]
    WebhookSigningSecretPutResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [key_version, fingerprint]
          properties:
            key_version: {type: integer, minimum: 1}
            fingerprint: {type: string, pattern: '^[0-9a-f]{12}$', maxLength: 12}
            secret: {type: string, minLength: 32, maxLength: 512, description: "Present only when the server generated the value, and only in this response."}
    WebhookSigningSecretStateResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [set, key_version, fingerprint]
          properties:
            set: {type: boolean}
            key_version: {type: integer, minimum: 0}
            fingerprint: {type: string, pattern: '^([0-9a-f]{12})?$', maxLength: 12, description: Empty when the secret is not set.}

    JournalInfoResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [generations, policy, region]
          properties:
            generations:
              type: array
              maxItems: 1000
              items:
                type: object
                additionalProperties: false
                required: [generation, first_seq, last_seq, sealed_until_seq, opened_at]
                properties:
                  generation: {type: integer, minimum: 1}
                  first_seq: {type: integer, minimum: 0}
                  last_seq: {type: integer, minimum: 0}
                  sealed_until_seq: {type: integer, minimum: 0}
                  opened_at: {type: string, format: date-time, maxLength: 40}
            policy: {type: string, maxLength: 100, description: The durability policy name only.}
            region: {type: string, maxLength: 100}
