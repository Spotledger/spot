      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    get:
      tags: [security]
      operationId: security_support_session_recording
      summary: "The recording of a support session"
      description: |
        The recording of a support session. Read-only, masked like the audit, and itself audited. Needs
        a recent step-up (`auth_step_up`). Audience: staff (the Tenant Administrator by default)
        (ADR-083: never the consumer audience). Permission: the platform permission
        `security.support_access.read`. Rate class `interactive`. Needs a recent step-up (`403
        auth.step_up_required`). A cross-tenant id answers `404 security.not_found` exactly like a
        missing one.
      parameters:
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/SecuritySupportSessionRecordingResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/security/audit/chain/verify:
    post:
      tags: [security]
      operationId: security_audit_chain_verify
      summary: "Verify the audit hash chain"
      description: |
        Verify the audit hash chain. Read-only (a POST because it takes a body). A broken chain is a
        normal answer with `ok: false` and the time of the first break, not an error. Audience: staff
        (the Tenant Administrator by default) (ADR-083: never the consumer audience). Permission: the
        platform permission `security.audit.read`. Rate class `bulk`. Takes no `Idempotency-Key`: a
        repeat is a repeat of the action. Audited: who, what and the outcome; a refusal is audited too.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SecurityAuditChainVerifyRequest"}}}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/SecurityAuditChainVerifyResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/security/audit/entries:
    get:
      tags: [security]
      operationId: security_audit_entries
      summary: "The audit entries, masked"
      description: |
        The audit entries, masked. Masked: no protected value, no secret and no document content is in
        an entry. Audience: staff (the Tenant Administrator by default) (ADR-083: never the consumer
        audience). Permission: the platform permission `security.audit.read`. Rate class `interactive`.
      parameters:
        - {"name": "from", "in": "query", "required": false, "schema": {"type": "string", "format": "date-time", "maxLength": 40}}
        - {"name": "to", "in": "query", "required": false, "schema": {"type": "string", "format": "date-time", "maxLength": 40}}
        - {"name": "actor", "in": "query", "required": false, "schema": {"$ref": "#/components/schemas/RecordId"}}
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/SecurityAuditEntriesResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/security/audit/export:
    get:
      tags: [security]
      operationId: security_audit_export
      summary: "Export the audit entries"
      description: |
        Export the audit entries. One masked entry per line, for a window of at most 31 days; the export
        is itself audited. Needs a recent step-up (`auth_step_up`). Audience: staff (the Tenant
        Administrator by default) (ADR-083: never the consumer audience). Permission: the platform
        permission `security.audit.read`. Rate class `bulk`. Needs a recent step-up (`403
        auth.step_up_required`).
      parameters:
        - {"name": "from", "in": "query", "required": true, "schema": {"type": "string", "format": "date-time", "maxLength": 40}}
        - {"name": "to", "in": "query", "required": true, "schema": {"type": "string", "format": "date-time", "maxLength": 40}}
      responses:
        "200": {description: OK., content: {application/x-ndjson: {schema: {$ref: "#/components/schemas/SecurityAuditExportResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/security/compliance/evidence-pack:
    post:
      tags: [security]
      operationId: security_compliance_evidence_pack
      summary: "Build a compliance evidence pack"
      description: |
        Build a compliance evidence pack. Starts a job whose result is a signed pack of control evidence
        (counts and digests, never tenant records); the job is followed through the usual job
        operations. Audience: staff (the Tenant Administrator by default) (ADR-083: never the consumer
        audience). Permission: the platform permission `security.compliance.read`. Rate class `bulk`.
        Requires an `Idempotency-Key`. Audited: who, what and the outcome; a refusal is audited too.
      parameters:
        - {"$ref": "#/components/parameters/IdempotencyKeyRequired"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SecurityComplianceEvidencePackRequest"}}}}
      responses:
        "202": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/SecurityComplianceEvidencePackResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/security/compliance/controls:
    get:
      tags: [security]
      operationId: security_compliance_controls
      summary: "The compliance controls and their state"
      description: |
        The compliance controls and their state. Audience: staff (the Tenant Administrator by default)
        (ADR-083: never the consumer audience). Permission: the platform permission
        `security.compliance.read`. Rate class `interactive`.
      parameters:
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/SecurityComplianceControlsResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/import/limits:
    get:
      tags: [import]
      operationId: import_limits
      summary: "The import limits of this site"
      description: |
        The import limits of this site. Limits are server configuration, not constants of the contract;
        a client reads them here before it uploads (the brief's `GET /api/v1/meta` capabilities has no
        counterpart in this contract, so they are advertised by this operation). Audience: staff and
        partner (ADR-083: never the consumer audience). Permission: any signed-in person. Rate class
        `interactive`.
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/ImportLimitsResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/import:
    post:
      tags: [import]
      operationId: import_create
      summary: "Start an import (dry run or run)"
      description: |
        Start an import (dry run or run). The file is one already uploaded through `file_upload` (no
        multipart on this route). Import is two phases, always: a dry run produces the digest and a run
        needs it; a run without a prior dry run is refused. Each row is committed through the normal
        lifecycle operation as the calling user, never a system principal, and a row the user may not
        write fails that row only. `submit: true` is allowed only if the caller holds the submit right,
        checked at the dry run and again at run time. Rate class `bulk` is the class the brief calls
        `heavy`. Audience: staff and partner (ADR-083: never the consumer audience). Permission: the
        import right on the DocType (and the submit right when `submit` is true). Rate class `bulk`.
        Honours an `Idempotency-Key`. Audited: who, what and the outcome; a refusal is audited too.
      parameters:
        - {"$ref": "#/components/parameters/IdempotencyKey"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ImportCreateRequest"}}}}
      responses:
        "202": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/ImportCreateResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/import/{id}:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    get:
      tags: [import]
      operationId: import_get
      summary: "One import job"
      description: |
        One import job. Anyone else gets `404 document.not_found` like a missing job. There is no
        list-all-imports operation in this version. Audience: staff and partner (ADR-083: never the
        consumer audience). Permission: its creator, or an administrator with the import right. Rate
        class `interactive`. A cross-tenant id answers `404 document.not_found` exactly like a missing
        one.
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/ImportGetResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/import/{id}/errors:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    get:
      tags: [import]
      operationId: import_errors
      summary: "The row errors of a job"
      description: |
        The row errors of a job. At most 200 per page. `cell_text` is the cell as the user wrote it,
        truncated to 256 bytes, and is shown only when the caller could write that field; otherwise it
        is absent. Audience: staff and partner (ADR-083: never the consumer audience). Permission: its
        creator, or an administrator with the import right. Rate class `interactive`. A cross-tenant id
        answers `404 document.not_found` exactly like a missing one.
      parameters:
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 200, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/ImportErrorsResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/import/{id}/run:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [import]
      operationId: import_run
      summary: "Run a previewed import"
      description: |
        Run a previewed import. Runs a job in state `ready`; the body `digest` must equal the dry run's
        digest (`409 import.digest_changed` otherwise) so a file or mapping cannot change between the
        preview and the run. Audience: staff and partner (ADR-083: never the consumer audience).
        Permission: its creator. Rate class `bulk`. Honours an `Idempotency-Key`. Audited: who, what and
        the outcome; a refusal is audited too. A cross-tenant id answers `404 document.not_found`
        exactly like a missing one.
      parameters:
        - {"$ref": "#/components/parameters/IdempotencyKey"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ImportRunRequest"}}}}
      responses:
        "202": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/ImportRunResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/import/{id}/cancel:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [import]
      operationId: import_cancel
      summary: "Cancel a job"
      description: |
        Cancel a job. Stops after the current batch; rows already written stay (each row is its own
        lifecycle operation) and are reported in the counts. Audience: staff and partner (ADR-083: never
        the consumer audience). Permission: its creator. Rate class `interactive`. Takes no
        `Idempotency-Key`: a repeat is a repeat of the action. Audited: who, what and the outcome; a
        refusal is audited too. A cross-tenant id answers `404 document.not_found` exactly like a
        missing one.
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/ImportCancelResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/occupancy/{entity}/holds:
    parameters:
      - {"name": "entity", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [occupancy]
      operationId: occupancy_claim
      summary: "Claim an interval of a unit as a tentative hold"
      description: |
        Claim an interval of a unit as a tentative hold. Atomic: the interval is claimed or `409
        occupancy.conflict` is answered. The holder is the caller and a caller never names another
        holder. `ttl_seconds` defaults to 900 and is at most the server's maximum. A write on a node
        that does not own the unit's partition is the existing `403 partition.not_owner` (ADR-087 6.5).
        Audience: staff, partner and consumer (ADR-083). Permission: the create right on the occupancy
        entity. Rate class `interactive`. Requires an `Idempotency-Key`. Audited: who, what and the
        outcome; a refusal is audited too. A cross-tenant id answers `404 document.not_found` exactly
        like a missing one.
      parameters:
        - {"$ref": "#/components/parameters/IdempotencyKeyRequired"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/OccupancyClaimRequest"}}}}
      responses:
        "201": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/OccupancyClaimResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/occupancy/{entity}/holds/{id}/confirm:
    parameters:
      - {"name": "entity", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [occupancy]
      operationId: occupancy_confirm
      summary: "Confirm a hold"
      description: |
        Confirm a hold. Moves tentative to confirmed through the lifecycle pipeline. A hold that expired
        but was not yet swept confirms only if no other row took its place (the late-confirm rule);
        otherwise `409 occupancy.hold_expired`. Audience: staff, partner and consumer (ADR-083).
        Permission: the holder, or a user with the confirm right. Rate class `interactive`. Requires an
        `Idempotency-Key`. Audited: who, what and the outcome; a refusal is audited too. A cross-tenant
        id answers `404 document.not_found` exactly like a missing one.
      parameters:
        - {"$ref": "#/components/parameters/IdempotencyKeyRequired"}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/OccupancyConfirmResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/occupancy/{entity}/holds/{id}:
    parameters:
      - {"name": "entity", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    delete:
      tags: [occupancy]
      operationId: occupancy_release
      summary: "Release (cancel) a hold"
      description: |
        Release (cancel) a hold. Idempotent: a second call is `204` too. Audience: staff, partner and
        consumer (ADR-083). Permission: the holder, or a user with the cancel right. Rate class
        `interactive`. Takes no `Idempotency-Key`: a repeat is a no-op. Audited: who, what and the
        outcome; a refusal is audited too. A cross-tenant id answers `404 document.not_found` exactly
        like a missing one.
      responses:
        "204": {description: Done.}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/occupancy/{entity}/availability:
    parameters:
      - {"name": "entity", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    get:
      tags: [occupancy]
      operationId: occupancy_availability
      summary: "The free and held intervals of one unit"
      description: |
        The free and held intervals of one unit. The window is at most 366 days. A caller who cannot
        read the occupancy rows sees only `busy` or `free` and no holder identity. Audience: staff,
        partner and consumer (ADR-083). Permission: the read right on the occupancy entity (otherwise
        only busy or free is shown). Rate class `interactive`. A cross-tenant id answers `404
        document.not_found` exactly like a missing one.
      parameters:
        - {"name": "unit", "in": "query", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
        - {"name": "from", "in": "query", "required": true, "schema": {"type": "string", "format": "date-time", "maxLength": 40}}
        - {"name": "to", "in": "query", "required": true, "schema": {"type": "string", "format": "date-time", "maxLength": 40}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/OccupancyAvailabilityResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/apps:
    get:
      tags: [connector]
      operationId: app_list
      summary: "The installed apps"
      description: |
        The installed apps. Read only: install, upgrade and uninstall are management operations
        (WP-STR-04.T7 and the management API) and are not in the tenant API. Audience: staff (the Tenant
        Administrator or a holder of `apps.read`) (ADR-083: never the consumer audience). Permission:
        the administrator right (`apps.read`). Rate class `interactive`.
      parameters:
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/AppListResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/connectors:
    get:
      tags: [connector]
      operationId: connector_list
      summary: "The configured connectors"
      description: |
        The configured connectors. Operations are named with their input and output JSON Schemas; no
        credential, secret reference or endpoint credential is ever returned. Audience: staff and
        partner (ADR-083: never the consumer audience). Permission: any signed-in person (the list is
        every connector the caller may invoke). Rate class `interactive`.
      parameters:
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/ConnectorListResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/connectors/{name}:
    parameters:
      - {"name": "name", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    get:
      tags: [connector]
      operationId: connector_get
      summary: "One connector"
      description: |
        One connector. Audience: staff and partner (ADR-083: never the consumer audience). Permission:
        any signed-in person who may invoke it. Rate class `interactive`. A cross-tenant id answers `404
        connector.not_found` exactly like a missing one.
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/ConnectorGetResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/connectors/{name}/operations/{op}:
    parameters:
      - {"name": "name", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
      - {"name": "op", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [connector]
      operationId: connector_invoke
      summary: "Run one connector operation"
      description: |
        Run one connector operation. Runs as the calling user with that user's rights for the documents
        it reads or writes. Answers `200` with `{output}` within the deadline, or `202` with `{job_id}`
        when the operation is long (the body is then `{output: {}, job_id}`). Every outbound call of a
        connector is allow-listed per connector by the egress policy. Audience: staff and partner
        (ADR-083: never the consumer audience). Permission: the rights the operation needs, as the
        calling user. Rate class `bulk`. Requires an `Idempotency-Key`. Audited: who, what and the
        outcome; a refusal is audited too. A cross-tenant id answers `404 connector.not_found` exactly
        like a missing one.
      parameters:
        - {"$ref": "#/components/parameters/IdempotencyKeyRequired"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConnectorInvokeRequest"}}}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/ConnectorInvokeResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/connectors/{name}/runs:
    parameters:
      - {"name": "name", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    get:
      tags: [connector]
      operationId: connector_runs
      summary: "The run log of a connector"
      description: |
        The run log of a connector. Time, operation, outcome, duration and code; never inputs or
        outputs. Audience: staff (the Tenant Administrator or a holder of `apps.read`) (ADR-083: never
        the consumer audience). Permission: the Tenant Administrator or a holder of `connectors.read`.
        Rate class `interactive`. A cross-tenant id answers `404 connector.not_found` exactly like a
        missing one.
      parameters:
        - {"name": "cursor", "in": "query", "required": false, "description": "The `next_cursor` of the previous page.", "schema": {"type": "string", "maxLength": 2048, "minLength": 1}}
        - {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/ConnectorRunsResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/connectors/{name}/inbound:
    parameters:
      - {"name": "name", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [connector]
      operationId: connector_inbound
      summary: "The ingress for an external system's request"
      description: |
        The ingress for an external system's request. The only new unauthenticated route of this
        version. Rate limited per source address and per connector, the body is capped at 1 MiB
        **before** it is read, and the signature check runs in constant time **before** any parse of the
        body. Authenticated by the connector's declared scheme only: an HMAC-SHA256 signature header
        `X-Spot-Signature: t=<unix>,v1=<hex>` over the raw body with a timestamp inside a 5 minute
        window (the scheme of the outbound webhooks), or a bearer token held as a connector secret.
        Answers `202` quickly and does the work in a job, as the connector's declared service principal
        (an ordinary user record with narrow roles, never the administrator). Idempotent on the sender's
        delivery id header `X-Spot-Delivery` (`409 connector.replayed` for a repeat). A bad or missing
        signature is `401 connector.signature_invalid` with no detail, and an unknown connector name is
        the same `401` (no oracle). Audience: anyone, no bearer token (the tenant comes from the site).
        Permission: none (the connector's declared signature or bearer token is the credential). Rate
        class `auth (per source address and per connector)`. Takes no `Idempotency-Key`: a repeat is a
        repeat of the action. Audited: who, what and the outcome; a refusal is audited too.
      security: []
      parameters:
        - {"name": "X-Spot-Delivery", "in": "header", "required": false, "description": "The sender's delivery id; a repeat is `409 connector.replayed`.", "schema": {"type": "string", "maxLength": 200}}
        - {"name": "X-Spot-Signature", "in": "header", "required": false, "description": "`t=<unix>,v1=<hex>` for the HMAC scheme.", "schema": {"type": "string", "maxLength": 300}}
        - {"name": "Authorization", "in": "header", "required": false, "description": "`Bearer <connector token>` for the token scheme.", "schema": {"type": "string", "maxLength": 1024}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ConnectorInboundRequest"}}}}
      responses:
        "202": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/ConnectorInboundResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/link/inbound/{peer}:
    parameters:
      - {"name": "peer", "in": "path", "required": true, "description": "The external peer's name: lower-case letters, digits, `_` and `-`, 1 to 64 characters, starting with a letter or digit. A peer id with `.` or `:` cannot be addressed.", "schema": {"type": "string", "pattern": "^[a-z0-9][a-z0-9_-]{0,63}$", "maxLength": 64, "minLength": 1}}
    post:
      tags: [link]
      operationId: link_inbound
      summary: "The inbound webhook of an external peer"
      description: |
        The inbound side of a workspace link to an external peer (ADR-058 rule 12): the peer posts a
        signed message and the platform stores it through the inbox under the link grant. Audience:
        anyone, no bearer token (the tenant comes from the site); the peer proves itself by the signature
        and nothing else. Permission: none (the peer's configured secret, its source allow-list and the
        link grant bound to the peer are the credential and the limit; a field outside the grant is not
        stored). Rate class `auth (per peer name in the path, charged before the peer is looked up)`.
        The route reads at most the peer's body cap, never parses the body itself, and checks in this
        order: the rate limit, the source allow-list, the cap, then the HMAC signature over the raw body
        (`X-Spot-Signature: t=<unix>,v1=<hex hmac-sha256(secret, t + "." + body)>`, the scheme of the
        outbound webhooks) with a timestamp inside a 5 minute window, then a durable nonce claim on the
        signature (a replay is refused, also after a restart). Answers `202 {"accepted": true}`.
        Every refusal except the rate limit is one `401 link_inbound.unauthorized`: same status, same
        headers (`Content-Type: application/json`, `Cache-Control: no-store`), same body
        `{"error": {"code": "link_inbound.unauthorized"}}`, no request id and nothing of the request
        echoed. It covers an unknown peer, a bad or missing signature, a stale timestamp, a replay, a
        source outside the allow-list, a malformed peer name and a body over the peer's cap (deliberately
        a `401`, never a `413`: a `413` would say the peer exists and what its cap is), so the answer
        never reveals whether a peer exists. A peer over its rate limit gets `429 api.rate_limited`
        (body `{"error": {"code": "api.rate_limited"}}`) with `Retry-After`; the limit is charged to the
        name in the path whether or not the peer exists. Record topics never cross an external link.
        Takes no `Idempotency-Key`: the signature's nonce is the replay guard. Audited: who (the peer),
        what and the outcome; a refusal is audited too, by class and never by value.
      security: []
      parameters:
        - {"name": "X-Spot-Signature", "in": "header", "required": false, "description": "`t=<unix>,v1=<hex>` over the raw body; a missing one is the `401`.", "schema": {"type": "string", "maxLength": 300}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LinkInboundRequest"}}}}
      responses:
        "202": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/LinkInboundResponse"}}}}
        "401": {description: "The one refusal.", content: {application/json: {schema: {$ref: "#/components/schemas/LinkInboundError"}}}}
        "429": {description: "Over the peer's rate limit.", headers: {Retry-After: {description: "Whole seconds to wait.", schema: {type: integer, minimum: 0}}}, content: {application/json: {schema: {$ref: "#/components/schemas/LinkInboundError"}}}}
        default: {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <credential>`, where the credential is a session token from
        `auth_login` or an API key (`spk_<key_id>_<secret>`, WP-PLT-02). Missing credentials
        give `401 auth.required`; a bad or expired one gives `401 auth.invalid_credentials` or
        `401 auth.session_expired`.

  headers:
    ETag:
      description: The document's version as a strong entity tag, for example `"3"`.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}

    DefinitionETag:
      description: "The content hash of a process definition: the lower-case hex SHA-256 in quotes."
      schema: {type: string, pattern: '^"[0-9a-f]{64}"$'}

    ExportCursor:
      description: |
        Opaque, signed cursor for the next chunk of the export; absent when the chunk was the
        last. Bound to the caller and the export. Send it back in the body of `export_next`.
      schema: {type: string, minLength: 1, maxLength: 2048}
    ExportRows:
      description: Parent rows in this chunk.
      schema: {type: integer, minimum: 0}
    ExportWatermark:
      description: |
        The incremental-extraction watermark taken when the export began; the same value on
        every chunk. Start `export_extract` from it to follow the export without a gap.
      schema: {type: string, minLength: 1, maxLength: 2048}
    ConsumerLease:
      description: |
        The lease token for the single active connection of a named consumer. Opaque; send it
        back as `X-Consumer-Lease` on later pulls, acks and restarts.
      schema: {type: string, minLength: 1, maxLength: 512}

  parameters:
    DocType:
      name: doctype
      in: path
      required: true
      description: The DocType's storage name.
      schema: {$ref: "#/components/schemas/Identifier"}
    DocId:
      name: id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/RecordId"}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version the change is based on, as returned in `ETag`.
      schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
    ConsumerName:
      name: name
      in: path
      required: true
      description: The consumer's name, unique per site.
      schema: {$ref: "#/components/schemas/Identifier"}
    ConsumerLease:
      name: X-Consumer-Lease
      in: header
      required: false
      description: The lease token from the consumer's first pull or stream; see `event_consumer_pull`.
      schema: {type: string, minLength: 1, maxLength: 512}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, pattern: '^[\x21-\x7e]{1,128}$'}

    ProcessName:
      name: process
      in: path
      required: true
      description: The process's storage name.
      schema: {$ref: "#/components/schemas/Identifier"}
    RunId:
      name: id
      in: path
      required: true
      description: The run's id.
      schema: {$ref: "#/components/schemas/RunId"}
    TaskId:
      name: id
      in: path
      required: true
      description: The task's id.
      schema: {$ref: "#/components/schemas/TaskId"}
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 1 to 128 visible ASCII characters; a replay returns the first answer.
      schema: {type: string, pattern: '^[\x21-\x7e]{1,128}$'}
    ProcessVersionNumber:
      name: n
      in: path
      required: true
      description: The version number of the process.
      schema: {type: integer, minimum: 1}
    ProcessVersionFrom:
      name: from
      in: path
      required: true
      description: The version number the runs are pinned to now.
      schema: {type: integer, minimum: 1}
    MigrationId:
      name: id
      in: path
      required: true
      description: The migration's id.
      schema: {$ref: "#/components/schemas/MigrationIdValue"}
  responses:
    Error:
      description: Any error. The status and `error.code` follow the registry.
      headers:
        Retry-After:
          description: Seconds to wait, on 429 and 503.
          schema: {type: integer, minimum: 0}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
          examples:
            stale:
              value:
                error:
                  code: document.stale_version
                  message: "This invoice was changed by someone else."
                  explanation: "Reload it to see the latest version, then make your change again."
                  retryable: false
                  request_id: 0192f3c4-5b6a-7c8d-9e0f-00000000beef
                  details: {current_version: 4}
            seam_failed:
              value:
                error:
                  code: lookup.seam_failed
                  message: "The customer list could not be loaded."
                  explanation: "The search provided by the billing app is not responding. Nothing was changed; try again or ask an administrator."
                  retryable: false
                  request_id: req-91c2
            validation:
              value:
                error:
                  code: document.validation_failed
                  message: "The invoice has 2 problems."
                  retryable: false
                  request_id: req-7f3a
                  fields:
                    - {field: "items[2].qty", code: selling.qty_not_positive, message: "Quantity must be more than zero."}
                    - {field: customer, code: document.required, message: "Customer is required."}
    Document:
      description: One document.
      headers:
        ETag: {$ref: "#/components/headers/ETag"}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DocumentResponse"}
    DocumentPage:
      description: A page of documents.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/DocumentPage"}
          example:
            data:
              - {id: 0192f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f, version: 3, name: SINV-2026-00042, grand_total: "2500.00"}
            next_cursor: eyJrIjpbIjIwMjYtMDktMjkiXX0
    FunctionResult:
      description: The function's result.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {description: Any JSON value returned by the function.}
              messages: {type: array, items: {$ref: "#/components/schemas/Message"}}

  schemas:
    Identifier:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,62}$'
    RecordId:
      type: string
      description: A UUIDv7, canonical lower-case hyphenated form.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    Date:
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    DateTimeUtc:
      type: string
      description: RFC 3339 in UTC, ending in `Z`.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'

    FieldValue:
      description: |
        A field value, encoded by the field's type as in the Values table. Which encoding
        applies is decided by the DocType's metadata, not by the JSON type.
      type: [string, integer, boolean, object, array, "null"]

    ChildRow:
      type: object
      required: [id, idx]
      properties:
        id: {$ref: "#/components/schemas/RecordId"}
        idx: {type: integer, minimum: 1}
      additionalProperties: {$ref: "#/components/schemas/FieldValue"}

    Document:
      type: object
      required: [id, version]
      properties:
        id: {$ref: "#/components/schemas/RecordId"}
        version: {type: integer, minimum: 1}
        _state:
          type: string
          enum: [draft, posted, cancelled]
          description: Present on DocTypes that are posted (ADR-42).
        _currency:
          type: object
          description: |
            The currency each `currency`-format field of this document is shown in, keyed by the
            field path (`grand_total`, or `items[2].amount` for a child row), resolved by the
            **server** from the field's `currency_field` value on this document. Present only
            when the DocType has such a field and the caller may read it. It is presentation:
            never written back, never part of a value, and a client that ignores it still has
            the exact decimal.
          additionalProperties: {$ref: "#/components/schemas/CurrencyInfo"}
      additionalProperties: {$ref: "#/components/schemas/FieldValue"}

    CurrencyInfo:
      type: object
      additionalProperties: false
      required: [code, symbol]
      properties:
        code: {type: string, pattern: '^[A-Z]{3}$', description: The ISO 4217 code the amount is in.}
        symbol: {type: string, maxLength: 8, description: The symbol the caller's locale shows for it (ADR-073).}

    DocumentWrite:
      type: object
      description: Fields to write. Child tables are arrays of row objects; a row's `id` is optional.
      properties:
        id: {$ref: "#/components/schemas/RecordId"}
      propertyNames:
        pattern: '^[a-z][a-z0-9_]{0,62}$'
        not: {const: version}
      additionalProperties: {$ref: "#/components/schemas/FieldValue"}

    DocumentResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Document"}
        messages: {type: array, items: {$ref: "#/components/schemas/Message"}}

    DocumentPage:
      type: object
      required: [data, next_cursor]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Document"}}
        next_cursor:
          type: [string, "null"]
          description: Opaque; pass it back to get the next page. `null` on the last page.
        total:
          type: integer
          minimum: 0
          description: Present only when `with_total` was requested.
        facets:
          type: object
          maxProperties: 4
          additionalProperties:
            type: array
            maxItems: 100
            items:
              type: object
              additionalProperties: false
              required: [value, count]
              properties:
                value: {type: [string, "null"], maxLength: 500}
                count: {type: integer, minimum: 0}
          description: Present when `facets` was requested (0.22.0); counts only over rows the caller may read.
        snippets:
          type: object
          maxProperties: 500
          additionalProperties:
            type: object
            maxProperties: 16
            additionalProperties: {type: string, maxLength: 1000}
          description: By document id, per page and permission-filtered; HTML-escaped text with `<mark>` as the only markup (0.22.0).
        projection_lag: {type: integer, minimum: 0, description: "A position gap of the search projection (0.22.0); absent on the database path where it is zero."}

    QueryRequest:
      type: object
      additionalProperties: false
      properties:
        fields:
          type: array
          items: {$ref: "#/components/schemas/Identifier"}
          description: Fields to return. `id` and `version` are always included.
        filter: {$ref: "#/components/schemas/Filter"}
        order:
          type: array
          maxItems: 8
          items: {$ref: "#/components/schemas/OrderKey"}
        limit: {type: integer, minimum: 1, maximum: 500, default: 20}
        cursor: {type: [string, "null"]}
        with_total: {type: boolean, default: false}
        search:
          type: object
          additionalProperties: false
          required: [text]
          description: Full-text search over declared searchable fields (0.22.0).
          properties:
            mode: {type: string, enum: [web, phrase, plain], default: web}
            text: {type: string, minLength: 1, maxLength: 512}
            fields: {type: array, minItems: 1, maxItems: 16, items: {$ref: "#/components/schemas/Identifier"}}
        facets:
          type: array
          maxItems: 4
          items: {$ref: "#/components/schemas/Identifier"}
          description: Facetable field names (0.22.0); counts only over rows the caller may read.
        snippets:
          type: object
          additionalProperties: false
          required: [fields]
          properties:
            fields: {type: array, minItems: 1, maxItems: 16, items: {$ref: "#/components/schemas/Identifier"}}
            max_chars: {type: integer, minimum: 20, maximum: 200, default: 120}

    OrderKey:
      type: object
      additionalProperties: false
      oneOf:
        - required: [field]
        - required: [rank]
      properties:
        rank: {type: boolean, const: true, description: Order by search rank (0.22.0); valid only with `search`.}
        field: {$ref: "#/components/schemas/Identifier"}
        dir: {type: string, enum: [asc, desc], default: asc}
        nulls:
          type: string
          enum: [first, last]
          description: Default is `last` for `asc` and `first` for `desc`, as in PostgreSQL.

    Filter:
      description: |
        A filter expression, mapped one to one onto the storage query IR (ADR-053). Comparisons
        use three-valued logic: a comparison with a null field is not true, so use `is_null`.
        Text equality and `in` are exact; `lt`/`le`/`gt`/`ge` on text follow the site's
        collation. `prefix`, `contains` and `suffix` are literal (no wildcards).
      oneOf:
        - type: object
          additionalProperties: false
          required: [and]
          properties:
            and: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Filter"}}
        - type: object
          additionalProperties: false
          required: [or]
          properties:
            or: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Filter"}}
        - type: object
          additionalProperties: false
          required: [not]
          properties:
            not: {$ref: "#/components/schemas/Filter"}
        - type: object
          additionalProperties: false
          required: [field, op, value]
          properties:
            field: {$ref: "#/components/schemas/Identifier"}
            op: {type: string, enum: [eq, ne, lt, le, gt, ge]}
            value:
              description: Never null; use `is_null`.
              type: [string, integer, boolean]
        - type: object
          additionalProperties: false
          required: [field, op, value]
          properties:
            field: {$ref: "#/components/schemas/Identifier"}
            op: {type: string, enum: [in]}
            value:
              type: array
              minItems: 1
              maxItems: 1000
              items: {type: [string, integer, boolean]}
        - type: object
          additionalProperties: false
          required: [field, op, value]
          properties:
            field: {$ref: "#/components/schemas/Identifier"}
            op: {type: string, enum: [prefix, contains, suffix]}
            value: {type: string, minLength: 1}
            case_insensitive: {type: boolean, default: false}
        - type: object
          additionalProperties: false
          required: [field, op]
          properties:
            field: {$ref: "#/components/schemas/Identifier"}
            op: {type: string, enum: [is_null, is_not_null]}

    MethodCall:
      type: object
      additionalProperties: false
      properties:
        args:
          type: object
          description: Named arguments, encoded by the method's declared parameter types.

    MethodResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [document, result]
          properties:
            document: {$ref: "#/components/schemas/Document"}
            result: {description: The method's return value; `null` when it returns nothing.}
        messages: {type: array, items: {$ref: "#/components/schemas/Message"}}

    ReportResult:
      type: object
      required: [columns, rows, truncated]
      properties:
        columns:
          type: array
          items:
            type: object
            required: [name, label, type]
            properties:
              name: {$ref: "#/components/schemas/Identifier"}
              label: {type: string}
              type: {$ref: "#/components/schemas/FieldType"}
        rows:
          type: array
          items: {type: array, items: {$ref: "#/components/schemas/FieldValue"}}
        truncated: {type: boolean, description: True when `limit` cut the result.}

    FieldType:
      type: string
      description: |
        The value encoding of a field or column, from the Values table. A `select` field has
        type `text` (with `select` values) and a dynamic link has type `link` (with
        `link_type_field`). `long_text` is encoded as text; `attach` as a file record id;
        `table_multiselect` as an array of row objects; a `secret` is never encoded in a
        document, which holds only whether one is set. A `consumer_ref` (0.9.0) is encoded as
        the consumer's id, like a `link`'s value, but it is not a link: it has no `link_to`, no
        lookup and no navigation, and a client shows it as read-only text (the consumer lives
        outside the DocTypes and a staff client cannot open it). A client that does not know
        the type treats it as text.
      enum: [bool, int, decimal, text, long_text, date, time, datetime, link, json, bytes, attach, secret, table, table_multiselect, consumer_ref]

    DocTypeMeta:
      type: object
      required: [doctype, label, version, fields]
      properties:
        doctype: {$ref: "#/components/schemas/Identifier"}
        label: {type: string}
        version: {type: integer, minimum: 1, description: The metadata version (ADR-05).}
        is_posted: {type: boolean, description: Documents have a draft stage and a Post action (ADR-42).}
        expr_version:
          type: integer
          minimum: 1
          description: |
            The version of the shared expression language (`docs/expression-language.md`) that
            the rule expressions of this DocType's fields (`depends_on`, `mandatory_depends_on`,
            `read_only_depends_on`, `default_expr`) are written for (WP-CON-03.T7). It is
            present whenever any field carries one of them and absent otherwise. A client that
            does not implement this version **ignores every rule expression of the DocType**
            and uses the static properties (`required`, `read_only`, `default`, `hints.hidden`);
            the server's `form_event` and its checks on save stay authoritative either way.
        fields:
          type: array
          items: {$ref: "#/components/schemas/FieldMeta"}
        searchable: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/Identifier"}, description: "Fields declared searchable (0.22.0); a protected field is never listed."}
        facetable: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/Identifier"}, description: "Fields declared facetable (0.22.0)."}

    FieldMeta:
      type: object
      description: One field's complete description (ADR-068 §6).
      required: [name, label, type]
      properties:
        name: {$ref: "#/components/schemas/Identifier"}
        label: {type: string}
        type: {$ref: "#/components/schemas/FieldType"}
        required: {type: boolean}
        read_only: {type: boolean}
        create_only:
          type: boolean
          description: |
            The field can be set only when the document is created (contract 0.9.0, ADR-068
            amendment A4). Once the document exists, no operation by any channel changes the
            stored value; a request that tries fails with `document.read_only_field` on this
            field. A client offers the field when creating and shows it read-only afterwards.
            Absent means false. It is a statement about writes, not about who may read the field.
        default:
          description: The value a new document starts with, encoded by the field's type.
          $ref: "#/components/schemas/FieldValue"
        scale: {type: integer, minimum: 0, maximum: 28, description: For decimals.}
        precision: {type: integer, minimum: 1, maximum: 38, description: Total digits, for decimals.}
        link_to: {$ref: "#/components/schemas/Identifier"}
        link_type_field:
          allOf: [{$ref: "#/components/schemas/Identifier"}]
          description: For a dynamic link, the field holding the target DocType.
        child_doctype: {$ref: "#/components/schemas/Identifier"}
        link_field:
          allOf: [{$ref: "#/components/schemas/Identifier"}]
          description: For a `table_multiselect`, the row field holding the picked document.
        select:
          type: array
          items: {type: string}
          description: The allowed values of a `select` field, in display order.
        multiple:
          type: boolean
          description: |
            A `select` field that holds several of its values (WP-CON-03.T6). Its value is an
            array of the chosen texts, in the order of `select`, with no duplicates; absent or
            false means one value. A field that holds several *documents* is a
            `table_multiselect`, not this.
        max_chars: {type: integer, minimum: 1, description: The limit of a `text` field.}
        format:
          type: string
          description: |
            How the value is interpreted and shown (ADR-068 §2), for example `email`, `url`,
            `currency`, `percent`, `markdown`, `image`. Absent means plain. The set grows
            additively, so a client treats an unknown format as plain.
        format_params:
          type: object
          description: |
            The format's parameters: `symbology` (barcode), `syntax` (code), `currency_field`
            (currency), `max` (rating). The currency *symbol* is not a parameter: it depends on
            the document and arrives in `Document._currency`. Attachment limits are not
            parameters either: they depend on the user and arrive in `auth_permissions`
            (`attach_limits`).
          additionalProperties: {type: [string, integer]}
        lookup: {$ref: "#/components/schemas/LookupSpec"}
        hints: {$ref: "#/components/schemas/FieldHints"}
        depends_on:
          type: string
          maxLength: 1024
          description: |
            Rule expression (WP-CON-03.T7, ADR-068 §1): the field is shown while it evaluates to
            `true`. Written in the shared expression language at `DocTypeMeta.expr_version`,
            over `doc` (and `parent` on a child row). Absent means always shown (subject to
            `hints.hidden`). A client evaluates it for instant feedback; it never changes what
            is stored or allowed, and an expression that fails to evaluate leaves the field
            as the static properties say.
        mandatory_depends_on:
          type: string
          maxLength: 1024
          description: |
            Rule expression: the field is required while it evaluates to `true`, in addition to
            a static `required`. The server enforces it on save regardless of the client.
        read_only_depends_on:
          type: string
          maxLength: 1024
          description: |
            Rule expression: the field is read-only while it evaluates to `true`, in addition to
            a static `read_only`. The server enforces it on save regardless of the client.
        default_expr:
          type: string
          maxLength: 1024
          description: |
            Expression for the value a new document starts with (and a new child row), used
            instead of the static `default` by a client that implements `expr_version`. The
            result is encoded by the field's type. Evaluated once when the document or row is
            created, never again, so it cannot overwrite what the user typed.

    FieldHints:
      type: object
      description: Presentation hints (ADR-068 §1.3). They never change what is stored.
      properties:
        description: {type: string, description: Longer offline help text.}
        hidden: {type: boolean, description: "The UI hides it; hiding is not security."}
        in_list_view: {type: boolean}
        in_standard_filter: {type: boolean}
        no_copy: {type: boolean}
        permlevel: {type: integer, minimum: 0, maximum: 9}
        control:
          type: string
          enum: [switch, checkbox, dropdown, radio, segmented, autocomplete, chips, textarea]
          description: |
            Which control the author prefers for the field (WP-CON-03.T6), from a closed set
            that grows additively: `switch` and `checkbox` for a bool; `dropdown`, `radio`,
            `segmented` for a single `select`; `dropdown`, `chips` for a `multiple` select;
            `autocomplete` for a link; `textarea` for text. It is a hint: a client uses it
            when it offers that control for the field's type and falls back to its default for
            a value it does not know or that does not suit the type. It never changes what is
            stored or what is allowed.

    LookupSpec:
      type: object
      description: |
        The field's base lookup (ADR-068 §3.2), for information. It is the definition's
        spec, not necessarily the one that answers: a view or a site override may replace it.
        A client never sends it back; `lookup_search` has no seam parameter. Conditional
        (`when`) rules are the server's and are not exposed.
      properties:
        seam: {type: string, description: "Absent means the platform default `platform:link_search`."}
        version: {type: integer, minimum: 1, description: The lookup protocol major.}
        params:
          type: object
          additionalProperties: {type: string}

    LookupRequest:
      type: object
      additionalProperties: false
      required: [text]
      description: |
        There is deliberately no seam here. Unknown properties are rejected with
        `api.invalid_request`.
      properties:
        text: {type: string, maxLength: 1024, description: The text typed so far; may be empty.}
        cursor: {type: string, description: From a previous page's `cursor`.}
        doc:
          type: object
          description: The current document snapshot, in the value encoding.
          additionalProperties: {$ref: "#/components/schemas/FieldValue"}
        parent:
          type: object
          description: The parent document, when the field is on a child row.
          additionalProperties: {$ref: "#/components/schemas/FieldValue"}

    LookupRow:
      type: object
      required: [id, label]
      properties:
        id: {$ref: "#/components/schemas/RecordId"}
        label: {type: string, description: What the user picks from.}
        description: {type: string, description: A second line.}
        extras:
          type: object
          description: Values the form may copy into other fields when the row is picked.
          additionalProperties: {$ref: "#/components/schemas/FieldValue"}
        provides:
          type: object
          description: |
            Provisional fills (WP-CON-03.T7, ADR-068 A3): the values the form's `fetch_from`
            fields would copy from this row, by the name of the **form's** field that receives
            each (on a child row, the row's field). Sent only for values the asker may see, and
            never a masked or reveal-gated value. A client may fill them at once and must mark
            them provisional: the answer of `form_event` replaces them and the server
            recomputes them on save, so a stale hint can flicker but never persist. Absent
            means nothing to fill. `extras` is unchanged and is not provisional.
          additionalProperties: {$ref: "#/components/schemas/FieldValue"}
        cells:
          type: object
          description: |
            The text of each display column for this row, by column name, when the page names
            `columns` (WP-CON-03.T6). A row may omit a column it has no text for. Display
            only: a cell is never a value to copy; `extras` is for that.
          additionalProperties: {type: string, maxLength: 1024}

    LookupPage:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [rows, has_more]
          properties:
            rows: {type: array, items: {$ref: "#/components/schemas/LookupRow"}}
            columns:
              type: array
              maxItems: 8
              description: |
                Present when the seam answers with several display columns (WP-CON-03.T6): the
                picker shows these, in order, with `label` as the text it keeps once a row is
                picked. Absent means the single-column picker of `label` and `description`.
              items:
                type: object
                additionalProperties: false
                required: [name, label]
                properties:
                  name: {$ref: "#/components/schemas/Identifier"}
                  label: {type: string}
            has_more: {type: boolean}
            cursor: {type: string, description: Present exactly when `has_more` is true.}

    LoginRequest:
      type: object
      additionalProperties: false
      required: [user, password]
      properties:
        user: {type: string, minLength: 1, maxLength: 320, description: E-mail or user name.}
        password: {type: string, minLength: 1, maxLength: 1024}
        totp: {type: string, pattern: '^[0-9]{6,8}$'}
        recovery_code: {type: string, maxLength: 32}

    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token: {type: string, description: "Opaque; send as `Authorization: Bearer <token>`."}
        expires_at: {$ref: "#/components/schemas/DateTimeUtc"}
        user: {$ref: "#/components/schemas/UserSummary"}

    NotificationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/NotificationItem"}
        next:
          type: string
          minLength: 1
          maxLength: 128
          description: The `event_id` to send as `after` for the following page. Absent on an empty page.

    NotificationItem:
      type: object
      required: [event_id, event, data, created_at]
      properties:
        event_id: {type: string, minLength: 1, maxLength: 128}
        event:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,62}$'
          description: A short lowercase token; `user_notice` is the only value defined. A client ignores a value it does not know.
        data:
          type: object
          description: The notice's data (at most 2 KiB serialised; the keys are in `realtime.md`).
        created_at: {$ref: "#/components/schemas/DateTimeUtc"}

    ConsumerSession:
      type: object
      required: [token, expires_at]
      properties:
        token: {type: string, description: "Opaque; send as `Authorization: Bearer <token>`. Short-lived; never put in a URL."}
        expires_at: {$ref: "#/components/schemas/DateTimeUtc"}

    SessionInfo:
      type: object
      required: [expires_at, user]
      properties:
        expires_at: {$ref: "#/components/schemas/DateTimeUtc"}
        user: {$ref: "#/components/schemas/UserSummary"}
        site: {type: string}

    UserSummary:
      type: object
      required: [id, email, full_name]
      properties:
        id: {$ref: "#/components/schemas/RecordId"}
        email: {type: string}
        full_name: {type: string}

    FormEventRequest:
      type: object
      required: [doc, changed]
      description: |
        One form event: the unsaved draft as the client holds it, and the field that
        changed. The field path takes `field` or the child-row form `table[idx].field`
        (idx from 1). Unknown properties are rejected with `api.invalid_request`.
      additionalProperties: false
      properties:
        doc:
          type: object
          description: |
            The unsaved draft: the fields as the value encoding holds them, child tables as
            arrays of row objects (`id`, `idx` from 1, then the row fields). The server never
            stores it; it does not validate it as a whole document (validation is the
            save's), but it rejects unknown field names and values that do not fit their
            types, and `version` or `_`-keys as `resource_create` does.
          additionalProperties: {$ref: "#/components/schemas/FieldValue"}
        changed: {$ref: "#/components/schemas/FieldPath"}
        base_version:
          type: integer
          minimum: 1
          description: The version the draft was loaded at, when it came from a stored document. Present only then; the server does not re-read the document for the event.

    FormEventResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [patch]
          properties:
            patch:
              type: object
              description: The document diff, in the merge-patch form `resource_update` takes, restricted to fields the server derived or changed. No field the caller cannot read appears; a row-level change keeps the row's `id` and `idx`.
              additionalProperties: {$ref: "#/components/schemas/FieldValue"}
            rules:
              type: object
              description: The resolved rule state for the changed region, only when the server computed it — conditional (ADR-068 §3.2 `when`) rules and validation rules with resolved outcomes. `field` and `message` use the same shapes as `Message`; the client's own instant rules remain primary.
              additionalProperties: {$ref: "#/components/schemas/FieldValue"}
        messages: {type: array, items: {$ref: "#/components/schemas/Message"}}

    PermissionSummary:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [doctypes]
          properties:
            doctypes:
              type: array
              items: {$ref: "#/components/schemas/DoctypePermissions"}
        etag: {type: string, description: The permission snapshot version, in ETag form. It changes when rules or grants change; a client refreshes the summary when it does.}

    DoctypePermissions:
      type: object
      description: |
        What one user may do with one DocType, and nothing more. It names no protection
        group, no role and no other user's rights; the lists name field paths only. Fields
        omitted from every list are readable and writable.
      required: [doctype, rights, fields]
      properties:
        doctype: {$ref: "#/components/schemas/Identifier"}
        rights:
          type: object
          description: Document-independent rights for the signed-in user. `submit` is the engine's `post` right; `correct` needs both `cancel` and `create` (ADR-42). A right is true only when the user holds it for documents generally — condition-restricted grants do not widen it.
          required: [read, create, write, delete, submit, cancel, correct, rename]
          additionalProperties: false
          properties:
            read: {type: boolean}
            create: {type: boolean}
            write: {type: boolean}
            delete: {type: boolean}
            submit: {type: boolean}
            cancel: {type: boolean}
            correct: {type: boolean}
            rename: {type: boolean}
        fields:
          type: object
          description: The field summary, per user. The lists are in DocType definition order; a hidden field never appears anywhere else in this answer, so a caller who cannot read it learns nothing of its existence (`meta_get` treats hidden the same way).
          required: [hidden, read_only, masked]
          additionalProperties: false
          properties:
            hidden:
              type: array
              items: {$ref: "#/components/schemas/Identifier"}
              description: Fields the user cannot read at all — they do not exist for this reader, and no response of this API shows them.
            read_only:
              type: array
              items: {$ref: "#/components/schemas/Identifier"}
              description: Fields the user can read but not write (engine-maintained ones such as totals appear here as well as permission-restricted ones).
            masked:
              type: array
              items: {$ref: "#/components/schemas/Identifier"}
              description: |
                Fields the user reads only in masked form (ADR-070 §12 read_masked). The
                server forms the masked text and **never sends the real value** of a field
                until `field_reveal` succeeds, so the mask format is not part of any metadata:
                a client shows the text it is given and never derives or stores the real value.
            revealable:
              type: array
              items: {$ref: "#/components/schemas/Identifier"}
              description: |
                The fields among `masked` the user holds the right to reveal through
                `field_reveal` (WP-CON-03.T6), in definition order; absent means none. A client
                offers a reveal action only for these. It is a hint: `field_reveal` decides, and
                answers the same refusal as for a missing document.
        attach_limits:
          type: object
          description: |
            For each `attach` field the user may write, what this user may upload to it
            (WP-CON-03.T6), keyed by field path. The server resolves one global default and any
            narrower override (for example a department's) and sends the result for **this**
            user; the client never merges scopes. `file_upload` still enforces it
            (`413 file.too_large`; a media type outside `accept` is `400 api.invalid_request`) and the registry's `files.max_upload_bytes`
            stays the ceiling that no override can pass.
          additionalProperties:
            type: object
            additionalProperties: false
            required: [max_bytes]
            properties:
              max_bytes: {type: integer, minimum: 1}
              accept:
                type: array
                maxItems: 64
                items: {type: string, pattern: '^[a-z0-9.+-]+/[a-z0-9.+*-]+$'}
                description: Media types allowed, `*` allowed as the subtype; absent means any type.

    FileRecord:
      type: object
      description: One stored file. It never names a path or a storage key; there is no URL to bytes, only this record and `GET /api/v1/files/{id}`.
      required: [id, name, size, content_type, digest, private]
      properties:
        id: {$ref: "#/components/schemas/RecordId"}
        name:
          type: string
          maxLength: 255
          description: The display name the upload carried in `Content-Disposition`.
        size: {type: integer, minimum: 0, description: The size in bytes.}
        content_type: {type: string, description: The stored content type; the upload's `Content-Type`, or `application/octet-stream` when the upload did not name one.}
        digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the bytes, hex, lower-case. The client may verify its own copy against it.
        private:
          type: boolean
          description: True when the file is unattached and only its uploader may read it; false when it is attached to (or will be attached to) a document whose readers see it.
      examples:
        - id: 0192f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e7f
          name: spec.pdf
          size: 51403
          content_type: application/pdf
          digest: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          private: false

    PasswordChange:
      type: object
      additionalProperties: false
      required: [current, new]
      properties:
        current: {type: string, minLength: 1, maxLength: 1024}
        new: {type: string, minLength: 1, maxLength: 1024, description: Must satisfy the tenant's password policy (ADR-070 §5.1); a failure names the violated rules.}

    SessionId:
      type: string
      description: A session's opaque id, from `auth_session_list`. Not the bearer token; the token is never shown or echoed.
      pattern: '^[A-Za-z0-9_-]{1,64}$'

    SessionRecord:
      type: object
      required: [id, created_at, expires_at, method, source, current]
      properties:
        id: {$ref: "#/components/schemas/SessionId"}
        created_at: {$ref: "#/components/schemas/DateTimeUtc"}
        expires_at: {$ref: "#/components/schemas/DateTimeUtc"}
        last_used_at: {$ref: "#/components/schemas/DateTimeUtc"}
        method:
          type: string
          enum: [password, sso, api_key]
          description: How the session signed in (ADR-070 §5.4).
        source: {type: string, description: The client address the session began from.}
        device: {type: string, description: The optional device label, when one was set.}
        current: {type: boolean, description: True for the session this response is served under.}

    Message:
      type: object
      required: [level, code, message]
      properties:
        level: {type: string, enum: [info, warning]}
        code: {$ref: "#/components/schemas/ErrorCode"}
        message: {type: string}
        field: {$ref: "#/components/schemas/FieldPath"}

    ErrorCode:
      type: string
      pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'

    FieldPath:
      type: string
      description: A field, or a child-table row field as `table[idx].field` (idx from 1).
      pattern: '^[a-z][a-z0-9_]*(\[[1-9][0-9]*\]\.[a-z][a-z0-9_]*)?$'

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: {$ref: "#/components/schemas/FieldPath"}
        code: {$ref: "#/components/schemas/ErrorCode"}
        message: {type: string}

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable, request_id]
          properties:
            code: {$ref: "#/components/schemas/ErrorCode"}
            message: {type: string}
            explanation: {type: string}
            retryable: {type: boolean, description: True when the same request may succeed later unchanged.}
            request_id: {type: string}
            fields: {type: array, items: {$ref: "#/components/schemas/FieldError"}}
            details: {type: object, description: Code-specific data, documented per code.}

    Live:
      type: object
      required: [status]
      properties:
        status: {type: string, const: live}
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          description: |
            The native API contract version this server serves, for example `0.4.0`
            (added in 0.3.0). A server from 0.2.0 answers without it, and a 0.3.0 or newer
            client that finds no `version` treats the server as 0.2.0 and degrades:
            it asks only for the operations the version includes.

    Ready:
      type: object
      required: [status, checks]
      properties:
        status: {type: string, enum: [ready, not_ready]}
        checks:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name: {type: string}
              ok: {type: boolean}
              detail: {type: string}

    Room:
      type: string
      description: "`doc:<doctype>:<id>`, `doctype:<doctype>`, `user:<user id>` or `site`."
      pattern: '^(doc:[a-z][a-z0-9_]{0,62}:[0-9a-f-]{36}|doctype:[a-z][a-z0-9_]{0,62}|user:[0-9a-f-]{36}|site)$'

    RealtimeClientMessage:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, token]
          properties:
            type: {const: auth}
            token: {type: string}
        - type: object
          additionalProperties: false
          required: [type, ref, room]
          properties:
            type: {const: join}
            ref: {type: string, maxLength: 64, description: Echoed in the reply.}
            room: {$ref: "#/components/schemas/Room"}
            resume_after: {type: integer, minimum: 0, description: The last `seq` the client saw in this room.}
        - type: object
          additionalProperties: false
          required: [type, room]
          properties:
            type: {const: leave}
            room: {$ref: "#/components/schemas/Room"}
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: {const: ping}
      examples:
        - {type: auth, token: 3q2-7wEBAgMEBQYHCAkKCwwNDg8QERITFBUWFxgZGhs}
        - {type: join, ref: j1, room: "doc:sales_invoice:0192f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f", resume_after: 12}
        - {type: leave, room: "doctype:sales_invoice"}
        - {type: ping}

    RealtimeServerMessage:
      oneOf:
        - type: object
          required: [type, user]
          properties:
            type: {const: ready}
            user: {$ref: "#/components/schemas/RecordId"}
            heartbeat_seconds: {type: integer, minimum: 1}
        - type: object
          required: [type, ref, room, outcome]
          properties:
            type: {const: joined}
            ref: {type: string}
            room: {$ref: "#/components/schemas/Room"}
            outcome: {type: string, enum: [joined, replayed, resync_required]}
            replayed: {type: integer, minimum: 0}
        - type: object
          required: [type, ref, room, error]
          properties:
            type: {const: join_error}
            ref: {type: string}
            room: {type: string}
            error:
              type: object
              required: [code, message]
              properties:
                code: {$ref: "#/components/schemas/ErrorCode"}
                message: {type: string}
        - type: object
          required: [type, room, seq, kind, payload, published_at]
          properties:
            type: {const: event}
            room: {$ref: "#/components/schemas/Room"}
            seq: {type: integer, minimum: 1}
            kind: {type: string, enum: [doc_created, doc_updated, doc_deleted, doc_posted, doc_cancelled, doc_renamed, notification]}
            payload: {type: object}
            published_at: {$ref: "#/components/schemas/DateTimeUtc"}
        - type: object
          required: [type]
          properties:
            type: {const: pong}
      examples:
        - {type: ready, user: 0192f3c4-5b6a-7c8d-9e0f-00000000aaaa, heartbeat_seconds: 25}
        - {type: joined, ref: j1, room: "doc:sales_invoice:0192f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f", outcome: replayed, replayed: 2}
        - {type: join_error, ref: j2, room: "doctype:salary_slip", error: {code: permission.denied, message: "You cannot see salary slips."}}
        - type: event
          room: "doc:sales_invoice:0192f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f"
          seq: 14
          kind: doc_updated
          payload: {doctype: sales_invoice, id: 0192f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f, version: 4}
          published_at: "2026-09-29T10:15:02.120Z"
        - {type: pong}

    ReportSummary:
      type: object
      required: [name, label, app, base_doctype]
      properties:
        name: {$ref: "#/components/schemas/Identifier"}
        label: {type: string}
        app: {$ref: "#/components/schemas/Identifier"}
        base_doctype: {$ref: "#/components/schemas/Identifier"}

    ReportParameter:
      type: object
      required: [name, label, type, required]
      properties:
        name: {$ref: "#/components/schemas/Identifier"}
        label: {type: string}
        type:
          type: string
          enum: [text, int, decimal, date, link, select]
        required: {type: boolean}
        default:
          $ref: "#/components/schemas/FieldValue"
          description: The value used when the caller sends none; absent when there is no default.
        options:
          description: Present for `select` and `link` parameters only.
          oneOf:
            - type: object
              additionalProperties: false
              required: [source, values]
              properties:
                source: {const: values}
                values: {type: array, items: {type: string}}
            - type: object
              additionalProperties: false
              required: [source, doctype]
              properties:
                source: {const: link}
                doctype:
                  $ref: "#/components/schemas/Identifier"
                  description: The DocType whose candidates `lookup_search` supplies for this parameter.

    ReportDescription:
      type: object
      required: [name, label, app, base_doctype, parameters, columns, max_rows]
      properties:
        name: {$ref: "#/components/schemas/Identifier"}
        label: {type: string}
        app: {$ref: "#/components/schemas/Identifier"}
        base_doctype: {$ref: "#/components/schemas/Identifier"}
        parameters: {type: array, items: {$ref: "#/components/schemas/ReportParameter"}}
        columns:
          description: The columns this caller may see, in result order. Never a column removed for the caller.
          type: array
          items:
            type: object
            required: [name, label, type]
            properties:
              name: {$ref: "#/components/schemas/Identifier"}
              label: {type: string}
              type: {$ref: "#/components/schemas/FieldType"}
        max_rows: {type: integer, minimum: 1, description: The largest `limit` a run honours.}

    RevealRequest:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          $ref: "#/components/schemas/FieldPath"
          description: One field of the document, or one child-table row field as `table[idx].field`.
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the caller needs the real value. Stored in the audit trail; plain text.

    RevealResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [value]
          properties:
            value:
              $ref: "#/components/schemas/FieldValue"
              description: The real value of that one field, in the field's value encoding.

    ExportSpec:
      type: object
      additionalProperties: false
      required: [doctype, format]
      properties:
        doctype: {$ref: "#/components/schemas/Identifier"}
        columns:
          type: array
          maxItems: 256
          items: {$ref: "#/components/schemas/Identifier"}
          description: Fields to export. Default is every column the caller may export.
        filter: {$ref: "#/components/schemas/Filter"}
        order:
          type: array
          maxItems: 8
          items: {$ref: "#/components/schemas/OrderKey"}
          description: Default is `(modified, id)`. `id` is always appended as the final key.
        format: {type: string, enum: [csv, ndjson]}
        include_children:
          type: boolean
          default: false
          description: Child tables as further parts of each chunk (`multipart/mixed`), keyed by parent id.
        max_rows:
          type: integer
          minimum: 1
          description: Stop after this many parent rows. At most the site's policy cap.

    ExportNextRequest:
      type: object
      additionalProperties: false
      required: [cursor]
      properties:
        cursor:
          type: string
          minLength: 1
          maxLength: 2048
          description: The `X-Export-Cursor` of the previous chunk. Opaque and signed; never put in a URL.

    ExtractRequest:
      type: object
      additionalProperties: false
      required: [doctype, watermark]
      properties:
        doctype: {$ref: "#/components/schemas/Identifier"}
        columns:
          type: array
          maxItems: 256
          items: {$ref: "#/components/schemas/Identifier"}
        watermark:
          type: string
          minLength: 1
          maxLength: 2048
          description: From `X-Export-Watermark` of a full export, or the `new_watermark` of the previous page. Opaque and signed; never put in a URL.
        limit: {type: integer, minimum: 1, maximum: 5000, default: 1000}

    ExtractRow:
      type: object
      required: [id, version]
      description: One document's current state in the requested columns, with its `id` and `version`.
      properties:
        id: {$ref: "#/components/schemas/RecordId"}
        version: {type: integer, minimum: 1}
      additionalProperties: {$ref: "#/components/schemas/FieldValue"}

    ExtractPage:
      type: object
      required: [upserts, deletes, new_watermark, has_more]
      properties:
        upserts: {type: array, items: {$ref: "#/components/schemas/ExtractRow"}}
        deletes: {type: array, items: {$ref: "#/components/schemas/RecordId"}}
        new_watermark: {type: string, description: Opaque and signed. Store it after applying this page.}
        has_more: {type: boolean}

    EventPosition:
      type: string
      description: |
        An opaque, versioned feed position, bound to the consumer it was issued for. It grants
        nothing and reveals no count of events the owner cannot read. Compare only for equality.
      pattern: '^v1\.[A-Za-z0-9_-]{1,255}$'

    ConsumerSpec:
      type: object
      additionalProperties: false
      required: [topics, partitions, payload_mode]
      properties:
        topics:
          type: array
          minItems: 1
          maxItems: 64
          items: {type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*(\.\*)?$'}
          description: Exact topic names, or a prefix ending in `.*`.
        filter:
          type: [string, "null"]
          maxLength: 2000
          description: An expression over the envelope `meta` and `subject` in the shared expression language.
        partitions: {type: integer, minimum: 1, maximum: 64}
        payload_mode: {type: string, enum: [ids_only, fields]}
        start: {$ref: "#/components/schemas/ConsumerStart"}
        classes:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: {type: string, enum: [state, domain, audit]}
          description: "Event classes to receive (0.16.0). Default `domain` and `audit`. Telemetry is never available. `state` and `audit` need the reserved-class stream right."
        entities:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 200, pattern: '^[^\x00-\x1f\x7f]+$'}
          description: "DocType names that narrow `state` events by the envelope's entity (0.16.0); only meaningful with `state`."

    ConsumerStart:
      description: Where a consumer or a restarted partition begins. Default (on create) is `tail`.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: {type: string, enum: [tail, from_beginning]}
        - type: object
          additionalProperties: false
          required: [kind, position]
          properties:
            kind: {const: from_position}
            position: {$ref: "#/components/schemas/EventPosition"}

    EventConsumer:
      type: object
      required: [name, owner, topics, partitions, payload_mode, partitions_state]
      properties:
        name: {$ref: "#/components/schemas/Identifier"}
        owner: {$ref: "#/components/schemas/RecordId"}
        topics: {type: array, items: {type: string}}
        filter: {type: [string, "null"]}
        partitions: {type: integer, minimum: 1, maximum: 64}
        payload_mode: {type: string, enum: [ids_only, fields]}
        classes: {type: array, maxItems: 3, items: {type: string, enum: [state, domain, audit]}}
        entities: {type: array, maxItems: 64, items: {type: string, maxLength: 200}}
        partitions_state:
          type: array
          items:
            type: object
            required: [partition, checkpoint, parked]
            properties:
              partition: {type: integer, minimum: 0, maximum: 63}
              checkpoint: {$ref: "#/components/schemas/EventPosition"}
              parked: {type: boolean, description: True when the partition made no progress for the park timeout and has stopped consuming capacity.}

    EventConsumerResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/EventConsumer"}

    PullRequest:
      type: object
      additionalProperties: false
      required: [partition]
      properties:
        partition: {type: integer, minimum: 0, maximum: 63}
        limit: {type: integer, minimum: 1, maximum: 1000, default: 100}
        wait_ms: {type: integer, minimum: 0, maximum: 30000, default: 0}

    EventEnvelope:
      type: object
      description: |
        A published event as seen outside its source database. The property names and meanings
        are exactly those of `EventEnvelope` in `contracts/events` (ADR-056); `check.py` fails if
        the two differ. `position` is the feed position; gaps in `seq` are normal and mean nothing.
        Under `payload_mode: ids_only` `data` holds identifiers only.
      required: [event_id, topic, schema_version, source_id, position, transaction, ordinal, subject, meta, data]
      properties:
        event_id: {$ref: "#/components/schemas/RecordId"}
        topic: {type: string, pattern: '^[a-z][a-z0-9_]{0,62}$'}
        schema_version: {type: integer, minimum: 1}
        source_id: {type: string, description: "The producing database: `<site>` or `<site>#<partition>`."}
        position:
          type: object
          additionalProperties: false
          required: [generation, seq]
          properties:
            generation: {type: integer, minimum: 0}
            seq: {type: integer, minimum: 0}
        transaction: {$ref: "#/components/schemas/RecordId"}
        ordinal: {type: integer, minimum: 0}
        subject:
          type: object
          additionalProperties: false
          required: [entity, id]
          properties:
            entity: {$ref: "#/components/schemas/Identifier"}
            id: {$ref: "#/components/schemas/RecordId"}
        subject_version: {type: integer, minimum: 1}
        meta:
          type: object
          required: [occurred_at, actor, correlation_id]
          properties:
            occurred_at: {$ref: "#/components/schemas/DateTimeUtc"}
            actor:
              type: object
              required: [kind]
              description: |
                Who caused the event (ADR-056). `user` and `consumer` carry `id`, the id inside
                that principal's own store (the same id under the two kinds is two principals);
                `user` may carry `via`, the real person acting as that user. A `consumer` never
                carries `via`. `system` carries `component`. The set of kinds equals the
                variants of `Actor` in `contracts/events` (`check.py`, rule 16). A client that
                meets a kind it does not know ignores the event's actor.
              properties:
                kind: {type: string, enum: [user, consumer, system]}
            command_id: {type: string, pattern: '^[\x21-\x7e]{1,128}$'}
            causation_id: {$ref: "#/components/schemas/RecordId"}
            correlation_id: {$ref: "#/components/schemas/RecordId"}
            trace_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        data: {description: Topic data; protected fields are removed or masked for the owner.}

    PullBatch:
      type: object
      required: [events, next_position, skipped, window_full]
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/EventEnvelope"}
          description: In `(generation, seq, ordinal)` order within the partition.
        next_position:
          $ref: "#/components/schemas/EventPosition"
          description: Acknowledge this after every returned event is durably applied. Not committed by the pull.
        skipped: {type: integer, minimum: 0, description: "Events in the range the owner may not read. Names no subject."}
        window_full: {type: boolean}
        served_from: {type: string, enum: [outbox, journal], description: "Where this answer came from (0.16.0): `journal` when the checkpoint was older than the outbox horizon and the tenant's journal answered. Clients that do not know the field ignore it."}

    AckRequest:
      type: object
      additionalProperties: false
      required: [partition, position]
      properties:
        partition: {type: integer, minimum: 0, maximum: 63}
        position: {$ref: "#/components/schemas/EventPosition"}

    RestartRequest:
      type: object
      additionalProperties: false
      required: [partition, from]
      properties:
        partition: {type: integer, minimum: 0, maximum: 63}
        from: {$ref: "#/components/schemas/ConsumerStart"}

    Checkpoint:
      type: object
      required: [partition, position]
      properties:
        partition: {type: integer, minimum: 0, maximum: 63}
        position: {$ref: "#/components/schemas/EventPosition"}

    # ---- Processes, runs and the task inbox (0.12.0, WP-CON-03.T20) ----
    RunId:
      type: string
      description: |
        The id of a run: the cryptographic case id of WP-BPM-12.T3, URL-safe and opaque. A
        client stores and sends it back as given and never parses it.
      pattern: '^[A-Za-z0-9_-]{16,64}$'
    TaskId:
      type: string
      description: The id of a task (lower-case, starts with a letter). Opaque to a client.
      pattern: '^[a-z][a-z0-9_]{0,63}$'
    UserRef:
      type: string
      description: A user id as the directory shows it (the display id), never an email address or a name.
      minLength: 1
      maxLength: 128
    InputSchema:
      type: object
      description: |
        The trigger's JSON Schema subset (`type`, `properties`, `required`, `items`, `enum`,
        `additionalProperties` as a boolean, and the length, range and pattern bounds). No `$ref`
        and no keyword outside the subset; at most 64 KiB serialised. Open by nature: it is a
        schema, not a record.
      maxProperties: 16
    RunState:
      type: string
      enum: [running, waiting, completed, failed, cancelled]
      description: |
        `waiting` is a running run whose every active step waits on a person, a timer or another
        organisation's reply. `completed`, `failed` and `cancelled` are final.
    StepState:
      type: string
      enum: [pending, active, waiting, completed, failed, skipped, cancelled]
    DocumentRef:
      type: object
      additionalProperties: false
      required: [doctype, id]
      properties:
        doctype: {$ref: "#/components/schemas/Identifier"}
        id: {$ref: "#/components/schemas/RecordId"}
    ProcessSummary:
      type: object
      additionalProperties: false
      required: [name, label, version, input_schema]
      properties:
        name: {$ref: "#/components/schemas/Identifier"}
        label: {type: string, minLength: 1, maxLength: 140}
        version: {type: integer, minimum: 1}
        input_schema: {$ref: "#/components/schemas/InputSchema"}
    ProcessPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/ProcessSummary"}}
        next_cursor: {type: [string, "null"], maxLength: 2048, description: "Opaque. `null` on the last page."}
    RunStart:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input:
          type: object
          description: The start input, validated against the trigger's `input_schema`. At most 64 KiB serialised.
          maxProperties: 200
        business_key:
          type: string
          description: The client's own reference for the run. Not unique; grants nothing.
          minLength: 1
          maxLength: 128
          pattern: '^[\x21-\x7e]+$'
    RunCancel:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
    RunStep:
      type: object
      additionalProperties: false
      required: [node, label, state]
      properties:
        node: {type: string, minLength: 1, maxLength: 128}
        label: {type: string, minLength: 1, maxLength: 140}
        state: {$ref: "#/components/schemas/StepState"}
        started_at: {$ref: "#/components/schemas/DateTimeUtc"}
        ended_at: {$ref: "#/components/schemas/DateTimeUtc"}
    Run:
      type: object
      additionalProperties: false
      required: [id, process, version, state, business_key, started_at, steps, documents]
      description: |
        A run. Carries no variables, no node outputs and no error text; `failure_code` is a stable
        code of the process engine's catalogue, present only on a `failed` run.
      properties:
        id: {$ref: "#/components/schemas/RunId"}
        process: {$ref: "#/components/schemas/Identifier"}
        version: {type: integer, minimum: 1}
        state: {$ref: "#/components/schemas/RunState"}
        business_key: {type: [string, "null"], minLength: 1, maxLength: 128}
        started_at: {$ref: "#/components/schemas/DateTimeUtc"}
        ended_at: {$ref: "#/components/schemas/DateTimeUtc"}
        failure_code: {type: string, minLength: 1, maxLength: 128, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'}
        steps: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/RunStep"}}
        documents: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/DocumentRef"}}
    RunResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Run"}
        messages: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Message"}}
    RunPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/Run"}}
        next_cursor: {type: [string, "null"], maxLength: 2048, description: "Opaque. `null` on the last page."}
    RunEvent:
      type: object
      additionalProperties: false
      required: [seq, at, kind]
      description: One line of a run's audit trail. No payload.
      properties:
        seq: {type: integer, minimum: 1}
        at: {$ref: "#/components/schemas/DateTimeUtc"}
        kind: {type: string, minLength: 1, maxLength: 64, pattern: '^[a-z][a-z0-9_.]*$'}
        node: {type: string, minLength: 1, maxLength: 128}
        actor: {type: string, minLength: 1, maxLength: 128, description: "A user id, `system:<name>` or `consumer:<id>`."}
    RunEventPage:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/RunEvent"}}
        next_after: {type: integer, minimum: 1, description: "The last `seq` of the page; absent on an empty page."}
    WebhookAccepted:
      type: object
      additionalProperties: false
      required: [accepted]
      properties:
        accepted: {type: boolean, const: true}
    TaskState:
      type: string
      enum: [open, claimed, completed, cancelled, expired]
      description: '`open` and `claimed` are active; the other three are final.'
    TaskItem:
      type: object
      additionalProperties: false
      required: [id, run, process, node, label, state, assignees, version]
      properties:
        id: {$ref: "#/components/schemas/TaskId"}
        run: {$ref: "#/components/schemas/RunId"}
        process: {$ref: "#/components/schemas/Identifier"}
        node: {type: string, minLength: 1, maxLength: 128}
        label: {type: string, minLength: 1, maxLength: 280}
        state: {$ref: "#/components/schemas/TaskState"}
        due_at: {$ref: "#/components/schemas/DateTimeUtc"}
        assignees: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/UserRef"}}
        claimed_by: {$ref: "#/components/schemas/UserRef"}
        document: {$ref: "#/components/schemas/DocumentRef"}
        version: {type: integer, minimum: 1}
    TaskPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/TaskItem"}}
        next_cursor: {type: [string, "null"], maxLength: 2048, description: "Opaque. `null` on the last page."}
    TaskOutcome:
      type: object
      additionalProperties: false
      required: [outcome, label]
      properties:
        outcome: {type: string, minLength: 1, maxLength: 128, description: "The token to send in `task_complete`: `approve`, `reject` or `choose:<path>`."}
        label: {type: string, minLength: 1, maxLength: 140}
    TaskField:
      type: object
      additionalProperties: false
      required: [name, type]
      description: One form field the step collects; the name and the type only.
      properties:
        name: {$ref: "#/components/schemas/Identifier"}
        type: {$ref: "#/components/schemas/FieldType"}
    TaskEvent:
      type: object
      additionalProperties: false
      required: [at, kind, actor]
      properties:
        at: {$ref: "#/components/schemas/DateTimeUtc"}
        kind:
          type: string
          enum: [created, claimed, released, completed, auto_completed, delegated, reassigned, reminded, escalated, cancelled]
        actor: {type: string, minLength: 1, maxLength: 128, description: "A user id or `system:sla`."}
        on_behalf_of: {$ref: "#/components/schemas/UserRef"}
        to: {$ref: "#/components/schemas/UserRef"}
        outcome: {type: string, minLength: 1, maxLength: 128}
    TaskDetail:
      type: object
      additionalProperties: false
      required: [task, outcomes, fields, events]
      properties:
        task: {$ref: "#/components/schemas/TaskItem"}
        outcomes: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/TaskOutcome"}}
        fields: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/TaskField"}}
        events: {type: array, maxItems: 200, items: {$ref: "#/components/schemas/TaskEvent"}}
    TaskDetailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/TaskDetail"}
        messages: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Message"}}
    TaskResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/TaskItem"}
        messages: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Message"}}
    TaskComplete:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: {type: string, minLength: 1, maxLength: 128}
        comment: {type: string, maxLength: 2000}
        values: {type: object, maxProperties: 100, description: "Values of the form fields `task_get` named; at most 64 KiB serialised."}
    TaskDelegate:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: {$ref: "#/components/schemas/UserRef"}
        until: {type: string, format: date-time, maxLength: 40}
        reason: {type: string, maxLength: 500}
    TaskReassign:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: {$ref: "#/components/schemas/UserRef"}
        reason: {type: string, maxLength: 500}
    ProcessVersionState:
      type: string
      enum: [draft, published, retired]
    ProcessVersion:
      type: object
      additionalProperties: false
      required: [version, state, published_at, published_by, note, running_runs]
      properties:
        version: {type: integer, minimum: 1}
        state: {$ref: "#/components/schemas/ProcessVersionState"}
        published_at: {oneOf: [{$ref: "#/components/schemas/DateTimeUtc"}, {type: "null"}]}
        published_by: {type: [string, "null"], minLength: 1, maxLength: 128, description: "A user id, or `null` for a draft."}
        note: {type: string, maxLength: 500}
        running_runs: {type: integer, minimum: 0}
    ProcessVersionPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/ProcessVersion"}}
        next_cursor: {type: [string, "null"], maxLength: 2048, description: "Opaque. `null` on the last page."}
    ProcessVersionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/ProcessVersion"}
        messages: {type: array, maxItems: 50, items: {$ref: "#/components/schemas/Message"}}
    ProcessVersionDetail:
      type: object
      additionalProperties: false
      required: [version, state, published_at, published_by, note, running_runs, definition, hash]
      properties:
        version: {type: integer, minimum: 1}
        state: {$ref: "#/components/schemas/ProcessVersionState"}
        published_at: {oneOf: [{$ref: "#/components/schemas/DateTimeUtc"}, {type: "null"}]}
        published_by: {type: [string, "null"], minLength: 1, maxLength: 128}
        note: {type: string, maxLength: 500}
        running_runs: {type: integer, minimum: 0}
        definition: {type: string, maxLength: 262144, description: "The model's text form. At most 256 KiB."}
        hash: {type: string, pattern: '^[0-9a-f]{64}$', maxLength: 64, description: "Lower-case hex SHA-256 of `definition`; the same value as the `ETag` without its quotes."}
    ProcessVersionDetailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/ProcessVersionDetail"}
    ProcessVersionPublish:
      type: object
      additionalProperties: false
      required: [definition]
      properties:
        definition: {type: string, minLength: 1, maxLength: 262144, description: "The model's text form. At most 256 KiB."}
        note: {type: string, maxLength: 500}
        expected_previous: {type: integer, minimum: 0, description: "The version number the client believes is the latest (0 for none)."}
    MigrationMapping:
      type: object
      additionalProperties: false
      description: The explicit node pairs and variable contract of one migration (`spot-bpm-versioning::MigrationMapping`).
      properties:
        nodes:
          type: object
          maxProperties: 500
          description: "Node id in `from` to node id in `to`. A node not listed maps to the node of the same id."
          additionalProperties: {type: string, minLength: 1, maxLength: 128}
        required_variables:
          type: array
          maxItems: 100
          description: Dotted variable paths the target version requires.
          items: {type: string, minLength: 1, maxLength: 256}
        variable_defaults:
          type: object
          maxProperties: 100
          description: Defaults for required paths a run lacks, at most 64 KiB serialised.
    MigrationRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to: {type: integer, minimum: 1}
        mapping: {$ref: "#/components/schemas/MigrationMapping"}
    MigrationNodeCount:
      type: object
      additionalProperties: false
      required: [from, to, runs]
      properties:
        from: {type: string, minLength: 1, maxLength: 128}
        to: {type: string, minLength: 1, maxLength: 128}
        runs: {type: integer, minimum: 0}
    MigrationUnmoved:
      type: object
      additionalProperties: false
      required: [run, reason]
      properties:
        run: {$ref: "#/components/schemas/RunId"}
        reason: {type: string, minLength: 1, maxLength: 128, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$', description: "A stable `bpm_versioning.*` code."}
    MigrationPlan:
      type: object
      additionalProperties: false
      required: [from, to, movable, unmoved_total, node_counts, unmoved]
      properties:
        from: {type: integer, minimum: 1}
        to: {type: integer, minimum: 1}
        movable: {type: integer, minimum: 0}
        unmoved_total: {type: integer, minimum: 0}
        node_counts: {type: array, maxItems: 500, items: {$ref: "#/components/schemas/MigrationNodeCount"}}
        unmoved: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/MigrationUnmoved"}}
    MigrationPlanResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/MigrationPlan"}
    MigrationStarted:
      type: object
      additionalProperties: false
      required: [migration_id]
      properties:
        migration_id: {$ref: "#/components/schemas/MigrationIdValue"}
    MigrationIdValue:
      type: string
      description: The id of a migration. Opaque; a client stores and sends it back as given.
      pattern: '^[A-Za-z0-9_-]{16,64}$'
      maxLength: 64
    MigrationState:
      type: string
      enum: [running, completed, failed]
    Migration:
      type: object
      additionalProperties: false
      required: [state, moved, skipped, failed, started_at]
      properties:
        state: {$ref: "#/components/schemas/MigrationState"}
        moved: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        started_at: {$ref: "#/components/schemas/DateTimeUtc"}
        ended_at: {$ref: "#/components/schemas/DateTimeUtc"}
    MigrationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Migration"}
    GraphNodeRef:
      type: object
      additionalProperties: false
      required: [doctype, id]
      description: A record named by `doctype` and `id` only; the client reads its fields through `resource_get`.
      properties:
        doctype: {$ref: "#/components/schemas/Identifier"}
        id: {$ref: "#/components/schemas/RecordId"}
    GraphDirection:
      type: string
      enum: [out, in, both]
    GraphLiteral:
      description: A literal in a filter. A decimal is a string (ADR-12), never a number.
      oneOf:
        - {type: string, maxLength: 1024}
        - {type: boolean}
        - {type: integer}
    GraphFilter:
      description: |
        A filter over the fields of one record (the vocabulary of `spot-graph-query`'s filter:
        comparisons, `in`, null tests, `and`, `or`, `not`; nothing else). At most 4 levels deep and
        32 terms in all, checked by the server (`422 graph.too_large`).
      oneOf:
        - {$ref: "#/components/schemas/GraphFilterCompare"}
        - {$ref: "#/components/schemas/GraphFilterIn"}
        - {$ref: "#/components/schemas/GraphFilterNull"}
        - {$ref: "#/components/schemas/GraphFilterAnd"}
        - {$ref: "#/components/schemas/GraphFilterOr"}
        - {$ref: "#/components/schemas/GraphFilterNot"}
    GraphFilterCompare:
      type: object
      additionalProperties: false
      required: [field, op, value]
      properties:
        field: {$ref: "#/components/schemas/Identifier"}
        op: {type: string, enum: [eq, ne, lt, le, gt, ge]}
        value: {$ref: "#/components/schemas/GraphLiteral"}
    GraphFilterIn:
      type: object
      additionalProperties: false
      required: [field, in]
