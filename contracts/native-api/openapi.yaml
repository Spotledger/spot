  /api/v1/auth/invitations/accept:
    post:
      tags: [identity]
      operationId: auth_invitation_accept
      summary: "Accept an invitation and set a password"
      description: |
        Accept an invitation and set a password. The token is used once. The password must satisfy the
        tenant's policy (`422 auth.password_policy`). Answers `{accepted: true}`; the person then signs
        in with auth_login. Failed attempts are rate-limited per client address. Audience: anyone, no
        bearer token (the tenant comes from the site). Permission: none (the invitation token is the
        credential). Rate class `auth (per client address)`. Takes no `Idempotency-Key`: a repeat is a
        repeat of the action. Audited: who, what and the outcome; a refusal is audited too.
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AuthInvitationAcceptRequest"}}}}
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/AuthInvitationAcceptResponse"}}}}
