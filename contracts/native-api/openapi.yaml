    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [identity]
      operationId: identity_user_recover
      summary: "Administrator-initiated recovery"
      description: |
        Administrator-initiated recovery. Sends the recovery to every address on file (ADR-070 section
        5); a second approver is needed for an administrator's account, in which case the answer is
        `202` and the approval is a grant request of the governance operations. Nothing secret is in the
        answer. Audience: staff and partner (ADR-083: never the consumer audience). Permission: the
        platform permission `identity.manage` (held by the Tenant Administrator by default). Rate class
        `interactive`. Needs a recent step-up (`403 auth.step_up_required`). Takes no `Idempotency-Key`:
        a repeat is a repeat of the action. Audited: who, what and the outcome; a refusal is audited
        too. A cross-tenant id answers `404 identity.not_found` exactly like a missing one.
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IdentityUserRecoverRequest"}}}}
      responses:
        "202": {description: Done.}
        default: {$ref: "#/components/responses/Error"}

