        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [identity]
      operationId: identity_assignment_create
      summary: "Grant a role"
      description: |
        Grant a role. Answers `201` with the assignment when the grant is made, or `202` with
        `grant_request_id` when the governance policy requires approval (the request is decided through
        the governance operations). A segregation-of-duties conflict is `409 identity.sod_conflict` with
        the rule ids only. A caller cannot grant themselves a role. Audience: staff and partner
        (ADR-083: never the consumer audience). Permission: the platform permission `identity.assign`
        (held by the Tenant Administrator by default). Rate class `interactive`. Needs a recent step-up
        (`403 auth.step_up_required`). Requires an `Idempotency-Key`. Audited: who, what and the
        outcome; a refusal is audited too. A cross-tenant id answers `404 identity.not_found` exactly
        like a missing one.
      parameters:
        - {"$ref": "#/components/parameters/IdempotencyKeyRequired"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/IdentityAssignmentCreateRequest"}}}}
      responses:
        "201": {description: "The grant was made; the body carries the assignment only.", content: {application/json: {schema: {$ref: "#/components/schemas/IdentityAssignmentCreateResponse"}}}}
        "202": {description: "The governance policy requires approval; no assignment exists yet. The body carries `grant_request_id` only; the request is decided through the governance operations.", content: {application/json: {schema: {$ref: "#/components/schemas/IdentityAssignmentGrantRequestedResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

