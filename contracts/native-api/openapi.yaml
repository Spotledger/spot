        a repeat is a repeat of the action. Audited: who, what and the outcome; a refusal is audited
        too. A cross-tenant id answers `404 identity.not_found` exactly like a missing one.
      responses:
        "200": {description: OK., content: {application/json: {schema: {$ref: "#/components/schemas/IdentityUserEnableResponse"}}}}
        default: {$ref: "#/components/responses/Error"}

  /api/v1/identity/users/{id}/anonymise:
    parameters:
      - {"name": "id", "in": "path", "required": true, "schema": {"type": "string", "maxLength": 200, "minLength": 1}}
    post:
      tags: [identity]
      operationId: identity_user_anonymise
      summary: "Anonymise a user (the only removal)"
      description: |
        Anonymise a user (the only removal). Irreversible (ADR-070 section 6): the personal data is
        erased and the user is `anonymised`; the records they made keep a stable pseudonym.
        `confirm_email` must equal the user's e-mail address. There is no DELETE on a user. Audience:
        staff and partner (ADR-083: never the consumer audience). Permission: the platform permission
