[package]
# Named `spot-app-api`, not `*-contract`: it is the one crate app crates may depend on (gate G4,
# tools/lints/deps/rules.toml), so it re-exports everything apps need.
name = "spot-app-api"
version = "0.7.0"
description = "App API contract v0.3 (ADR-057 as amended by ADR-068, field security from amendment A1) for the Spotledger Platform: document handle, typed views with the full field model, configurable lookups, pipelines, seams, messages, typed errors, stub host and contract tests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spot-core = { path = "../../crates/framework/spot-core" }
spot-storage-contract = { path = "../storage" }
spot-events-contract = { path = "../events" }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.55", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
