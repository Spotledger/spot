# Bearer tokens: `Bearer <opaque token>` wherever it appears; the scheme stays.
# Corpus format: [[case]] with input/expected/class (class must equal the file stem).

[[case]]
input = 'Authorization: Bearer mF_9.B5f-4.1JdMY for user 12'
expected = 'Authorization: Bearer [redacted:token] for user 12'
class = 'bearer'

[[case]]
input = 'bearer 09vX7fKk3QmZp2Wb'
expected = 'bearer [redacted:token]'
class = 'bearer'

[[case]]
input = 'BEARER 09vX7fKk3QmZp2Wb succeeded'
