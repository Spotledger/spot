# `password=`/`secret=`-family query, form and JSON-ish credentials; the key stays.

[[case]]
input = '/login?user=admin&password=hunter2x&next=/app'
expected = '/login?user=admin&password=[redacted:parameter]&next=/app'
class = 'parameter_credentials'

[[case]]
input = 'username=admin&password=secret99'
expected = 'username=admin&password=[redacted:parameter]'
class = 'parameter_credentials'

[[case]]
input = 'pwd = tiger123'
expected = 'pwd = [redacted:parameter]'
class = 'parameter_credentials'

[[case]]
input = '"password": "hunter 2"'
expected = '"password": [redacted:parameter]'
class = 'parameter_credentials'

[[case]]
input = 'token=eyJhbGciOiJIUzUxMiJ9.sigPart42'
expected = 'token=[redacted:jwt]'
class = 'parameter_credentials'

[[case]]
input = 'client_secret=ab12cd34ef56gh90'
expected = 'client_secret=[redacted:parameter]'
class = 'parameter_credentials'

[[case]]
input = 'passwd=tiger'
expected = 'passwd=[redacted:parameter]'
class = 'parameter_credentials'

[[case]]
input = '?apikey=Z9z8z7z6z5&fmt=json'
