# Known secrets registered at runtime (the demo values below, all fake).
# The corpus test registers: staging_db = hunter2staging, example = correct-horse-battery,
# legacy_key = DbP4ss&/word9x. Failure output never prints the values.

[[case]]
input = 'connect failed: DbP4ss&/word9x rotated'
expected = 'connect failed: [redacted:legacy_key] rotated'
class = 'known_secret'

[[case]]
input = 'blob=RGJQNHNzJi93b3JkOXg= in transit'
expected = 'blob=[redacted:legacy_key] in transit'
class = 'known_secret'

[[case]]
input = 'blob=RGJQNHNzJi93b3JkOXg unpadded'
expected = 'blob=[redacted:legacy_key] unpadded'
class = 'known_secret'

[[case]]
input = 'pw=DbP4ss%26%2Fword9x upper hex'
expected = 'pw=[redacted:legacy_key] upper hex'
class = 'known_secret'

[[case]]
input = 'pw=dbp4ss%26%2fword9x lower hex'
expected = 'pw=[redacted:legacy_key] lower hex'
class = 'known_secret'

[[case]]
input = 'login used hunter2staging for staging'
expected = 'login used [redacted:staging_db] for staging'
class = 'known_secret'

[[case]]
input = 'aHVudGVyMnN0YWdpbmc leaked as base64'
expected = '[redacted:staging_db] leaked as base64'
class = 'known_secret'

[[case]]
input = 'correct-horse-battery is the example'
expected = '[redacted:example] is the example'
class = 'known_secret'

[[case]]
input = 'Y29ycmVjdC1ob3JzZS1iYXR0ZXJ5 (correct-horse-battery) twice'
expected = '[redacted:example] ([redacted:example]) twice'
class = 'known_secret'

[[case]]
input = 'two at once: hunter2staging then DbP4ss&/word9x'
expected = 'two at once: [redacted:staging_db] then [redacted:legacy_key]'
class = 'known_secret'