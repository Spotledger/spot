[package]
name = "spot-graph-projection"
description = "Spotledger optional one-way projection of the business graph to an external graph engine (WS8, WP-GRA-07.T1, ADR-50): a GraphSink trait with a reference in-memory and JSON-lines file sink, a Projector that consumes edge events from the outbox with a durable checkpoint, a drift verifier and a bulk rebuild, and a field projection that excludes sensitive fields by construction"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The event vocabulary the projection speaks: `EdgeEvent`, `Edge`, `EdgeKey`, `GraphKey`, the
# rebuild `GraphSource` and the `Drift` the verifier returns.
spot-graph-index = { path = "../spot-graph-index" }
# Record keys, typed values, feed positions and the committed outbox record the projector reads.
spot-storage-contract = { path = "../../../contracts/storage" }
# The registered name of the edge topic (`sys_graph_edge`), so the projector has one source for it.
spot-events-contract = { path = "../../../contracts/events" }
# The effective metadata the sensitive-field rule is computed from (`field_protection`).
spot-meta = { path = "../spot-meta" }
# Exact decimals: `Value::Decimal` is round-tripped through the JSON-lines wire form.
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
# Dates and instants in the wire form.
time = { version = "0.3.55", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
# The JSON-lines export format and the outbox payload decoding.
serde_json = "1"
# Typed errors with stable `graph_projection.*` codes.
thiserror = "2"

[dev-dependencies]
# Randomised event sequences with duplicates and restarts.
proptest = "1"

[lints]
workspace = true
