[package]
name = "spot-settings-store-pg"
description = "The settings value store with change history (WP-ADM-07.T2): scoped values with compare-and-set versions, an append-only history of who, when and the old and new digests (never a value), a PostgreSQL implementation and an in-memory one for tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# `ScopeRef` and `StoredValue`: the model the store persists.
spot-settings = { path = "../spot-settings" }
# The digest of an old and a new value, stored as hex.
sha2 = "0.10"
serde_json = "1"
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
# `ParamValue`, the plain value type inside `StoredValue`.
spot-mgmt-ops = { path = "../spot-mgmt-ops" }

[dev-dependencies]
spot-postgres = { path = "../../backends/spot-postgres", features = ["testing"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
