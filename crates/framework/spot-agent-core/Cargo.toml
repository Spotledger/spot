[package]
name = "spot-agent-core"
description = "The host agent's execution core (WP-ADM-03.T1, blueprint WS22, ADR-44): local verification of signed administrative commands, risk levels taken from the typed operation catalogue, the two-person rule, replay and expiry protection, privilege separation between an unprivileged broker and a privileged executor over a local channel, and a tamper-evident result log built on the audit chain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The typed operation catalogue: the operation id, its parameters and, above all, its
# risk level. The risk level is read from here and never from the command envelope.
spot-mgmt-ops = { path = "../spot-mgmt-ops" }
# The signed command envelope: the canonical command, its signatures, the verifier and
# the nonce store contract. This crate decides *whether* a command may run on top of it.
spot-signed-command = { path = "../spot-signed-command" }
# The agent identity: the audience of a command is the enrolled agent id, and the key
# protection enum (software/hardware) is shared with administrator key entries.
spot-agent-enroll = { path = "../spot-agent-enroll" }
# The tamper-evident audit chain: every decision and result is one linked, hashed entry.
spot-audit-chain = { path = "../spot-audit-chain" }
# The wire envelope (canonical command text plus signatures) is plain serde JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ed25519: verifying administrator signatures, broker plan signatures and attestations.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# SHA-256 for the command digest and the plan hash.
sha2 = "0.10"
# Standard base64 for the byte fields of the wire envelope.
base64 = "0.22"
# Typed errors with stable `agent_core.*` codes.
thiserror = "2"

[dev-dependencies]
# Property tests: arbitrary bytes never panic the envelope decoder.
proptest = "1"
# A blocking executor for the asynchronous audit chain in tests.
futures = "0.3"

[lints]
workspace = true
