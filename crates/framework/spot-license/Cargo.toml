[package]
name = "spot-license"
description = "Spotledger licence and entitlements (WP-CTL-04.T1): canonical, versioned licence payloads signed with Ed25519, offline verification and trusted-key rotation, the licence state machine (NotYetValid/Active/RenewalDue/Grace/Restricted/Expired), clock-tamper resistance, renewals, and the `issue` feature for the control plane"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# Issuing helper for the control plane and tests. Never compiled into the product binary.
issue = []

[dependencies]
# The one cryptographic dependency (pre-approved): Ed25519 signatures over the licence
# payload. `std` only; no RNG features — keys are always supplied by the caller.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# Canonical, versioned JSON payloads and tamper diagnostics.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Typed errors with stable `licence.*` codes.
thiserror = "2"
# Base64url text form of a signed licence.
base64 = "0.22"
# The `Clock` contract: the only way this crate reads the time.
spot-core = { path = "../spot-core" }

[dev-dependencies]
# Explicit instants for the `ManualClock` the offline state machine tests drive.
time = { version = "0.3.55", default-features = false, features = ["std"] }
# Property tests: `evaluate` monotonic in `now`; verify never panics on arbitrary bytes.
proptest = "1"

[lints]
workspace = true