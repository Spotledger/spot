[package]
name = "spot-money"
description = "Exact money and quantity types, rounding rules as data, allocation and tax rounding (WP-DOC-02.T1, ADR-12)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# Exact decimals (ADR-12); same version and features as spot-pg-query.
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"

[dev-dependencies]
# Allocation and rounding properties.
proptest = "1"
# The rounding corpus.
serde_json = "1"

[lints]
workspace = true
