[package]
name = "spot-mail-intake"
description = "The incoming-mail engine (WP-PLT-11.T12): an account model, one poll step per mailbox with a durable UID cursor, deduplication by Message-ID, a sink port, auto-reply and loop protection, size and rate limits"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
# The `CursorStore` and `SeenStore` contract suites, for a durable store (`spot-mail-intake-pg`)
# to run against itself. Off by default: it is test support.
testing = []

[dependencies]
# `fetch_new_pinned`, `IncomingMessage`, `MailboxCursor`, `ImapConfig` and `Secret`.
spot-mail = { path = "../spot-mail" }
# Leases with fencing tokens: one node polls one account.
spot-coordinator = { path = "../spot-coordinator" }
# The guard that authorises the IMAP host and port, exactly as SMTP is authorised.
spot-egress = { path = "../spot-egress" }
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# Instants are arguments, never read here; `OffsetDateTime` is the type the crates around use.
time = { version = "0.3", features = ["serde"] }
# The Message-ID digest.
sha2 = "0.10"
# The keyed MAC of the own-mail marker (WP-PLT-11.T16); the version the workspace already uses.
hmac = "0.12"
tracing = "0.1"

[dev-dependencies]
spot-mail-intake = { path = ".", features = ["testing"] }
spot-core = { path = "../spot-core" }
serde_json = "1"
proptest = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }

[lints]
workspace = true
