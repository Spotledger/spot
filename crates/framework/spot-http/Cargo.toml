[package]
name = "spot-http"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
spot-core = { path = "../spot-core" }
# The request layer: one span, access log and cost scope per request (WP-PLT-15.T2).
spot-telemetry = { path = "../spot-telemetry" }
axum = { version = "0.8.9", features = ["http2"] }
http-body-util = "0.1"
hyper = { version = "1.11", default-features = false }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tokio = { version = "1.47", features = ["macros", "net", "rt", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
uuid = { version = "1.26", default-features = false, features = ["std", "v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
spot-storage-contract = { path = "../../../contracts/storage" }
rust_decimal = "1"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
base64 = "0.22"
sha2 = "0.10"

[features]
# The `IdempotencyStore` contract suite and its test doubles (`api::idempotency_contract`), for
# the dev-dependencies of a durable store. Never enabled by a product build.
testing = []

[dev-dependencies]
# The contract suite and the store doubles (`testing`) for the integration tests.
spot-http = { path = ".", features = ["testing"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util", "test-util"] }
jsonschema = { version = "0.58", default-features = false }
proptest = "1"
serde_norway = "0.9"
spot-app-api = { path = "../../../contracts/app-api" }
# A real transaction for the telemetry wiring test: the span comes from the PostgreSQL
# backend, and the scratch-database harness keeps it isolated.
spot-postgres = { path = "../../backends/spot-postgres", features = ["testing"] }
# A capture layer for the span-ancestry assertions.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true
