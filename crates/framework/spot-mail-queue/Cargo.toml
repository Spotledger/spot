[package]
name = "spot-mail-queue"
description = "The persistent outgoing mail queue on the job engine (WP-PLT-11.T3): enqueue-after-commit with an idempotency key, a send handler mapping transient and permanent mail errors to retry and fail, an egress check on every connection, a sent log that stops a crash from sending twice, and bounce records"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
spot-core = { path = "../spot-core" }
spot-jobs = { path = "../spot-jobs" }
spot-mail = { path = "../spot-mail" }
spot-egress = { path = "../spot-egress" }
spot-files = { path = "../spot-files" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
async-trait = "0.1"
tracing = "0.1"
# `io-util` reads attachment bodies; `macros` is for `tokio::join!` in the sent-log contract.
tokio = { version = "1", features = ["io-util", "macros"] }

[features]
# The `SentLog` contract suite, for another crate's store implementation to run against itself
# (`spot-metering` does the same with its store contract). Off by default: it is test support.
testing = []

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "rt-multi-thread", "test-util", "io-util"] }

[lints]
workspace = true
