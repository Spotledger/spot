[package]
name = "spot-mail"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls-tls",
  "pool",
] }
tokio = { version = "1.47", features = ["macros", "net", "io-util", "rt", "sync", "time"] }
uuid = { version = "1.26", default-features = false, features = ["std", "v7"] }
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }
# Ingestion (WP-PLT-11.T2): async-imap with the tokio runtime backend (the crate's default
# runtime is async-std, which this workspace does not run). mail-parser is the MIME parser for
# both directions; it is a production dependency from this task on.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
mail-parser = "0.11"
# IMAP TLS (WP-PLT-11.T2): STARTTLS and implicit TLS with our own trust store — the platform
# root certificates by default (as spot-postgres does), or the config's root_certificate_pem.
# rustls panics when two crypto providers are enabled and none is chosen, so `ring` is pinned
# explicitly.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util"] }
rcgen = "0.14"
# Tests must compare parsed attachment types against the builder the production path uses.
lettre = { version = "0.11", default-features = false, features = ["builder"] }
# The fake servers build their TLS acceptors with these; the same crates are production
# dependencies above for the IMAP client (integration tests cannot see crate dependencies).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }

[lints]
workspace = true