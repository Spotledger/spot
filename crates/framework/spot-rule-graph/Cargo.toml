[package]
name = "spot-rule-graph"
description = "Business rules as Datalog over the graph (WP-GRA-04.T1, ADR-50): a rule-text front end, compilation and validation against the effective metadata, a deterministic semi-naive evaluator with stratified negation and aggregates, and a content-hash-keyed registry that hot-swaps rule sets"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
# The `FactSource` adapter over the in-memory graph index (WP-GRA-02, WP-GRA-04).
graph-index = ["dep:spot-graph-index"]

[dependencies]
# Guard expressions in a rule body are the shared expression language, embedded, never duplicated.
spot-expr = { path = "../spot-expr" }
# Edge predicates are the graph model's edge types, by canonical name.
spot-graph-model = { path = "../spot-graph-model" }
# Predicates are validated against the effective metadata.
spot-meta = { path = "../spot-meta" }
# A rule set reloads on the metadata live-reload signal.
spot-meta-live = { path = "../spot-meta-live" }
# Record keys and typed values: the facts the evaluator reads and the rows it returns.
spot-storage-contract = { path = "../../../contracts/storage" }
# The wait-free pointer swap the registry's readers take.
arc-swap = "1"
# Exact decimals for `sum`/`min`/`max` (ADR-12: no floating point).
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
# SHA-256 content hashes, the key of hot reload.
sha2 = "0.10"
# Typed errors with stable `rule_graph.*` codes.
thiserror = "2"
# `graph-index`-gated: the hot-graph `FactSource` adapter.
spot-graph-index = { path = "../spot-graph-index", optional = true }

[dev-dependencies]
# The corpus and property tests build metadata and parse corpus TOML.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
proptest = "1"

[lints]
workspace = true
