[package]
name = "spot-rehearsal"
description = "The rehearsal engine (WP-MIG-06.T1, ADR-22): clone a site from a snapshot into a scratch database, compute the pre and post financial fingerprint (trial balance, stock balance, AR/AP ageing) over declared queries, run the invariant sets, decide the replay policy and classify every fingerprint difference as declared or unexplained"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# `SiteId`: which tenant a rehearsal belongs to (ADR-34).
spot-core = { path = "../spot-core" }
# The approved `ReleasePlan` and its typed `Change`s: what is rehearsed and what a difference is
# classified against.
spot-migration-plan = { path = "../spot-migration-plan" }
# The `SnapshotProvider` trait object a clone is taken and restored through; tests use a fake.
spot-snapshot = { path = "../../backends/spot-snapshot" }
# The online schema migration the clone is put through (`apply`), behind the `Applier` trait.
spot-pg-migrate = { path = "../../backends/spot-pg-migrate" }
# `PgBackend`/`PgConfig`: the concrete PostgreSQL applier connects to the scratch database.
spot-postgres = { path = "../../backends/spot-postgres" }
# The declared fingerprint queries run through the typed query IR (ADR-45); no hand-built SQL.
spot-storage-contract = { path = "../../../contracts/storage" }
# The fingerprint, the diff and the report derive serde for a JSON artefact.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 over the fingerprint's canonical form (its `digest`).
sha2 = "0.10"
# The approved plan's proof: `ApplyTicket`, obtainable only from `authorise_apply`.
spot-migration-approval = { path = "../spot-migration-approval" }
# A private current-thread runtime for the `Drop` fallback that drops the scratch database.
tokio = { version = "1", default-features = false, features = ["rt"] }
# Typed errors with stable `rehearsal.*` codes.
thiserror = "1"

[dev-dependencies]
# The in-memory backend the fingerprint engine is exercised against.
spot-storage-fake = { path = "../../backends/spot-storage-fake" }
# The L7 invariant sets the `InvariantSet` trait is proved against (WP-TST-07.T1).
spot-l7-invariants = { path = "../../../harness/rust/l7-invariants" }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
