# Conformance corpus for the UI effects protocol v1 (WP-UI-12.T1).
# Every case inherits [meta], [children] and [doc]; a case may override [case.meta], add
# [case.children.*] or add document members under [case.doc]. The `state` snapshot under
# [case.expect.state] is generated by the `regenerate_states` test.

[meta]
name = "order"
label = "Order"
fields = [
  { name = "qty", kind = "int" },
  { name = "rate", kind = "decimal", scale = 2, precision = 18 },
  { name = "amount", kind = "decimal", scale = 2, precision = 18 },
  { name = "title", kind = "text", max_chars = 20 },
  { name = "note", kind = "long_text" },
  { name = "active", kind = "bool" },
  { name = "due", kind = "date" },
  { name = "customer", kind = "link", doctype = "customer" },
  { name = "status", kind = "select", values = ["draft", "open", "closed"] },
  { name = "items", kind = "table", doctype = "item" },
]

[children.item]
name = "item"
fields = [
  { name = "qty", kind = "int" },
  { name = "unit_price", kind = "decimal", scale = 2, precision = 18 },
  { name = "line_total", kind = "decimal", scale = 2, precision = 18 },
  { name = "note", kind = "text", max_chars = 10 },
]

[doc]
qty = 2
rate = "10.00"
amount = "20.00"
title = "first"
note = "hello"
active = true
due = "2026-10-20"
customer = "01900000-0000-7000-8000-000000000001"
status = "draft"


[[case]]
id = "patch/diff"
description = "A returned patch changes the document and its diff is the scripts' diff."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "patch"
source = '''
export function on_change(doc, changed, ctx) {
  return { patch: { title: "patched", amount: "30.00" } };
}
'''

[case.expect]
effects = [
]

[case.expect.patch]
title = "patched"
amount = "30.00"


[case.expect.state.values]
active = true
amount = "30.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "patched"
[[case]]
id = "patch/merge-server-patch"
description = "The server patch is applied first; the scripts' diff overrides its members."
server_patch = { status = "open" }

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "patch"
source = '''
export function on_change(doc, changed, ctx) {
  return { patch: { title: "script title" } };
}
'''

[case.expect]
effects = [
]

[case.expect.patch]
title = "script title"


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "open"
title = "script title"
[[case]]
id = "patch/effects-see-patch"
description = "A later script sees an earlier script's patch."

[case.event]
kind = "save"

[[case.script]]
name = "first"
priority = 10
source = '''
export function on_save(doc, changed, ctx) {
  return { patch: { qty: 7 } };
}
'''

[[case.script]]
name = "second"
priority = 20
source = '''
export function on_save(doc, changed, ctx) {
  ctx.effects.setLabel("qty", String(doc.qty));
}
'''

[case.expect]
effects = [
  { kind = "set_label", path = "qty", label = "7" },
]

[case.expect.patch]
qty = 7


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 7
rate = "10.00"
status = "draft"
title = "first"

[case.expect.state.labels]
qty = "7"
[[case]]
id = "patch/server-patch-only"
description = "With no script patch the scripts' diff is empty and the server diff stands."
server_patch = { status = "open" }

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "none"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.focus("title");
}
'''

[case.expect]
effects = [
  { kind = "focus", path = "title" },
]


[case.expect.state]
focus = "title"

[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "open"
title = "first"
