# Conformance corpus for the UI effects protocol v1 (WP-UI-12.T1).
# Every case inherits [meta], [children] and [doc]; a case may override [case.meta], add
# [case.children.*] or add document members under [case.doc]. The `state` snapshot under
# [case.expect.state] is generated by the `regenerate_states` test.

[meta]
name = "order"
label = "Order"
fields = [
  { name = "qty", kind = "int" },
  { name = "rate", kind = "decimal", scale = 2, precision = 18 },
  { name = "amount", kind = "decimal", scale = 2, precision = 18 },
  { name = "title", kind = "text", max_chars = 20 },
  { name = "note", kind = "long_text" },
  { name = "active", kind = "bool" },
  { name = "due", kind = "date" },
  { name = "customer", kind = "link", doctype = "customer" },
  { name = "status", kind = "select", values = ["draft", "open", "closed"] },
  { name = "items", kind = "table", doctype = "item" },
]

[children.item]
name = "item"
fields = [
  { name = "qty", kind = "int" },
  { name = "unit_price", kind = "decimal", scale = 2, precision = 18 },
  { name = "line_total", kind = "decimal", scale = 2, precision = 18 },
  { name = "note", kind = "text", max_chars = 10 },
]

[doc]
qty = 2
rate = "10.00"
amount = "20.00"
title = "first"
note = "hello"
active = true
due = "2026-10-20"
customer = "01900000-0000-7000-8000-000000000001"
status = "draft"


[[case]]
id = "set_value/int"
description = "A change to qty derives a new amount and calls setValue with an integer."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "qty_changed"
source = '''
export function on_change(doc, changed, ctx) {
  if (changed === "qty") {
    ctx.effects.setValue("qty", 5);
  }
}
'''

[case.expect]
effects = [
  { kind = "set_value", path = "qty", value = 5 },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 5
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "set_value/decimal-exact"
description = "A decimal travels as its exact string, scale included."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "amount"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setValue("amount", "12.50");
}
'''

[case.expect]
effects = [
  { kind = "set_value", path = "amount", value = "12.50" },
]


[case.expect.state.values]
active = true
amount = "12.50"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "set_value/text"
