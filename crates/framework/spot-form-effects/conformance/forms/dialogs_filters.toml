# Conformance corpus for the UI effects protocol v1 (WP-UI-12.T1).
# Every case inherits [meta], [children] and [doc]; a case may override [case.meta], add
# [case.children.*] or add document members under [case.doc]. The `state` snapshot under
# [case.expect.state] is generated by the `regenerate_states` test.

[meta]
name = "order"
label = "Order"
fields = [
  { name = "qty", kind = "int" },
  { name = "rate", kind = "decimal", scale = 2, precision = 18 },
  { name = "amount", kind = "decimal", scale = 2, precision = 18 },
  { name = "title", kind = "text", max_chars = 20 },
  { name = "note", kind = "long_text" },
  { name = "active", kind = "bool" },
  { name = "due", kind = "date" },
  { name = "customer", kind = "link", doctype = "customer" },
  { name = "status", kind = "select", values = ["draft", "open", "closed"] },
  { name = "items", kind = "table", doctype = "item" },
]

[children.item]
name = "item"
fields = [
  { name = "qty", kind = "int" },
  { name = "unit_price", kind = "decimal", scale = 2, precision = 18 },
  { name = "line_total", kind = "decimal", scale = 2, precision = 18 },
  { name = "note", kind = "text", max_chars = 10 },
]

[doc]
qty = 2
rate = "10.00"
amount = "20.00"
title = "first"
note = "hello"
active = true
due = "2026-10-20"
customer = "01900000-0000-7000-8000-000000000001"
status = "draft"


[[case]]
id = "open_dialog/registered"
description = "A script opens a registered dialog with parameters."
dialogs = ["pick_customer"]

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "dialog"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.openDialog("pick_customer", { search: "acme" });
}
'''

[case.expect]
effects = [
  { kind = "open_dialog", dialog_id = "pick_customer", params = { search = "acme" } },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[[case.expect.state.dialogs]]
dialog_id = "pick_customer"

[case.expect.state.dialogs.params]
search = "acme"
[[case]]
id = "open_dialog/unregistered"
description = "A dialog the form does not register is dropped."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "dialog"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.openDialog("make_coffee", {});
}
'''

[case.expect]
effects = [
]

[[case.expect.problem]]
code = "form_effects.dialog_unknown"


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "focus"
description = "A script moves the keyboard focus."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "focus"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.focus("amount");
}
'''

[case.expect]
effects = [
  { kind = "focus", path = "amount" },
]


[case.expect.state]
focus = "amount"

[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "set_filter/link"
description = "A link field's filter is a shared-expression-language expression."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "filter"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setFilter("customer", "doc.status == 'open'");
}
'''

[case.expect]
effects = [
  { kind = "set_filter", link_path = "customer", filter = "doc.status == 'open'" },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[case.expect.state.filters]
customer = "doc.status == 'open'"
[[case]]
id = "set_filter/bad-expression"
description = "A filter that does not parse is dropped."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "filter"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setFilter("customer", "doc.==");
}
'''

[case.expect]
effects = [
]

[[case.expect.problem]]
code = "form_effects.filter_invalid"
path = "customer"


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "set_filter/not-link"
description = "A filter on a field that is not a link is dropped."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "filter"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setFilter("qty", "doc.qty > 1");
}
'''

[case.expect]
effects = [
]

[[case.expect.problem]]
code = "form_effects.filter_invalid"
path = "qty"


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "batch/nested"
description = "A nested batch is flattened in application order."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "batch"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.batch([
    { kind: "focus", path: "title" },
    { kind: "set_label", path: "qty", label: "Q" },
  ]);
}
'''

[case.expect]
effects = [
  { kind = "focus", path = "title" },
  { kind = "set_label", path = "qty", label = "Q" },
]


[case.expect.state]
focus = "title"

[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[case.expect.state.labels]
qty = "Q"
