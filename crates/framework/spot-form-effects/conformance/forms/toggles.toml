[[case]]
id = "set_read_only/unknown-path"
description = "A toggle on an unknown field is dropped with a problem."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "lock"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setReadOnly("nope", true);
}
'''

[case.expect]
effects = [
]

[[case.expect.problem]]
code = "form_effects.path_unavailable"


[case.expect.state.values]
active = true
