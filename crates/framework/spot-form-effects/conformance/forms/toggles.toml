# Conformance corpus for the UI effects protocol v1 (WP-UI-12.T1).
# Every case inherits [meta], [children] and [doc]; a case may override [case.meta], add
# [case.children.*] or add document members under [case.doc]. The `state` snapshot under
# [case.expect.state] is generated by the `regenerate_states` test.

[meta]
name = "order"
label = "Order"
fields = [
  { name = "qty", kind = "int" },
  { name = "rate", kind = "decimal", scale = 2, precision = 18 },
  { name = "amount", kind = "decimal", scale = 2, precision = 18 },
  { name = "title", kind = "text", max_chars = 20 },
  { name = "note", kind = "long_text" },
  { name = "active", kind = "bool" },
  { name = "due", kind = "date" },
  { name = "customer", kind = "link", doctype = "customer" },
  { name = "status", kind = "select", values = ["draft", "open", "closed"] },
  { name = "items", kind = "table", doctype = "item" },
]

[children.item]
name = "item"
fields = [
  { name = "qty", kind = "int" },
  { name = "unit_price", kind = "decimal", scale = 2, precision = 18 },
  { name = "line_total", kind = "decimal", scale = 2, precision = 18 },
  { name = "note", kind = "text", max_chars = 10 },
]

[doc]
qty = 2
rate = "10.00"
amount = "20.00"
title = "first"
note = "hello"
active = true
due = "2026-10-20"
customer = "01900000-0000-7000-8000-000000000001"
status = "draft"


[[case]]
id = "set_read_only/true"
description = "A script makes a field read-only."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "lock"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setReadOnly("note", true);
}
'''

[case.expect]
effects = [
  { kind = "set_read_only", path = "note", read_only = true },
]


[case.expect.state]
read_only = ["note"]

[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "set_read_only/false"
description = "A later toggle wins: lock then unlock leaves the field editable."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "lock"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setReadOnly("note", true);
  ctx.effects.setReadOnly("note", false);
}
'''

[case.expect]
effects = [
  { kind = "set_read_only", path = "note", read_only = false },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "set_hidden/true"
description = "A script hides a field."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "hide"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setHidden("note", true);
}
'''

[case.expect]
effects = [
  { kind = "set_hidden", path = "note", hidden = true },
]


[case.expect.state]
hidden = ["note"]

[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "set_hidden/false"
description = "A later toggle wins: hide then show leaves the field visible."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "hide"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setHidden("note", true);
  ctx.effects.setHidden("note", false);
}
'''

[case.expect]
effects = [
  { kind = "set_hidden", path = "note", hidden = false },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
