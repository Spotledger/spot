# Conformance corpus for the UI effects protocol v1 (WP-UI-12.T1).
# Every case inherits [meta], [children] and [doc]; a case may override [case.meta], add
# [case.children.*] or add document members under [case.doc]. The `state` snapshot under
# [case.expect.state] is generated by the `regenerate_states` test.

[meta]
name = "order"
label = "Order"
fields = [
  { name = "qty", kind = "int" },
  { name = "rate", kind = "decimal", scale = 2, precision = 18 },
  { name = "amount", kind = "decimal", scale = 2, precision = 18 },
  { name = "title", kind = "text", max_chars = 20 },
  { name = "note", kind = "long_text" },
  { name = "active", kind = "bool" },
  { name = "due", kind = "date" },
  { name = "customer", kind = "link", doctype = "customer" },
  { name = "status", kind = "select", values = ["draft", "open", "closed"] },
  { name = "items", kind = "table", doctype = "item" },
]

[children.item]
name = "item"
fields = [
  { name = "qty", kind = "int" },
  { name = "unit_price", kind = "decimal", scale = 2, precision = 18 },
  { name = "line_total", kind = "decimal", scale = 2, precision = 18 },
  { name = "note", kind = "text", max_chars = 10 },
]

[doc]
qty = 2
rate = "10.00"
amount = "20.00"
title = "first"
note = "hello"
active = true
due = "2026-10-20"
customer = "01900000-0000-7000-8000-000000000001"
status = "draft"


[[case]]
id = "ordering/emitted-then-returned"
description = "Effects emitted through the builder come before the ones the handler returns."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "order"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.focus("qty");
  return { effects: [{ kind: "set_label", path: "title", label: "Title" }] };
}
'''

[case.expect]
effects = [
  { kind = "focus", path = "qty" },
  { kind = "set_label", path = "title", label = "Title" },
]


[case.expect.state]
focus = "qty"

[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[case.expect.state.labels]
title = "Title"
[[case]]
id = "ordering/two-scripts-priority"
description = "Scripts run by priority and their effects keep that order."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "second"
priority = 20
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setLabel("qty", "Second");
}
'''

[[case.script]]
name = "first"
priority = 10
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setLabel("title", "First");
}
'''

[case.expect]
effects = [
  { kind = "set_label", path = "title", label = "First" },
  { kind = "set_label", path = "qty", label = "Second" },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[case.expect.state.labels]
qty = "Second"
title = "First"
[[case]]
id = "dedupe/set-value-last-wins"
description = "Two setValue effects for one path collapse to the last."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "value"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setValue("qty", 1);
  ctx.effects.setValue("qty", 2);
}
'''

[case.expect]
effects = [
  { kind = "set_value", path = "qty", value = 2 },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "dedupe/identical-messages"
description = "The same message twice is shown once."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "message"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.showMessage("info", "Same.");
  ctx.effects.showMessage("info", "Same.");
}
'''

[case.expect]
effects = [
  { kind = "show_message", level = "info", text = "Same." },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[[case.expect.state.messages]]
level = "info"
text = "Same."
[[case]]
id = "dedupe/focus-last"
description = "Two focuses collapse to the last target."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "focus"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.focus("qty");
  ctx.effects.focus("title");
}
'''

[case.expect]
effects = [
  { kind = "focus", path = "title" },
]


[case.expect.state]
focus = "title"

[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
