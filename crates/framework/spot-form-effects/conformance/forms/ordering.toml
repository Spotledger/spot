[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "qty"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.focus("qty");
}
'''

[[case.script]]
name = "title"
event = { kind = "change", field = "title" }
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.focus("title");
}
'''

[case.expect]
effects = [
  { kind = "focus", path = "qty" },
]


[case.expect.state]
focus = "qty"

[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "event/change-table"
description = "A script registered for a table runs for a change to one of its rows."

[[case.doc.items]]
qty = 1
unit_price = "10.00"
line_total = "10.00"
note = "row one"

[case.event]
kind = "change"
field = "items[1].qty"

[[case.script]]
name = "items"
event = { kind = "change", field = "items" }
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.focus("items[1].qty");
}
'''

[case.expect]
effects = [
  { kind = "focus", path = "items[1].qty" },
]


[case.expect.state]
focus = "items[1].qty"

[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
