# Conformance corpus for the UI effects protocol v1 (WP-UI-12.T1).
# Every case inherits [meta], [children] and [doc]; a case may override [case.meta], add
# [case.children.*] or add document members under [case.doc]. The `state` snapshot under
# [case.expect.state] is generated by the `regenerate_states` test.

[meta]
name = "order"
label = "Order"
fields = [
  { name = "qty", kind = "int" },
  { name = "rate", kind = "decimal", scale = 2, precision = 18 },
  { name = "amount", kind = "decimal", scale = 2, precision = 18 },
  { name = "title", kind = "text", max_chars = 20 },
  { name = "note", kind = "long_text" },
  { name = "active", kind = "bool" },
  { name = "due", kind = "date" },
  { name = "customer", kind = "link", doctype = "customer" },
  { name = "status", kind = "select", values = ["draft", "open", "closed"] },
  { name = "items", kind = "table", doctype = "item" },
]

[children.item]
name = "item"
fields = [
  { name = "qty", kind = "int" },
  { name = "unit_price", kind = "decimal", scale = 2, precision = 18 },
  { name = "line_total", kind = "decimal", scale = 2, precision = 18 },
  { name = "note", kind = "text", max_chars = 10 },
]

[doc]
qty = 2
rate = "10.00"
amount = "20.00"
title = "first"
note = "hello"
active = true
due = "2026-10-20"
customer = "01900000-0000-7000-8000-000000000001"
status = "draft"


[[case]]
id = "set_options/select"
description = "A select's candidates are replaced, labels included."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "options"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setOptions("status", [
    { value: "draft" },
    { value: "open", label: "Open for work" },
  ]);
}
'''

[case.expect]
effects = [
  { kind = "set_options", path = "status", options = [{ value = "draft" }, { value = "open", label = "Open for work" }] },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[[case.expect.state.options.status]]
value = "draft"

[[case.expect.state.options.status]]
value = "open"
label = "Open for work"
[[case]]
id = "set_options/link"
description = "A link's candidates are replaced with record ids and labels."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "options"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setOptions("customer", [
    { value: "01900000-0000-7000-8000-000000000002", label: "Customer two" },
  ]);
}
'''

[case.expect]
effects = [
  { kind = "set_options", path = "customer", options = [{ value = "01900000-0000-7000-8000-000000000002", label = "Customer two" }] },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[[case.expect.state.options.customer]]
value = "01900000-0000-7000-8000-000000000002"
label = "Customer two"
[[case]]
id = "set_options/not-listed"
description = "A select candidate that is not one of the field's values is refused."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "options"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setOptions("status", [{ value: "archived" }]);
}
'''

[case.expect]
effects = [
]

[[case.expect.problem]]
code = "form_effects.option_invalid"
path = "status"


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "set_options/duplicate"
description = "A candidate list with the same value twice is refused."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "options"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setOptions("status", [{ value: "open" }, { value: "open" }]);
}
'''

[case.expect]
effects = [
]

[[case.expect.problem]]
