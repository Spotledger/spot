# Conformance corpus for the UI effects protocol v1 (WP-UI-12.T1).
# Every case inherits [meta], [children] and [doc]; a case may override [case.meta], add
# [case.children.*] or add document members under [case.doc]. The `state` snapshot under
# [case.expect.state] is generated by the `regenerate_states` test.

[meta]
name = "order"
label = "Order"
fields = [
  { name = "qty", kind = "int" },
  { name = "rate", kind = "decimal", scale = 2, precision = 18 },
  { name = "amount", kind = "decimal", scale = 2, precision = 18 },
  { name = "title", kind = "text", max_chars = 20 },
  { name = "note", kind = "long_text" },
  { name = "active", kind = "bool" },
  { name = "due", kind = "date" },
  { name = "customer", kind = "link", doctype = "customer" },
  { name = "status", kind = "select", values = ["draft", "open", "closed"] },
  { name = "items", kind = "table", doctype = "item" },
]

[children.item]
name = "item"
fields = [
  { name = "qty", kind = "int" },
  { name = "unit_price", kind = "decimal", scale = 2, precision = 18 },
  { name = "line_total", kind = "decimal", scale = 2, precision = 18 },
  { name = "note", kind = "text", max_chars = 10 },
]

[doc]
qty = 2
rate = "10.00"
amount = "20.00"
title = "first"
note = "hello"
active = true
due = "2026-10-20"
customer = "01900000-0000-7000-8000-000000000001"
status = "draft"


[[case]]
id = "event/load"
description = "on_load runs when the form opens."

[case.event]
kind = "load"

[[case.script]]
name = "load"
source = '''
export function on_load(doc, changed, ctx) {
  ctx.effects.setLabel("qty", "Quantity");
}
'''

[case.expect]
effects = [
  { kind = "set_label", path = "qty", label = "Quantity" },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[case.expect.state.labels]
qty = "Quantity"
[[case]]
id = "event/save"
description = "on_save runs before the save and may mark fields required."

[case.event]
kind = "save"

[[case.script]]
name = "save"
source = '''
export function on_save(doc, changed, ctx) {
  ctx.effects.setRequired("note", true);
}
'''

[case.expect]
effects = [
  { kind = "set_required", path = "note", required = true },
]


[case.expect.state]
required = ["note"]

[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "event/action"
description = "on_action runs for the action the user chose."

[case.event]
kind = "action"
action = "approve"

[[case.script]]
name = "action"
source = '''
export function on_action(doc, changed, ctx) {
  ctx.effects.setValue("status", "open");
  ctx.effects.showMessage("info", "Approved.");
}
'''

[case.expect]
effects = [
  { kind = "set_value", path = "status", value = "open" },
  { kind = "show_message", level = "info", text = "Approved." },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "open"
title = "first"

[[case.expect.state.messages]]
level = "info"
text = "Approved."
[[case]]
id = "event/action-other"
description = "A script registered for another action does not run."

[case.event]
kind = "action"
action = "reject"

[[case.script]]
name = "action"
event = { kind = "action", action = "approve" }
source = '''
export function on_action(doc, changed, ctx) {
  ctx.effects.setValue("status", "closed");
}
'''

[case.expect]
effects = [
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "event/load-does-not-run-on-change"
description = "An on_load script does not run for a change."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "load"
event = { kind = "load" }
source = '''
export function on_load(doc, changed, ctx) {
  ctx.effects.focus("title");
}
'''

[case.expect]
effects = [
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
