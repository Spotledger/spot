[[case]]
id = "patch/read-only-key-rejects-the-whole-patch"
description = "A patch naming a field the user cannot write is rejected whole: nothing of it applies and the problem names no field."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "s"
source = '''
export function on_change(doc, changed, ctx) {
  return { patch: { title: "ok", amount: "1.00" } };
}
'''

[case.security]
read_only = ["amount"]

[case.expect]
effects = [
  { kind = "show_message", level = "error", text_key = "error.form_effects.script_failed" },
]
errors = ["form_effects.field_unavailable"]

[[case.expect.problem]]
code = "form_effects.field_unavailable"


[case.expect.state.values]
active = true
