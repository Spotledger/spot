# Conformance corpus for the UI effects protocol v1 (WP-UI-12.T1).
# Every case inherits [meta], [children] and [doc]; a case may override [case.meta], add
# [case.children.*] or add document members under [case.doc]. The `state` snapshot under
# [case.expect.state] is generated by the `regenerate_states` test.

[meta]
name = "order"
label = "Order"
fields = [
  { name = "qty", kind = "int" },
  { name = "rate", kind = "decimal", scale = 2, precision = 18 },
  { name = "amount", kind = "decimal", scale = 2, precision = 18 },
  { name = "title", kind = "text", max_chars = 20 },
  { name = "note", kind = "long_text" },
  { name = "active", kind = "bool" },
  { name = "due", kind = "date" },
  { name = "customer", kind = "link", doctype = "customer" },
  { name = "status", kind = "select", values = ["draft", "open", "closed"] },
  { name = "items", kind = "table", doctype = "item" },
]

[children.item]
name = "item"
fields = [
  { name = "qty", kind = "int" },
  { name = "unit_price", kind = "decimal", scale = 2, precision = 18 },
  { name = "line_total", kind = "decimal", scale = 2, precision = 18 },
  { name = "note", kind = "text", max_chars = 10 },
]

[doc]
qty = 2
rate = "10.00"
amount = "20.00"
title = "first"
note = "hello"
active = true
due = "2026-10-20"
customer = "01900000-0000-7000-8000-000000000001"
status = "draft"


[[case]]
id = "permission/write-denied"
description = "An effect may not write a field the user cannot write."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "denied"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setValue("amount", "1.00");
}
'''

[case.security]
read_only = ["amount"]

[case.expect]
effects = [
]

[[case.expect.problem]]
code = "form_effects.field_not_writable"
path = "amount"


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "permission/hidden-target"
description = "An effect may not even name a field the user cannot see; the problem names no path."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "hidden"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setValue("amount", "1.00");
}
'''

[case.security]
hidden = ["amount"]

[case.expect]
effects = [
]

[[case.expect.problem]]
code = "form_effects.path_unavailable"


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "permission/hidden-row-column"
description = "A hidden child column is unavailable, judged against the child DocType."

[[case.doc.items]]
qty = 1
unit_price = "10.00"
line_total = "10.00"
note = "row one"

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "hidden"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.setValue("items[1].note", "changed");
}
'''

[case.security]
hidden = ["item.note"]

[case.expect]
effects = [
]

[[case.expect.problem]]
code = "form_effects.path_unavailable"


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[[case.expect.state.values.items]]
id = "00a72179-78be-7da8-ab84-760837829702"
line_total = "10.00"
note = "row one"
qty = 1
unit_price = "10.00"
