# Conformance corpus for the UI effects protocol v1 (WP-UI-12.T1).
# Every case inherits [meta], [children] and [doc]; a case may override [case.meta], add
# [case.children.*] or add document members under [case.doc]. The `state` snapshot under
# [case.expect.state] is generated by the `regenerate_states` test.

[meta]
name = "order"
label = "Order"
fields = [
  { name = "qty", kind = "int" },
  { name = "rate", kind = "decimal", scale = 2, precision = 18 },
  { name = "amount", kind = "decimal", scale = 2, precision = 18 },
  { name = "title", kind = "text", max_chars = 20 },
  { name = "note", kind = "long_text" },
  { name = "active", kind = "bool" },
  { name = "due", kind = "date" },
  { name = "customer", kind = "link", doctype = "customer" },
  { name = "status", kind = "select", values = ["draft", "open", "closed"] },
  { name = "items", kind = "table", doctype = "item" },
]

[children.item]
name = "item"
fields = [
  { name = "qty", kind = "int" },
  { name = "unit_price", kind = "decimal", scale = 2, precision = 18 },
  { name = "line_total", kind = "decimal", scale = 2, precision = 18 },
  { name = "note", kind = "text", max_chars = 10 },
]

[doc]
qty = 2
rate = "10.00"
amount = "20.00"
title = "first"
note = "hello"
active = true
due = "2026-10-20"
customer = "01900000-0000-7000-8000-000000000001"
status = "draft"


[[case]]
id = "add_action"
description = "A script adds an action whose effect is applied when it is chosen."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "action"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.addAction("pick_customer", "Pick customer", {
    kind: "focus",
    path: "customer",
  });
}
'''

[case.expect]
effects = [
  { kind = "add_action", id = "pick_customer", label = "Pick customer", effect = { kind = "focus", path = "customer" } },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[[case.expect.state.actions]]
id = "pick_customer"
label = "Pick customer"
[[case]]
id = "add_action/replace"
description = "Re-adding an action id replaces its label: only the last definition survives."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "action"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.addAction("pick", "First", { kind: "focus", path: "qty" });
  ctx.effects.addAction("pick", "Second", { kind: "focus", path: "qty" });
}
'''

[case.expect]
effects = [
  { kind = "add_action", id = "pick", label = "Second", effect = { kind = "focus", path = "qty" } },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[[case.expect.state.actions]]
id = "pick"
label = "Second"
[[case]]
id = "add_action/invalid-id"
description = "An action id that is not lowercase-and-safe is refused."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "action"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.addAction("Pick", "Pick", { kind: "focus", path: "qty" });
}
'''

[case.expect]
effects = [
]

[[case.expect.problem]]
code = "form_effects.action_invalid"


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "remove_action"
description = "A script removes an action by id."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "action"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.removeAction("pick_customer");
}
'''

[case.expect]
effects = [
  { kind = "remove_action", id = "pick_customer" },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"
[[case]]
id = "add_action/nested-invalid"
description = "An action whose effect is not applicable is dropped, with the nested problem."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "action"
source = '''
export function on_change(doc, changed, ctx) {
  ctx.effects.addAction("pick", "Pick", { kind: "set_value", path: "missing", value: 1 });
}
'''

[case.expect]
effects = [
]

[[case.expect.problem]]
code = "form_effects.path_unavailable"


[case.expect.state.values]
active = true
