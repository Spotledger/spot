# Conformance corpus for the UI effects protocol v1 (WP-UI-12.T1).
# Every case inherits [meta], [children] and [doc]; a case may override [case.meta], add
# [case.children.*] or add document members under [case.doc]. The `state` snapshot under
# [case.expect.state] is generated by the `regenerate_states` test.

[meta]
name = "order"
label = "Order"
fields = [
  { name = "qty", kind = "int" },
  { name = "rate", kind = "decimal", scale = 2, precision = 18 },
  { name = "amount", kind = "decimal", scale = 2, precision = 18 },
  { name = "title", kind = "text", max_chars = 20 },
  { name = "note", kind = "long_text" },
  { name = "active", kind = "bool" },
  { name = "due", kind = "date" },
  { name = "customer", kind = "link", doctype = "customer" },
  { name = "status", kind = "select", values = ["draft", "open", "closed"] },
  { name = "items", kind = "table", doctype = "item" },
]

[children.item]
name = "item"
fields = [
  { name = "qty", kind = "int" },
  { name = "unit_price", kind = "decimal", scale = 2, precision = 18 },
  { name = "line_total", kind = "decimal", scale = 2, precision = 18 },
  { name = "note", kind = "text", max_chars = 10 },
]

[doc]
qty = 2
rate = "10.00"
amount = "20.00"
title = "first"
note = "hello"
active = true
due = "2026-10-20"
customer = "01900000-0000-7000-8000-000000000001"
status = "draft"


[[case]]
id = "error/uncaught"
description = "An uncaught script error becomes one safe message; the detail stays on the server."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "boom"
source = '''
export function on_change(doc, changed, ctx) {
  throw new Error("internal detail that must not leak");
}
'''

[case.expect]
effects = [
  { kind = "show_message", level = "error", text_key = "error.form_effects.script_failed" },
]
errors = ["form_effects.script_failed"]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[[case.expect.state.messages]]
level = "error"
text_key = "error.form_effects.script_failed"
[[case]]
id = "error/typed-validation"
description = "A typed validation throw becomes the field message the script wrote."

[case.event]
kind = "save"

[[case.script]]
name = "check"
source = '''
export function on_save(doc, changed, ctx) {
  throw {
    code: "order.qty_odd",
    message: "Qty must be even.",
    fields: [{ field: "qty", code: "order.qty_odd", message: "Qty must be even." }],
  };
}
'''

[case.expect]
effects = [
  { kind = "show_message", level = "error", text = "Qty must be even.", field = "qty" },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[[case.expect.state.messages]]
level = "error"
text = "Qty must be even."
field = "qty"
[[case]]
id = "error/typed-global"
description = "A typed throw without fields is one message for the form."

[case.event]
kind = "save"

[[case.script]]
name = "check"
source = '''
export function on_save(doc, changed, ctx) {
  throw { code: "order.blocked", message: "This order is blocked." };
}
'''

[case.expect]
effects = [
  { kind = "show_message", level = "error", text = "This order is blocked." },
]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[[case.expect.state.messages]]
level = "error"
text = "This order is blocked."
[[case]]
id = "error/missing-handler"
description = "A script that does not export the event's handler is a safe failure."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "wrong_entry"
source = '''
export function on_load(doc, changed, ctx) {
  ctx.effects.focus("qty");
}
'''

[case.expect]
effects = [
  { kind = "show_message", level = "error", text_key = "error.form_effects.script_failed" },
]
errors = ["form_effects.missing_handler"]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[[case.expect.state.messages]]
level = "error"
text_key = "error.form_effects.script_failed"
[[case]]
id = "error/compile-failed"
description = "TypeScript that does not compile is a safe failure."

[case.event]
kind = "change"
field = "qty"

[[case.script]]
name = "broken"
source = '''
export function on_change(doc, changed, ctx) {
  this is not typescript
}
'''

[case.expect]
effects = [
  { kind = "show_message", level = "error", text_key = "error.form_effects.script_failed" },
]
errors = ["form_effects.compile_failed"]


[case.expect.state.values]
active = true
amount = "20.00"
customer = "01900000-0000-7000-8000-000000000001"
due = "2026-10-20"
note = "hello"
qty = 2
rate = "10.00"
status = "draft"
title = "first"

[[case.expect.state.messages]]
level = "error"
text_key = "error.form_effects.script_failed"
