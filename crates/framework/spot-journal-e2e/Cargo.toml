[package]
name = "spot-journal-e2e"
description = "End-to-end journal tests (WP-JRN-07.T4): the real journal crates wired over the in-memory store (commit, group-commit relay, durability ack, snapshot, verify, fork, rebuild, personal-data erasure, scheduled audit), so a change in one crate that breaks the seam to the next fails here"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The chain under test, by path.
spot-journal-commit = { path = "../spot-journal-commit" }
spot-journal-durability = { path = "../spot-journal-durability" }
spot-journal-relay = { path = "../spot-journal-relay" }
# The tenant journal key the relay seals its remote-sync tail chunks with.
spot-secrets = { path = "../spot-secrets" }
spot-journal-store = { path = "../spot-journal-store" }
spot-journal-manifest = { path = "../spot-journal-manifest" }
spot-journal-segment = { path = "../spot-journal-segment" }
spot-journal-snapshot = { path = "../spot-journal-snapshot" }
spot-journal-sign = { path = "../spot-journal-sign" }
spot-journal-verify = { path = "../spot-journal-verify" }
spot-journal-rebuild-plan = { path = "../spot-journal-rebuild-plan" }
spot-journal-rebuild = { path = "../spot-journal-rebuild" }
spot-journal-audit = { path = "../spot-journal-audit" }
spot-journal-audit-run = { path = "../spot-journal-audit-run" }
spot-journal-pii = { path = "../spot-journal-pii" }
spot-journal-protect = { path = "../spot-journal-protect" }
spot-image-upcast = { path = "../spot-image-upcast" }
spot-events-contract = { path = "../../../contracts/events" }
# Fixed-key signing (same version as the neighbours).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
serde_json = "1"
# The shared relay handle is behind an async mutex.
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "rt", "macros"] }

[lints]
workspace = true
