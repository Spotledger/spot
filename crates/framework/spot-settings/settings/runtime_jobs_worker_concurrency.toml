scopes = [
    "fleet",
    "group",
    "server",
]
risk = "medium"
secret = false
read_only = false
since = "0.1.0"
tags = [
    "jobs",
    "performance",
]
help_url = "https://docs.example.com/settings/runtime.jobs.worker_concurrency"

[value.Int]
min = 1
max = 256

[default]
Int = 4

[restart]
type = "service"
name = "job-runner"
