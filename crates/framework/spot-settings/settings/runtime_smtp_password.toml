# Seed setting for runtime.smtp.password. This is an example owned by the platform; the
# platform tasks will manage these settings. A secret carries no default.
key = "runtime.smtp.password"
title = "SMTP Password"
summary = "Password for SMTP authentication (secret)."
description = "The password used for SMTP authentication. This value is never shown, logged, or included in hashes."
scopes = [
    "fleet",
    "group",
    "server",
    "tenant",
]
restart = { type = "service", name = "email" }
risk = "high"
secret = true
read_only = false
since = "0.1.0"
tags = [
    "email",
    "smtp",
    "secret",
]
help_url = "https://docs.example.com/settings/runtime.smtp.password"
group = "Email"
order = 2

[value.Text]
max_len = 256
