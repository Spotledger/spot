[package]
name = "spot-jobs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
spot-core = { path = "../spot-core" }
spot-app-api = { path = "../../../contracts/app-api" }
spot-storage-contract = { path = "../../../contracts/storage" }
spot-events-contract = { path = "../../../contracts/events" }
spot-scheduler = { path = "../spot-scheduler" }
# One `job.run` span and its cost per attempt (WP-PLT-15.T2).
spot-telemetry = { path = "../spot-telemetry" }
tracing = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }
time = { version = "0.3", features = ["serde"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "rt-multi-thread", "test-util"] }
spot-storage-fake = { path = "../../backends/spot-storage-fake" }
jiff = { version = "0.2", features = ["serde"] }

[features]
testing = []

[lints]
workspace = true
