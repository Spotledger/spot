# webhook_secret codes: the write-only signing secret of a webhook (WP-INT-01.T5). One [[entry]] per code; see crates/framework/spot-errors/README.md.
# None of these rides an AppError: the routes answer with a registry code (named in each summary) and carry the code below in details.reason.

[[entry]]
code = "webhook_secret.refused"
class = "none"
summary = "The caller may not set or read this webhook's signing secret (HTTP 403 permission.denied); the answer is the same whether or not the webhook exists."
explanation_key = "error.webhook_secret.refused"
params = []
remedy = "Ask a Tenant Administrator, or a role granted update on the webhook's secret protection group."
since = "0.1.0"

[[entry]]
code = "webhook_secret.not_configured"
class = "none"
summary = "The site has no secrets vault, so a webhook signing secret cannot be set or read and the webhook cannot be signed (HTTP 501 service.not_configured)."
explanation_key = "error.webhook_secret.not_configured"
params = []
remedy = "Configure [services.secrets] with a key file and restart the host; there is no plaintext fallback."
since = "0.1.0"

[[entry]]
code = "webhook_secret.not_found"
class = "none"
summary = "The webhook does not exist (HTTP 404 document.not_found), answered only to a caller who may write signing secrets."
explanation_key = "error.webhook_secret.not_found"
params = []
remedy = "Check the webhook name and try again."
since = "0.1.0"

[[entry]]
code = "webhook_secret.too_short"
class = "none"
summary = "A supplied signing secret is shorter than 16 bytes (HTTP 400 api.invalid_request)."
explanation_key = "error.webhook_secret.too_short"
params = []
remedy = "Supply a secret of 16 to 256 bytes, or ask the server to generate one."
since = "0.1.0"

[[entry]]
code = "webhook_secret.too_long"
class = "none"
summary = "A supplied signing secret is longer than 256 bytes (HTTP 400 api.invalid_request)."
explanation_key = "error.webhook_secret.too_long"
params = []
remedy = "Supply a secret of 16 to 256 bytes, or ask the server to generate one."
since = "0.1.0"

[[entry]]
code = "webhook_secret.bad_request"
class = "none"
summary = "The request body is not exactly one of a secret and a generate flag, or the webhook name in the path is not a valid name (HTTP 400 api.invalid_request)."
explanation_key = "error.webhook_secret.bad_request"
params = []
remedy = "Send {\"secret\": \"...\"} or {\"generate\": true}, and a webhook name of at most 200 characters."
since = "0.1.0"

[[entry]]
code = "webhook_secret.unavailable"
class = "none"
summary = "Storage could not be reached, so nothing was written (HTTP 503 server.unavailable)."
explanation_key = "error.webhook_secret.unavailable"
params = []
remedy = "Retry the request; no secret was changed."
since = "0.1.0"
