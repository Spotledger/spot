# secret webhook signing-key codes. One [[entry]] per code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "secret.not_configured"
class = "none"
summary = "No signing key is configured for the webhook."
explanation_key = "error.secret.not_configured"
params = []
remedy = "Configure the signing key."
since = "0.1.0"

[[entry]]
code = "secret.not_set"
class = "none"
summary = "The signing key has no value."
explanation_key = "error.secret.not_set"
params = []
remedy = "Set the key's value."
since = "0.1.0"

[[entry]]
code = "secret.open_failed"
class = "none"
summary = "The signing key could not be opened."
explanation_key = "error.secret.open_failed"
params = []
remedy = "Check the key store and retry."
since = "0.1.0"

[[entry]]
code = "secret.unavailable"
class = "none"
summary = "The key store is not reachable."
explanation_key = "error.secret.unavailable"
params = []
remedy = "Retry later."
since = "0.1.0"

[[entry]]
code = "secret.unsupported"
class = "none"
summary = "The sealed value is not a signing-key reference."
explanation_key = "error.secret.unsupported"
params = []
remedy = "Store a signing-key reference."
since = "0.1.0"

[[entry]]
code = "secret.webhook_not_found"
class = "none"
summary = "The webhook named by the signing key does not exist."
explanation_key = "error.secret.webhook_not_found"
params = []
remedy = "Check the webhook name."
since = "0.1.0"

[[entry]]
code = "secret.wrong_site"
class = "none"
summary = "The signing key belongs to another site."
explanation_key = "error.secret.wrong_site"
params = []
remedy = "Use a key of this site."
since = "0.1.0"
