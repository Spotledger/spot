# secrets_host codes. One [[entry]] per code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "secrets_host.settings_invalid"
class = "none"
summary = "The [services.secrets] table has an unknown key or a value of the wrong type, so the secrets service cannot start."
explanation_key = "error.secrets_host.settings_invalid"
params = []
remedy = "Fix the table: only provider and kek_file exist."
since = "0.1.0"

[[entry]]
code = "secrets_host.kek_unset"
class = "none"
summary = "The secrets service names no key file, or a provider other than local, so it has no key and the site refuses to start."
explanation_key = "error.secrets_host.kek_unset"
params = []
remedy = "Set services.secrets.kek_file, with provider local."
since = "0.1.0"

[[entry]]
code = "secrets_host.kek_path_refused"
class = "none"
summary = "The key file path is relative, contains .., lies inside the site folders or is shared by several sites, so the secrets service refuses it."
explanation_key = "error.secrets_host.kek_path_refused"
params = []
remedy = "Use an absolute path outside the site folders, with {site} when the host has several sites."
since = "0.1.0"

[[entry]]
code = "secrets_host.kek_file_unusable"
class = "none"
summary = "The key file is missing, empty, unreadable or not a key file, so the secrets service cannot start and the site refuses to serve."
explanation_key = "error.secrets_host.kek_file_unusable"
params = []
remedy = "Restore the key file from its backup; use spot secrets init only for a site that has stored no secret."
since = "0.1.0"

[[entry]]
code = "secrets_host.kek_file_unsafe"
class = "none"
summary = "The key file is accessible to group or others, or belongs to another user than the one running spot, so the secrets service refuses it."
explanation_key = "error.secrets_host.kek_file_unsafe"
params = []
remedy = "Run chmod 600 on the key file and make the running user its owner."
since = "0.1.0"

[[entry]]
code = "secrets_host.canary_failed"
class = "none"
summary = "The key provider could not wrap and unwrap its start-up canary under the current key version, so the site refuses to serve."
explanation_key = "error.secrets_host.canary_failed"
params = []
remedy = "The key file is damaged: restore it from its backup."
since = "0.1.0"

[[entry]]
code = "secrets_host.key_version_missing"
class = "none"
summary = "Stored values are sealed under a key version the key file does not hold, so the site refuses to serve rather than seal new values under a different key."
explanation_key = "error.secrets_host.key_version_missing"
params = []
remedy = "Restore the newest copy of the key file; an older copy does not hold the newer version."
since = "0.1.0"

[[entry]]
code = "secrets_host.rotation_running"
class = "none"
summary = "Another rotation holds the key file lock, or a rotation is unfinished, so spot secrets refuses to start another."
explanation_key = "error.secrets_host.rotation_running"
params = []
remedy = "Wait for it, or finish it with rotate-kek --resume; remove the lock file only when no rotation is running."
since = "0.1.0"

[[entry]]
code = "secrets_host.rewrap_failed"
class = "none"
summary = "A rewrap of sealed values was refused or left values under an older key version; the old version is kept."
explanation_key = "error.secrets_host.rewrap_failed"
params = []
remedy = "Run spot secrets status, read the secret audit journal, then run rotate-kek --resume."
since = "0.1.0"

[[entry]]
code = "secrets_host.retire_refused"
class = "none"
summary = "A key version cannot be retired because stored values are still under it or it is the current version."
explanation_key = "error.secrets_host.retire_refused"
params = []
remedy = "Finish the rotation, then retire the older versions."
since = "0.1.0"

[[entry]]
code = "secrets_host.retire_unconfirmed"
class = "none"
summary = "spot secrets retire-kek --apply was run without --confirm-all-servers-reloaded, so no key material was destroyed."
explanation_key = "error.secrets_host.retire_unconfirmed"
params = []
remedy = "Check that every server of the site has reloaded onto the current key version, then run the command again with --confirm-all-servers-reloaded."
since = "0.1.0"

[[entry]]
code = "secrets_host.audit_unavailable"
class = "none"
summary = "The identity audit chain cannot take the record an operation depends on, so the operation did not run."
explanation_key = "error.secrets_host.audit_unavailable"
params = []
remedy = "Run spot migrate --apply and check that the site database answers."
since = "0.1.0"
