# compliance_host codes: the refusals of the compliance evidence service hosted by spot-cli (WP-SEC-08.T3), which collects evidence from the hosted subsystems and serves the auditor's read-only view and pack. These are the port's vocabulary; a route maps them to an HTTP answer. One [[entry]] per code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "compliance_host.forbidden"
class = "none"
summary = "Only the read-only compliance auditor role may read compliance evidence."
explanation_key = "error.compliance_host.forbidden"
params = []
remedy = "Sign in as a user who holds exactly the compliance auditor role (read on the control library, evidence items, assessments and packs)."
since = "0.1.0"

[[entry]]
code = "compliance_host.no_evidence"
class = "none"
summary = "No evidence has been collected yet, so there is nothing to put in a pack."
explanation_key = "error.compliance_host.no_evidence"
params = []
remedy = "Wait for the first scheduled collection, or check that the evidence chain and the subsystems that provide facts are hosted (the compliance service shows as degraded when the chain is missing)."
since = "0.1.0"

[[entry]]
code = "compliance_host.pack_failed"
class = "none"
summary = "The evidence pack could not be built: {code}."
explanation_key = "error.compliance_host.pack_failed"
params = ["code"]
remedy = "Look up the named compliance code; the usual causes are an item whose digest no longer matches or a period with no evidence."
since = "0.1.0"
