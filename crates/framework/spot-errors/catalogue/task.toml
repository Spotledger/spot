# task task codes of the native API. One [[entry]] per code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "task.not_found"
class = "none"
summary = "The task does not exist or the caller cannot see it."
explanation_key = "error.task.not_found"
params = []
remedy = "Check the task id."
since = "0.1.0"

