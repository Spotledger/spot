# lease_grants codes: hub-side grants of leased number ranges (spot-lease-grants,
# WP-EDG-03.T4). One [[entry]] per code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "lease_grants.node_mismatch"
class = "PermissionDenied"
summary = "The request names another node than the one the connection authenticated."
explanation_key = "error.lease_grants.node_mismatch"
params = []
remedy = "Send the request from the node it names; a node asks only for its own ranges."
since = "0.1.0"

[[entry]]
code = "lease_grants.node_not_active"
class = "PermissionDenied"
summary = "The node may not be granted a number range."
explanation_key = "error.lease_grants.node_not_active"
params = []
remedy = "Ask the hub administrator about the node's standing."
since = "0.1.0"

[[entry]]
code = "lease_grants.size_refused"
class = "Validation"
summary = "The requested range size is zero or above the series maximum."
explanation_key = "error.lease_grants.size_refused"
params = []
remedy = "Ask for a range between one number and the series maximum."
since = "0.1.0"

[[entry]]
code = "lease_grants.too_soon"
class = "Unavailable"
summary = "A range of this series was granted to this node too recently."
explanation_key = "error.lease_grants.too_soon"
params = []
remedy = "Wait for the minimum interval between grants, then ask again."
since = "0.1.0"

[[entry]]
code = "lease_grants.log_failed"
class = "Unavailable"
summary = "The grant could not be recorded, so no range was issued."
explanation_key = "error.lease_grants.log_failed"
params = []
remedy = "Retry; the range that was taken is lost and never reissued."
since = "0.1.0"

[[entry]]
code = "lease_grants.audit_failed"
class = "Unavailable"
summary = "The grant could not be audited, so no range was issued."
explanation_key = "error.lease_grants.audit_failed"
params = []
remedy = "Retry once the audit store is available; the range taken is lost and never reissued."
since = "0.1.0"

[[entry]]
code = "lease_grants.series_exhausted"
class = "Unavailable"
summary = "The series has no numbers left for a range of this size."
explanation_key = "error.lease_grants.series_exhausted"
params = []
remedy = "Ask for a smaller range, or open a new series."
since = "0.1.0"

[[entry]]
code = "lease_grants.allocator_failed"
class = "Internal"
summary = "The allocator could not grant a range."
explanation_key = "error.lease_grants.allocator_failed"
params = []
remedy = "Check the hub's allocator and its log."
since = "0.1.0"

[[entry]]
code = "lease_grants.series_not_entitled"
class = "PermissionDenied"
summary = "The node is not entitled to the naming series it asked for."
explanation_key = "error.lease_grants.series_not_entitled"
params = []
remedy = "Ask the hub administrator which series this node may lease."
since = "0.1.0"

[[entry]]
code = "lease_grants.series_cap_reached"
class = "Unavailable"
summary = "The hub cannot track another naming series."
explanation_key = "error.lease_grants.series_cap_reached"
params = []
remedy = "Remove a series from the grant service, or raise the policy's limit on distinct series."
since = "0.1.0"

[[entry]]
code = "lease_grants.time_invalid"
class = "Internal"
summary = "The times involved cannot be compared, so no range was issued."
explanation_key = "error.lease_grants.time_invalid"
params = []
remedy = "Check the hub's clock and the grant log for a corrupt grant instant."
since = "0.1.0"

[[entry]]
code = "lease_grants.node_regressed"
class = "PermissionDenied"
summary = "The node reported an older state than the hub issued, or is already flagged, and must re-enrol."
explanation_key = "error.lease_grants.node_regressed"
params = []
remedy = "Re-enrol the node with the hub administrator; no range is extended until then."
since = "0.1.0"

[[entry]]
code = "lease_grants.report_ahead"
class = "PermissionDenied"
summary = "The node reported a state the hub never issued to it."
explanation_key = "error.lease_grants.report_ahead"
params = []
remedy = "Ask the hub administrator to check the node's identity and enrolment."
since = "0.1.0"

[[entry]]
code = "lease_grants.reply_refused"
class = "InvalidState"
summary = "The reply cannot be issued for this request."
explanation_key = "error.lease_grants.reply_refused"
params = []
remedy = "Send a fresh request from the node's current state; if it repeats, ask the hub administrator."
since = "0.1.0"

# The two audit record kinds the service writes. They ride the audit chain, not an AppError.
[[entry]]
code = "lease_grants.granted"
class = "none"
summary = "Audit kind: a number range was granted to an authenticated, active node."
explanation_key = "error.lease_grants.granted"
params = []
remedy = "None: this is a record of a grant, not a failure."
since = "0.1.0"

[[entry]]
code = "lease_grants.refused"
class = "none"
summary = "Audit kind: a request for a number range was refused; the payload carries the reason."
explanation_key = "error.lease_grants.refused"
params = []
remedy = "Read the reason in the record; see the lease_grants.* error codes."
since = "0.1.0"

[[entry]]
code = "lease_grants.replayed"
class = "none"
summary = "Audit kind: a re-request was answered with the range already granted under its request id."
explanation_key = "error.lease_grants.replayed"
params = []
remedy = "None: this is a record of a replay, not a failure."
since = "0.1.0"
