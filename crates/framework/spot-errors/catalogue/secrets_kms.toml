# secrets_kms codes: the customer-managed-key provider (WP-SEC-03.T13). One [[entry]] per code;
# see crates/framework/spot-errors/README.md.
#
# No message carries the token, a ciphertext, a data key, the seed or a response body: the
# parameters are fixed sentences and numbers only. The provider hands these to spot-secrets as
# `SecretError::Provider`, with the key name added.

[[entry]]
code = "secrets_kms.config_invalid"
class = "none"
summary = "The KMS configuration is not usable: {reason}."
explanation_key = "error.secrets_kms.config_invalid"
params = ["reason"]
remedy = "Fix the KMS address (https only), mount, key name, namespace or timeout in the site configuration."
since = "0.1.0"

[[entry]]
code = "secrets_kms.token_unreadable"
class = "none"
summary = "The KMS token file cannot be used: {reason}."
explanation_key = "error.secrets_kms.token_unreadable"
params = ["reason"]
remedy = "Create the token file as a regular file readable only by the service user (mode 0600) and put the token in it."
since = "0.1.0"

[[entry]]
code = "secrets_kms.egress_refused"
class = "none"
summary = "The egress policy refused the KMS address."
explanation_key = "error.secrets_kms.egress_refused"
params = []
remedy = "Add an allow entry for the KMS host and port to the egress policy of the platform tenant."
since = "0.1.0"

[[entry]]
code = "secrets_kms.unreachable"
class = "none"
summary = "The KMS could not be reached: {reason}."
explanation_key = "error.secrets_kms.unreachable"
params = ["reason"]
remedy = "Check the network path to the KMS and its health; cached data keys keep working until the cache lifetime ends."
since = "0.1.0"

[[entry]]
code = "secrets_kms.rejected"
class = "none"
summary = "The KMS refused the request with HTTP status {status}."
explanation_key = "error.secrets_kms.rejected"
params = ["status"]
remedy = "Check that the token is valid and not revoked, that the key exists and is enabled, and that its policy allows encrypt, decrypt and read."
since = "0.1.0"

[[entry]]
code = "secrets_kms.response_invalid"
class = "none"
summary = "The KMS answered in a shape this client does not accept: {reason}."
explanation_key = "error.secrets_kms.response_invalid"
params = ["reason"]
remedy = "Check that the address points at a Vault Transit compatible service and that no proxy rewrites its answers."
since = "0.1.0"

[[entry]]
code = "secrets_kms.key_disabled"
class = "none"
summary = "The key is disabled in the KMS, so nothing can be wrapped."
explanation_key = "error.secrets_kms.key_disabled"
params = []
remedy = "Enable the key in the KMS, or switch the site to another key provider."
since = "0.1.0"

[[entry]]
code = "secrets_kms.version_retired"
class = "none"
summary = "A value is wrapped under key version {version}, which the KMS no longer decrypts."
explanation_key = "error.secrets_kms.version_retired"
params = ["version"]
remedy = "Lower the KMS minimum decryption version, or restore the data from a backup taken before the version was retired."
since = "0.1.0"

[[entry]]
code = "secrets_kms.input_invalid"
class = "none"
summary = "A value given to the KMS provider is out of bounds: {reason}."
explanation_key = "error.secrets_kms.input_invalid"
params = ["reason"]
remedy = "Pass a data key of 1 to 1024 bytes."
since = "0.1.0"

[[entry]]
code = "secrets_kms.seed_invalid"
class = "none"
summary = "The derivation seed file is not acceptable: {reason}."
explanation_key = "error.secrets_kms.seed_invalid"
params = ["reason"]
remedy = "Restore the seed file for this key from backup; do not copy a seed file from another key or site."
since = "0.1.0"

[[entry]]
code = "secrets_kms.seed_io"
class = "none"
summary = "The derivation seed file could not be read or written: {reason}."
explanation_key = "error.secrets_kms.seed_io"
params = ["reason"]
remedy = "Check the seed file path, its directory and its permissions (mode 0600, owned by the service user), and remove a stale temp file."
since = "0.1.0"
