# secrets codes. One [[entry]] per code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "secrets.unknown_key"
class = "none"
summary = "The sealed value names a key version the provider does not have: {id}."
explanation_key = "error.secrets.unknown_key"
params = ["id"]
remedy = "Restore the key version or re-seal the value under a current key."
since = "0.1.0"

[[entry]]
code = "secrets.retired_key"
class = "none"
summary = "The key version was retired, so values sealed under it can no longer be opened: {id}."
explanation_key = "error.secrets.retired_key"
params = ["id"]
remedy = "Re-seal the value under a current key before retiring old keys."
since = "0.1.0"

[[entry]]
code = "secrets.tampered"
class = "none"
summary = "The sealed value failed authentication: it was altered or opened with wrong associated data."
explanation_key = "error.secrets.tampered"
params = []
remedy = "Do not trust the value; re-derive it from its source and re-seal."
since = "0.1.0"

[[entry]]
code = "secrets.malformed"
class = "none"
summary = "The sealed value is not in the SPS1 format."
explanation_key = "error.secrets.malformed"
params = []
remedy = "Seal the value again through the secrets service."
since = "0.1.0"

[[entry]]
code = "secrets.provider"
class = "none"
summary = "The key provider failed (I/O, bad configuration or refused operation): {error}."
explanation_key = "error.secrets.provider"
params = ["error"]
remedy = "Check the provider configuration and storage backend."
since = "0.1.0"

[[entry]]
code = "secrets.index_key"
class = "none"
summary = "The blind-index key could not be derived from the key-encryption key: {error}."
explanation_key = "error.secrets.index_key"
params = ["error"]
remedy = "Check that the current key version still has key material; restore the key version or derive the index from another provider."
since = "0.1.0"

[[entry]]
code = "secrets.derive_key"
class = "none"
summary = "The key provider refused a derive_key request: {reason}."
explanation_key = "error.secrets.derive_key"
params = ["reason"]
remedy = "Pass a non-empty info label of at most 256 bytes and a len of 16 to 64 bytes, and use a provider that supports derive_key."
since = "0.1.0"

[[entry]]
code = "secrets.unknown_key_version"
class = "none"
summary = "A blind index names key version {version}, which no provider produced: versions start at 1."
explanation_key = "error.secrets.unknown_key_version"
params = ["version"]
remedy = "Treat the stored value as not an index; recompute the blind index from the field's value."
since = "0.1.0"

[[entry]]
code = "secrets.reserved_name"
class = "none"
summary = "The name {name} uses the reserved `__` infix, which the engine keeps for its own columns."
explanation_key = "error.secrets.reserved_name"
params = ["name"]
remedy = "Rename the field without `__`; a secret field is stored as `<field>__sealed`, which is already reserved."
since = "0.1.0"
