# journal_audit_run codes: the refusals of the scheduled journal audit runner (WP-JRN-07.T2, ADR-061 s8). A refusal is a library-internal vocabulary: it never rides an `AppError`, so every class is `none`. A rebuild that fails is a result row, not one of these. One [[entry]] per code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "journal_audit_run.options_invalid"
class = "none"
summary = "The journal audit options are not usable: the journal source is empty."
explanation_key = "error.journal_audit_run.options_invalid"
params = []
remedy = "Pass the source id of the journal being audited."
since = "0.1.0"

[[entry]]
code = "journal_audit_run.tenant_mismatch"
class = "none"
summary = "The {side} side of the journal audit belongs to another tenant than the run, so nothing was read or rebuilt."
explanation_key = "error.journal_audit_run.tenant_mismatch"
params = ["side"]
remedy = "Build the live and scratch sides for the tenant the audit runs for; one audit audits one tenant."
since = "0.1.0"

[[entry]]
code = "journal_audit_run.signer_missing"
class = "none"
summary = "The audit was asked to start from an untrusted snapshot but has no snapshot signer to mark it verified after a clean run."
explanation_key = "error.journal_audit_run.signer_missing"
params = []
remedy = "Pass the tenant journal key's snapshot signer, or run on trusted snapshots only."
since = "0.1.0"

[[entry]]
code = "journal_audit_run.compare_failed"
class = "none"
summary = "The journal audit could not compare the live side with the rebuild: a side's summaries are not sorted or a fingerprint is unusable."
explanation_key = "error.journal_audit_run.compare_failed"
params = []
remedy = "Order each side's summaries by entity then id and give every fingerprint one name and unique keys, as the journal audit crate requires."
since = "0.1.0"

[[entry]]
code = "journal_audit_run.rebuild_unknown_topic"
class = "none"
summary = "The journal audit's rebuild stage stopped because the journal holds a topic the event classifier does not know, so nothing was compared."
explanation_key = "error.journal_audit_run.rebuild_unknown_topic"
params = []
remedy = "Register the topic with its class in the platform registry, or give the tenant's audit a classifier that declares the app's topics (DomainTopicsClassifier). This is not a data mismatch: the data was not compared."
since = "0.1.0"

[[entry]]
code = "journal_audit_run.classifier_shadows_registered"
class = "none"
summary = "The app topic {topic} cannot be declared for the journal audit: the platform registry already classifies it."
explanation_key = "error.journal_audit_run.classifier_shadows_registered"
params = ["topic"]
remedy = "Remove the topic from the app's declared topics; a platform topic keeps the class the registry gives it."
since = "0.1.0"

[[entry]]
code = "journal_audit_run.classifier_topic_invalid"
class = "none"
summary = "A topic declared for the journal audit is not a valid app topic name (lower-case letters, digits and underscores, at most 63 bytes, not starting with doc_, sys_ or identity_)."
explanation_key = "error.journal_audit_run.classifier_topic_invalid"
params = []
remedy = "Declare app topics with a valid storage name that does not use a reserved platform prefix."
since = "0.1.0"

[[entry]]
code = "journal_audit_run.classifier_topic_conflicting"
class = "none"
summary = "The app topic {topic} is declared for the journal audit with two different classes."
explanation_key = "error.journal_audit_run.classifier_topic_conflicting"
params = ["topic"]
remedy = "Declare the topic once, with one class (state, domain or audit)."
since = "0.1.0"
