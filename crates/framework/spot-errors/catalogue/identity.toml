# identity identity codes of the native API. One [[entry]] per code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "identity.totp_state"
class = "none"
summary = "The TOTP factor is already active or not yet started."
explanation_key = "error.identity.totp_state"
params = []
remedy = "Use the confirm step only after enrolment."
since = "0.1.0"

