# Registry refusal codes (WP-STR-03). Bundle/signing codes pass through their catalogues.

[[entry]]
code = "registry.digest_mismatch"
class = "none"
summary = "Stored or transported bytes differ from the addressed canonical bundle."
explanation_key = "error.registry.digest_mismatch"
params = []
remedy = "Correct the stated refusal and retry; invalid cursors require restarting the search."
since = "0.1.0"

