# Customer-consented deep-access refusals (WP-SEC-07.T1).

[[entry]]
code = "deep_access.missing_receipt"
class = "none"
summary = "A customer consent receipt is required."
explanation_key = "error.deep_access.missing_receipt"
params = []
remedy = "Customer approver: review the request, scope, window and authentication method before signing a fresh receipt. Operator: stop this operation, correct the stated failure and request fresh consent; contact the tenant administrator if storage or audit is unavailable."
since = "0.1.0"

