[[entry]]
code = "nocode_model.bad_layout"
class = "none"
summary = "The form layout cannot take the shape asked of it."
explanation_key = "error.nocode_model.bad_layout"
params = []
remedy = "A form carries tabs or top-level sections, never both; keep to one style."
since = "0.1.0"

[[entry]]
code = "nocode_model.bad_condition"
class = "none"
summary = "The condition could not be built into a rule."
explanation_key = "error.nocode_model.bad_condition"
params = []
remedy = "Give every row a field, an operator and a value."
since = "0.1.0"

[[entry]]
code = "nocode_model.bad_naming"
class = "none"
summary = "The naming pattern is not one the platform accepts."
explanation_key = "error.nocode_model.bad_naming"
params = []
remedy = "Use a series such as INV-.YYYY.-.#####, or field:<name>, or hash."
since = "0.1.0"

[[entry]]
code = "nocode_model.bad_target"
class = "none"
summary = "This DocType cannot be the target of a link or a child table."
explanation_key = "error.nocode_model.bad_target"
params = []
remedy = "Link to a normal DocType, or make the target a child and add it as a child table."
since = "0.1.0"

[[entry]]
code = "nocode_model.type_change_refused"
class = "none"
summary = "The field's type cannot change without losing or corrupting its values."
explanation_key = "error.nocode_model.type_change_refused"
params = []
remedy = "Keep the type, add a new field of the wanted type, or map the values first."
since = "0.1.0"

[[entry]]
code = "nocode_model.type_change_lossy"
class = "none"
summary = "The field's type can change, but some existing values will be cut, rounded or reinterpreted."
explanation_key = "error.nocode_model.type_change_lossy"
params = []
remedy = "Review the values the change affects before publishing."
since = "0.1.0"

[[entry]]
code = "nocode_model.publish_forbidden"
class = "none"
summary = "The caller does not hold the designer.publish permission."
explanation_key = "error.nocode_model.publish_forbidden"
params = []
remedy = "Ask a platform administrator for the designer.publish permission."
since = "0.1.0"

[[entry]]
code = "nocode_model.publish_failed"
class = "none"
summary = "The publish was refused or the store it writes to failed."
explanation_key = "error.nocode_model.publish_failed"
params = []
remedy = "Read the publisher's message, fix the cause and publish again."
since = "0.1.0"

[[entry]]
code = "nocode_model.not_ready"
class = "none"
summary = "The design is not valid, so it cannot be published yet."
explanation_key = "error.nocode_model.not_ready"
params = []
remedy = "Fix every listed problem in the validation panel, then publish."
since = "0.1.0"

[[entry]]
code = "nocode_model.existing_needs_prefix"
class = "none"
summary = "A new field on an existing DocType must be a custom field."
explanation_key = "error.nocode_model.existing_needs_prefix"
params = []
remedy = "Let the designer name the field with the custom_ prefix."
since = "0.1.0"

[[entry]]
code = "nocode_model.not_custom_field"
class = "none"
summary = "An app field cannot be removed from an existing DocType."
explanation_key = "error.nocode_model.not_custom_field"
params = []
remedy = "Hide the field in the view instead of removing it."
since = "0.1.0"

[[entry]]
code = "nocode_model.unsupported_op"
class = "none"
summary = "This edit is not supported for the element it names."
explanation_key = "error.nocode_model.unsupported_op"
params = []
remedy = "Use the edit that fits the element, such as adding a child table with its child."
since = "0.1.0"

[[entry]]
code = "nocode_model.bad_options"
class = "none"
summary = "The list of choices is empty or repeats a value."
explanation_key = "error.nocode_model.bad_options"
params = []
remedy = "Give the field at least one choice, with no repeats."
since = "0.1.0"

[[entry]]
code = "nocode_model.referenced"
class = "none"
summary = "The field is still referred to by another field, so it cannot be removed."
explanation_key = "error.nocode_model.referenced"
params = []
remedy = "Remove or change the field that refers to it first."
since = "0.1.0"

