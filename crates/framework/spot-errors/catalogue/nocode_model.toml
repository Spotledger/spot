# nocode_model codes: the no-code DocType and form designer (spot-nocode-model, WP-DX-06.T1).
# Library-internal vocabulary: raised by the crate, explained to a designer by the host.
# The summary is the plain-language message a business user reads; the remedy is the fix.
# One [[entry]] per code; see crates/framework/spot-errors/README.md.

# --- guard rails (raised by the draft itself) ---

[[entry]]
code = "nocode_model.reserved_name"
class = "none"
summary = "This name is reserved by the platform and cannot be used for a field or a DocType."
explanation_key = "error.nocode_model.reserved_name"
params = []
remedy = "Choose another name; system columns and engine-managed fields keep their names."
since = "0.1.0"

[[entry]]
code = "nocode_model.bad_name"
class = "none"
summary = "This name is not a valid name."
explanation_key = "error.nocode_model.bad_name"
params = []
remedy = "Use lower-case letters, digits and underscores, starting with a letter."
since = "0.1.0"

[[entry]]
code = "nocode_model.max_fields"
class = "none"
summary = "The DocType has more fields than the platform allows."
explanation_key = "error.nocode_model.max_fields"
params = []
remedy = "Remove fields until the DocType is within the limit, or split it into two DocTypes."
since = "0.1.0"

[[entry]]
code = "nocode_model.max_depth"
class = "none"
summary = "The design is nested deeper than the platform allows."
explanation_key = "error.nocode_model.max_depth"
params = []
remedy = "Flatten the design: a child table cannot hold another child table, and a form holds at most fifty sections."
since = "0.1.0"

[[entry]]
code = "nocode_model.no_script"
class = "none"
summary = "A value looks like script, and a design never runs code."
explanation_key = "error.nocode_model.no_script"
params = []
remedy = "Enter plain data; use a rule or a condition builder instead of script."
since = "0.1.0"

[[entry]]
code = "nocode_model.no_sql"
class = "none"
summary = "A value looks like a raw SQL statement, which a design may never carry."
explanation_key = "error.nocode_model.no_sql"
params = []
remedy = "Enter plain data; the platform builds every query itself."
since = "0.1.0"

[[entry]]
code = "nocode_model.protected_doctype"
class = "none"
summary = "This is a protected system DocType and cannot be edited by the designer."
explanation_key = "error.nocode_model.protected_doctype"
params = []
remedy = "Design a new DocType instead, or ask a platform administrator for the change."
since = "0.1.0"

[[entry]]
code = "nocode_model.needs_data_loss_confirmation"
class = "none"
summary = "Removing this field would delete its stored values and needs explicit confirmation."
explanation_key = "error.nocode_model.needs_data_loss_confirmation"
params = []
remedy = "Confirm the deletion with the data-loss token, or keep the field."
since = "0.1.0"

[[entry]]
code = "nocode_model.unknown_field"
class = "none"
summary = "The design names a field it does not have."
explanation_key = "error.nocode_model.unknown_field"
params = []
remedy = "Add the field first, or correct its name."
since = "0.1.0"

[[entry]]
code = "nocode_model.unknown_child"
class = "none"
summary = "The design names a child DocType it does not have."
explanation_key = "error.nocode_model.unknown_child"
params = []
remedy = "Add the child table first, or correct its name."
since = "0.1.0"

[[entry]]
code = "nocode_model.duplicate_field"
class = "none"
summary = "Two fields share this name."
explanation_key = "error.nocode_model.duplicate_field"
params = []
remedy = "Give each field a unique name."
since = "0.1.0"

[[entry]]
code = "nocode_model.duplicate_section"
class = "none"
summary = "Two form sections share this id."
explanation_key = "error.nocode_model.duplicate_section"
