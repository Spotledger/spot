# bpm_pg codes: the PostgreSQL CaseStore for the BPM engine (WP-BPM-02.T2). One [[entry]] per
# code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "bpm_pg.migration_failed"
class = "Internal"
summary = "The BPM store's tables could not be created in the database."
explanation_key = "error.bpm_pg.migration_failed"
params = []
remedy = "Check that the database user may create tables and that the server is reachable, then retry prepare."
since = "0.1.0"
