# secretfield codes. One [[entry]] per code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "secretfield.not_configured"
class = "Internal"
summary = "The engine has no secrets vault, so it cannot seal, open or look up a secret."
explanation_key = "error.secretfield.not_configured"
params = []
remedy = "Give the engine a secrets vault before using secret fields."
since = "0.1.0"

[[entry]]
code = "secretfield.unknown_field"
class = "Validation"
summary = "The DocType has no secret field of that name, or the field was named twice."
explanation_key = "error.secretfield.unknown_field"
params = []
remedy = "Name a field declared with type secret, once."
since = "0.1.0"

[[entry]]
code = "secretfield.not_lookup"
class = "Validation"
summary = "The secret field does not declare lookup = true, so it cannot be searched by value."
explanation_key = "error.secretfield.not_lookup"
params = []
remedy = "Declare lookup = true on the field, or find the record another way."
since = "0.1.0"

[[entry]]
code = "secretfield.unsupported_doctype"
class = "Validation"
summary = "Secrets are held by documents; the rows of a child table cannot hold one."
explanation_key = "error.secretfield.unsupported_doctype"
params = []
remedy = "Move the secret field to the parent DocType."
since = "0.1.0"

[[entry]]
code = "secretfield.empty_value"
class = "Validation"
summary = "An empty value is not accepted as a secret or as a lookup value."
explanation_key = "error.secretfield.empty_value"
params = []
remedy = "Give a non-empty value."
since = "0.1.0"

[[entry]]
code = "secretfield.seal_failed"
class = "Internal"
summary = "The secret could not be sealed; the cause names the secrets error code."
explanation_key = "error.secretfield.seal_failed"
params = []
remedy = "Check the key provider and the key ring, then retry."
since = "0.1.0"

[[entry]]
code = "secretfield.open_failed"
class = "Internal"
summary = "The stored secret could not be opened: it was altered, moved to another record or field, or its key is gone."
explanation_key = "error.secretfield.open_failed"
params = []
remedy = "Treat the stored value as lost and set the secret again; check the key ring if every value fails."
since = "0.1.0"

[[entry]]
code = "secretfield.rewrap_failed"
class = "Internal"
summary = "A stored secret could not be moved onto the current key."
explanation_key = "error.secretfield.rewrap_failed"
params = []
remedy = "Check the audit log for the record, and the key ring for the key version the value is under."
since = "0.1.0"

[[entry]]
code = "secretfield.index_failed"
class = "Internal"
summary = "The blind index of a secret could not be derived."
explanation_key = "error.secretfield.index_failed"
params = []
remedy = "Check that the key provider derives blind-index keys and that the key version is below 256."
since = "0.1.0"

[[entry]]
code = "secretfield.duplicate"
class = "Duplicate"
summary = "Another record already holds this value in a unique lookup secret field."
explanation_key = "error.secretfield.duplicate"
params = []
remedy = "Choose a different value."
since = "0.1.0"

[[entry]]
code = "secretfield.ambiguous"
class = "Internal"
summary = "More than one record holds the looked-up value in a lookup secret field that is not unique."
explanation_key = "error.secretfield.ambiguous"
params = []
remedy = "Make the field unique or look the record up another way. A field declared unique never raises this code: its uniqueness is enforced on the blind index."
since = "0.1.0"

[[entry]]
code = "secretfield.audit_failed"
class = "Internal"
summary = "The audit row of a secret operation could not be written, so the operation did not happen."
explanation_key = "error.secretfield.audit_failed"
params = []
remedy = "Retry once storage is available; no secret is set, opened or looked up without its audit row."
since = "0.1.0"

[[entry]]
code = "secretfield.invalid_definition"
class = "Internal"
summary = "The secret field's definition cannot be read as a secret definition."
explanation_key = "error.secretfield.invalid_definition"
params = []
remedy = "Fix the DocType: a secret takes lookup = true or nothing."
since = "0.1.0"

[[entry]]
code = "secretfield.invalid_batch"
class = "Validation"
summary = "A rewrap batch holds 1 to 500 records."
explanation_key = "error.secretfield.invalid_batch"
params = []
remedy = "Give a batch size in range."
since = "0.1.0"

[[entry]]
code = "secretfield.inconsistent"
class = "Internal"
summary = "A sealed column holds something other than bytes."
explanation_key = "error.secretfield.inconsistent"
params = []
remedy = "Restore the row from a backup; the engine never writes such a value."
since = "0.1.0"
