# journal_pii_secrets_pg codes: the refusals of the PostgreSQL wrapped-key store
# (WP-JRN-08.T6, ADR-061 s6 and s9). A library-internal vocabulary: the adapter in
# spot-journal-pii-secrets sees them as a PortError and spot-journal-pii as
# `journal_pii.key_store`, so no entry names an AppError class. No message carries a value: never
# an entry id, never a wrapped byte and never a driver message.

[[entry]]
code = "journal_pii_secrets_pg.table_missing"
class = "none"
summary = "The wrapped-key table is not in the tenant database (or lacks an expected column), so the schema migration has not run."
explanation_key = "error.journal_pii_secrets_pg.table_missing"
params = []
remedy = "Run the schema migration with this crate's extra table in the plan (`spot_journal_pii_secrets_pg::extra_table()`), then start the node again."
since = "0.1.0"

[[entry]]
code = "journal_pii_secrets_pg.store_failed"
class = "none"
summary = "The wrapped-key table could not be read or written, so the answer about a subject key is unknown (never 'absent')."
explanation_key = "error.journal_pii_secrets_pg.store_failed"
params = []
remedy = "Check the database and the bridge code in the message; a timed-out write may or may not have been applied, so read the entry again before deciding."
since = "0.1.0"

[[entry]]
code = "journal_pii_secrets_pg.row_invalid"
class = "none"
summary = "A stored row is neither a live key (key reference and wrapped bytes) nor a tombstone, so the store refuses to answer from it."
explanation_key = "error.journal_pii_secrets_pg.row_invalid"
params = []
remedy = "Do not edit the table by hand; restore the row from backup or ask the platform team, and never recreate a key for an entry that may have been erased."
since = "0.1.0"
