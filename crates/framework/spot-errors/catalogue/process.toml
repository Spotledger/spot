# process process publishing and webhook codes of the native API. One [[entry]] per code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "process.definition_invalid"
class = "none"
summary = "The process definition is not valid."
explanation_key = "error.process.definition_invalid"
params = []
remedy = "Fix the problems the answer lists and publish again."
