# bundle codes: raised by this crate. One [[entry]] per code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "bundle.bad_archive"
class = "none"
summary = "The bytes are not a ZIP archive at all."
explanation_key = "error.bundle.bad_archive"
params = []
remedy = "Correct what the error message names and retry; the message states the offending item."
