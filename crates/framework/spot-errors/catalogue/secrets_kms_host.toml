# secrets_kms_host codes (WP-SEC-03.T14: the KMS provider hosted by the secrets service). One [[entry]] per code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "secrets_kms_host.settings_invalid"
class = "none"
summary = "The [services.secrets.kms] table is missing, has an unknown key, a value of the wrong type or a number out of range, so the KMS key provider cannot start."
explanation_key = "error.secrets_kms_host.settings_invalid"
params = []
remedy = "Fix the table: only address, mount, key_name, token_file, seed_file, cache_ttl_seconds and refresh_interval_seconds exist; address must be https."
since = "0.1.0"

[[entry]]
code = "secrets_kms_host.path_refused"
class = "none"
summary = "The KMS token file or seed file path is relative, contains .., lies inside the site folders or (for the seed) is shared by several sites, so the KMS key provider refuses it."
explanation_key = "error.secrets_kms_host.path_refused"
params = []
remedy = "Use an absolute path outside the site folders, with {site} in the seed file path when the host has several sites."
since = "0.1.0"

[[entry]]
code = "secrets_kms_host.file_missing"
class = "none"
summary = "The KMS token file or seed file does not exist, so the site refuses to start."
explanation_key = "error.secrets_kms_host.file_missing"
params = []
remedy = "Create the token file with the KMS token (mode 0600); create the seed file once with spot secrets-kms init, or restore it from its backup."
since = "0.1.0"

[[entry]]
code = "secrets_kms_host.file_unusable"
class = "none"
summary = "The KMS token file or seed file is empty, a symbolic link, not a regular file or cannot be read, so the site refuses to start."
explanation_key = "error.secrets_kms_host.file_unusable"
params = []
remedy = "Replace it with a regular, non-empty file owned by the user running spot, or restore it from its backup."
since = "0.1.0"

[[entry]]
code = "secrets_kms_host.file_unsafe"
class = "none"
summary = "The KMS token file or seed file is accessible to group or others, so the site refuses to start."
explanation_key = "error.secrets_kms_host.file_unsafe"
params = []
remedy = "Run chmod 600 on the file."
since = "0.1.0"

[[entry]]
code = "secrets_kms_host.egress_not_allowed"
class = "none"
summary = "The egress policy does not allow the site to reach the KMS, so the site refuses to start."
explanation_key = "error.secrets_kms_host.egress_not_allowed"
params = []
remedy = "Add the allow entry named in the message to the egress policy for this site (host, port 443 or the KMS port, purpose connector; allow_private for a KMS on a private address)."
since = "0.1.0"

[[entry]]
code = "secrets_kms_host.start_failed"
class = "none"
summary = "The KMS key could not be read, is disabled or the client could not be opened, so the site refuses to start."
explanation_key = "error.secrets_kms_host.start_failed"
params = []
remedy = "Check that the KMS is up, the token is valid and the key is enabled; the message names the key and the cause code."
since = "0.1.0"

[[entry]]
code = "secrets_kms_host.canary_failed"
class = "none"
summary = "The KMS key failed its start-up check: wrapping and unwrapping the canary or deriving the blind-index key did not work, so the site refuses to serve."
explanation_key = "error.secrets_kms_host.canary_failed"
params = []
remedy = "Check the token's policy allows encrypt and decrypt on the key, and that the seed file belongs to this key."
since = "0.1.0"

[[entry]]
code = "secrets_kms_host.seed_exists"
class = "none"
summary = "The seed file already exists, so spot secrets-kms init refuses to overwrite it; a new seed would change every blind index."
explanation_key = "error.secrets_kms_host.seed_exists"
params = []
remedy = "Keep the existing seed file; restore it from its backup if the site cannot read it."
since = "0.1.0"

[[entry]]
code = "secrets_kms_host.rewrap_failed"
class = "none"
summary = "The seed file could not be moved to the latest KMS key version, so the old key version must not be retired yet."
explanation_key = "error.secrets_kms_host.rewrap_failed"
params = []
remedy = "Check the KMS is reachable and the token may encrypt, then run spot secrets-kms rewrap-seed again."
since = "0.1.0"
