# journal_pii_secrets codes: the refusals of the SubjectKeys adapter over the spot-secrets key
# provider (WP-JRN-08.T3, ADR-061 s6 and s9). A library-internal vocabulary: spot-journal-pii
# sees them as `journal_pii.key_store`. No message carries a key, a subject or a wrapped byte.

[[entry]]
code = "journal_pii_secrets.refuse_journal_key"
class = "none"
summary = "The tenant journal key was asked to be destroyed, which the subject-key adapter never does."
explanation_key = "error.journal_pii_secrets.refuse_journal_key"
params = []
remedy = "Erase a data subject by destroying that subject's key; the journal key protects legal-retention fields and is rotated, not destroyed, by the key-management task."
since = "0.1.0"

[[entry]]
code = "journal_pii_secrets.config_invalid"
class = "none"
summary = "The adapter was configured with an empty tenant, an empty tenant salt or a cache bound of zero."
explanation_key = "error.journal_pii_secrets.config_invalid"
params = []
remedy = "Give the adapter the tenant id, a stable non-empty tenant salt and a cache bound of at least one."
since = "0.1.0"

[[entry]]
code = "journal_pii_secrets.provider_failed"
class = "none"
summary = "The key provider could not wrap or unwrap a subject key, so the key was neither created nor read."
explanation_key = "error.journal_pii_secrets.provider_failed"
params = []
remedy = "Check that the tenant's key provider is reachable and still holds the key version the stored key was wrapped under."
since = "0.1.0"

[[entry]]
code = "journal_pii_secrets.store_failed"
class = "none"
summary = "The wrapped-key store could not be read or written; the subject is not treated as keyless."
explanation_key = "error.journal_pii_secrets.store_failed"
params = []
remedy = "Restore the wrapped-key store and retry; a reveal waits for it instead of showing a placeholder."
since = "0.1.0"

[[entry]]
code = "journal_pii_secrets.audit_failed"
class = "none"
summary = "The audit port refused the key-destroyed event after the key was deleted."
explanation_key = "error.journal_pii_secrets.audit_failed"
params = []
remedy = "Restore the audit log and repeat the erasure; the repeat is safe and records the event as already absent."
since = "0.1.0"

[[entry]]
code = "journal_pii_secrets.rng_failed"
class = "none"
summary = "The random source could not produce the bytes for a new subject key, so no key was made."
explanation_key = "error.journal_pii_secrets.rng_failed"
params = []
remedy = "Supply a random source backed by the operating system's CSPRNG."
since = "0.1.0"

[[entry]]
code = "journal_pii_secrets.entry_invalid"
class = "none"
summary = "A stored key entry is not one the adapter can use: an unwrapped key of the wrong length, a tombstoned journal key, or a store that refused a key and then reported none."
explanation_key = "error.journal_pii_secrets.entry_invalid"
params = []
remedy = "Inspect the wrapped-key store entry for this tenant; restore it from the key provider's backup if it was damaged."
since = "0.1.0"
