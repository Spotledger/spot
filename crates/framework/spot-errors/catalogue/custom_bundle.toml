# custom_bundle codes: raised by this crate. One [[entry]] per code; see crates/framework/spot-errors/README.md.

[[entry]]
code = "custom_bundle.bad_archive"
class = "none"
summary = "The bytes are not a ZIP archive at all."
explanation_key = "error.custom_bundle.bad_archive"
params = []
remedy = "Correct what the error message names and retry; the message states the offending item."
since = "0.1.0"

[[entry]]
code = "custom_bundle.bad_deflate"
class = "none"
summary = "An entry does not decompress, or its CRC does not match."
explanation_key = "error.custom_bundle.bad_deflate"
params = []
remedy = "Correct what the error message names and retry; the message states the offending item."
since = "0.1.0"

[[entry]]
code = "custom_bundle.bad_symlink"
class = "none"
summary = "A symlink entry; bundles carry plain files and directories only."
explanation_key = "error.custom_bundle.bad_symlink"
params = []
remedy = "Correct what the error message names and retry; the message states the offending item."
since = "0.1.0"

[[entry]]
code = "custom_bundle.duplicate_entry"
class = "none"
summary = "Two entries normalise to the same name, including two that differ only by case (they collide on Windows)."
explanation_key = "error.custom_bundle.duplicate_entry"
params = []
remedy = "Correct what the error message names and retry; the message states the offending item."
since = "0.1.0"

[[entry]]
code = "custom_bundle.illegal_path"
class = "none"
summary = "A name that escapes the bundle or is not a plain relative path."
explanation_key = "error.custom_bundle.illegal_path"
params = []
remedy = "Correct what the error message names and retry; the message states the offending item."
since = "0.1.0"

[[entry]]
code = "custom_bundle.missing_entry"
class = "none"
summary = "A required entry (bundle.toml or digest) is absent."
explanation_key = "error.custom_bundle.missing_entry"
params = []
remedy = "Correct what the error message names and retry; the message states the offending item."
since = "0.1.0"

[[entry]]
code = "custom_bundle.too_large"
class = "none"
summary = "The archive, one file, or the total inflated size exceeds the limits."
explanation_key = "error.custom_bundle.too_large"
params = []
remedy = "Correct what the error message names and retry; the message states the offending item."
since = "0.1.0"

[[entry]]
code = "custom_bundle.too_many_entries"
class = "none"
summary = "More entries than the limits allow."
explanation_key = "error.custom_bundle.too_many_entries"
params = []
remedy = "Correct what the error message names and retry; the message states the offending item."
since = "0.1.0"

[[entry]]
code = "custom_bundle.unexpected_entry"
class = "none"
summary = "An entry that is not bundle.toml, digest, or under sections/."
explanation_key = "error.custom_bundle.unexpected_entry"
params = []
remedy = "Correct what the error message names and retry; the message states the offending item."
since = "0.1.0"

[[entry]]
code = "custom_bundle.format_too_new"
class = "none"
summary = "The bundle's format version is greater than what this reader supports."
explanation_key = "error.custom_bundle.format_too_new"
params = []
remedy = "Upgrade the reader, or re-capture with a compatible writer."
since = "0.1.0"

[[entry]]
code = "custom_bundle.app_incompatible"
class = "none"
summary = "An app the bundle customises is at a different major version on the target."
explanation_key = "error.custom_bundle.app_incompatible"
params = []
remedy = "Update the bundle to target the new major version, or install the compatible app version."
since = "0.1.0"

[[entry]]
code = "custom_bundle.app_version"
class = "none"
summary = "An app the bundle customises is at a different minor or patch version on the target; a warning, not a refusal."
explanation_key = "error.custom_bundle.app_version"
params = []
remedy = "Review the app's changes for this version; the customisations usually still apply. Upgrade or pin the app if they do not."
since = "0.1.0"

[[entry]]
code = "custom_bundle.app_missing"
class = "none"
summary = "An app the bundle customises is not installed on the target."
explanation_key = "error.custom_bundle.app_missing"
params = []
remedy = "Install the missing app, or remove its customisations from the bundle."
since = "0.1.0"

[[entry]]
code = "custom_bundle.digest_mismatch"
class = "none"
summary = "The bundle's digest does not match its content; the archive was tampered with or corrupted."
explanation_key = "error.custom_bundle.digest_mismatch"
params = []
remedy = "Discard this bundle and re-capture from the source site."
since = "0.1.0"

[[entry]]
code = "custom_bundle.unknown_section"
class = "none"
summary = "The bundle contains a section kind this reader does not know; set allow_unknown=true to carry it through."
explanation_key = "error.custom_bundle.unknown_section"
params = []
remedy = "Upgrade the reader to support this section kind, or enable allow_unknown to pass it through unchanged."
since = "0.1.0"

[[entry]]
code = "custom_bundle.invalid_meta"
class = "none"
summary = "The meta section fails validation when rebuilt against the target's definitions."
explanation_key = "error.custom_bundle.invalid_meta"
params = []
remedy = "Resolve the underlying meta.* error (collision, missing options value, unknown DocType) and re-capture."
since = "0.1.0"

[[entry]]
code = "custom_bundle.invalid_views"
class = "none"
summary = "A view layer fails resolution or validation against the target's metadata."
explanation_key = "error.custom_bundle.invalid_views"
params = []
remedy = "Resolve the underlying view.* error and re-capture."
since = "0.1.0"

[[entry]]
code = "custom_bundle.invalid_rules"
class = "none"
summary = "A rule expression does not parse."
explanation_key = "error.custom_bundle.invalid_rules"
params = []
remedy = "Fix the rule's expression syntax and re-capture."
since = "0.1.0"

[[entry]]
code = "custom_bundle.invalid_scripts"
class = "none"
summary = "A script's source hash does not match its recorded hash."
explanation_key = "error.custom_bundle.invalid_scripts"
params = []
remedy = "Re-transpile the script to update its hash, or restore the original source."
since = "0.1.0"

[[entry]]
code = "custom_bundle.invalid_fixtures"
class = "none"
summary = "A fixtures file is not a JSON array of documents."
explanation_key = "error.custom_bundle.invalid_fixtures"
params = []
remedy = "Re-export the fixtures as a JSON array of objects, or re-capture them from the source site."
since = "0.1.0"

[[entry]]
code = "custom_bundle.apply_failed"
class = "none"
summary = "A change could not be written; the transaction was rolled back."
explanation_key = "error.custom_bundle.apply_failed"
params = []
remedy = "Inspect the underlying writer error and retry."
since = "0.1.0"

[[entry]]
code = "custom_bundle.system_managed"
class = "none"
summary = "Capture or apply touched a system-managed item; this is excluded by design."
explanation_key = "error.custom_bundle.system_managed"
params = []
remedy = "Do not attempt to customise system-managed items."
since = "0.1.0"