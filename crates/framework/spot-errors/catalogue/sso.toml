[[entry]]
code = "sso.saml.unsolicited"
class = "none"
summary = "The sign-in response was refused."
explanation_key = "error.sso.saml.unsolicited"
params = []
remedy = "An unsolicited response arrived and IdP-initiated sign-in is off."
since = "0.1.0"

[[entry]]
code = "sso.saml.status_not_success"
class = "none"
summary = "The identity provider refused the sign-in."
explanation_key = "error.sso.saml.status_not_success"
params = []
remedy = "The IdP returned a non-success status; check the user's account there."
since = "0.1.0"

[[entry]]
code = "sso.saml.signature_missing"
class = "none"
summary = "The sign-in response was not trusted."
explanation_key = "error.sso.saml.signature_missing"
params = []
remedy = "The identity provider must sign the assertion with a pinned certificate."
since = "0.1.0"

[[entry]]
code = "sso.saml.signature_multiple"
class = "none"
summary = "The sign-in response was refused."
explanation_key = "error.sso.saml.signature_multiple"
params = []
remedy = "The SAML message carries more than one signature; refuse it."
since = "0.1.0"

[[entry]]
code = "sso.saml.signature_not_enveloped"
class = "none"
summary = "The sign-in response was refused."
explanation_key = "error.sso.saml.signature_not_enveloped"
params = []
remedy = "The SAML signature is not an enveloped signature over the assertion or response."
since = "0.1.0"

[[entry]]
code = "sso.saml.signature_invalid"
class = "none"
summary = "The sign-in response was not trusted."
explanation_key = "error.sso.saml.signature_invalid"
params = []
remedy = "Check the identity provider's pinned certificates and signing algorithm."
since = "0.1.0"

[[entry]]
code = "sso.saml.reference_invalid"
class = "none"
summary = "The sign-in response was refused."
explanation_key = "error.sso.saml.reference_invalid"
params = []
remedy = "The signature reference must name the element it is attached to."
since = "0.1.0"

[[entry]]
code = "sso.saml.duplicate_id"
class = "none"
summary = "The sign-in response was refused."
explanation_key = "error.sso.saml.duplicate_id"
params = []
remedy = "The SAML message reuses an XML ID; refuse it."
since = "0.1.0"

[[entry]]
code = "sso.saml.alg_unsupported"
class = "none"
summary = "The sign-in response used a method this tenant does not allow."
explanation_key = "error.sso.saml.alg_unsupported"
params = []
remedy = "Accept only SHA-256 digests and RSA-SHA256 or ECDSA-SHA256 signatures."
since = "0.1.0"

[[entry]]
code = "sso.saml.transform_unsupported"
class = "none"
summary = "The sign-in response was refused."
explanation_key = "error.sso.saml.transform_unsupported"
params = []
remedy = "Accept only the enveloped-signature and exclusive-canonicalisation transforms."
since = "0.1.0"

[[entry]]
code = "sso.saml.digest_mismatch"
class = "none"
summary = "The sign-in response was not trusted."
explanation_key = "error.sso.saml.digest_mismatch"
params = []
remedy = "The signed element was altered after signing; refuse the message."
since = "0.1.0"

[[entry]]
code = "sso.saml.unsigned_assertion"
class = "none"
summary = "The sign-in response was refused."
explanation_key = "error.sso.saml.unsigned_assertion"
params = []
remedy = "The asserted identity is not covered by the verified signature; refuse it."
since = "0.1.0"

[[entry]]
code = "sso.saml.comment_in_value"
class = "none"
summary = "The sign-in response was not trusted."
explanation_key = "error.sso.saml.comment_in_value"
params = []
remedy = "An assertion value was split by a comment or processing instruction; refuse the message."
since = "0.1.0"

[[entry]]
code = "sso.saml.issuer_mismatch"
class = "none"
summary = "The sign-in response was not trusted."
explanation_key = "error.sso.saml.issuer_mismatch"
params = []
remedy = "The response Issuer does not match the configured IdP entity id."
since = "0.1.0"

[[entry]]
code = "sso.saml.conditions_invalid"
class = "none"
summary = "The sign-in response was refused."
explanation_key = "error.sso.saml.conditions_invalid"
params = []
remedy = "The assertion's Conditions are outside the accepted time window."
since = "0.1.0"

[[entry]]
code = "sso.saml.audience_mismatch"
class = "none"
summary = "The sign-in response was not for this application."
explanation_key = "error.sso.saml.audience_mismatch"
params = []
remedy = "The AudienceRestriction must contain this SP entity id."
since = "0.1.0"

[[entry]]
code = "sso.saml.subject_confirmation"
class = "none"
summary = "The sign-in response was refused."
explanation_key = "error.sso.saml.subject_confirmation"
params = []
remedy = "The Subject must carry a bearer SubjectConfirmation."
since = "0.1.0"

[[entry]]
code = "sso.saml.no_authn_statement"
class = "none"
summary = "The sign-in response was incomplete."
explanation_key = "error.sso.saml.no_authn_statement"
params = []
remedy = "The assertion must carry an AuthnStatement."
since = "0.1.0"

[[entry]]
code = "sso.saml.authn_context"
class = "none"
summary = "The sign-in did not meet this tenant's requirements."
explanation_key = "error.sso.saml.authn_context"
params = []
remedy = "Ask the IdP to authenticate with the required AuthnContextClassRef."
since = "0.1.0"

[[entry]]
code = "sso.saml.nameid_invalid"
class = "none"
summary = "This sign-in account cannot be linked."
explanation_key = "error.sso.saml.nameid_invalid"
params = []
remedy = "A transient NameID cannot be used to link an identity."
since = "0.1.0"

[[entry]]
code = "sso.saml.attribute_missing"
class = "none"
summary = "The sign-in response was incomplete."
explanation_key = "error.sso.saml.attribute_missing"
params = []
remedy = "The configured subject attribute is missing from the assertion."
since = "0.1.0"

[[entry]]
code = "sso.saml.replay"
class = "none"
summary = "This sign-in response has already been used."
explanation_key = "error.sso.saml.replay"
params = []
remedy = "Refuse a replayed assertion; the assertion id is single use."
since = "0.1.0"

[[entry]]
code = "sso.saml.provider_not_configured"
class = "none"
summary = "That sign-in method is not available."
explanation_key = "error.sso.saml.provider_not_configured"
params = []
remedy = "The assertion's Issuer is not a configured identity provider."
since = "0.1.0"

[[entry]]
code = "sso.saml.signing_key_missing"
class = "none"
summary = "The sign-in could not be prepared."
explanation_key = "error.sso.saml.signing_key_missing"
params = []
remedy = "Name the SP signing key in spot-secrets, or turn off request signing."
since = "0.1.0"

[[entry]]
code = "sso.saml.slo_not_a_request"
class = "none"
summary = "The sign-out request was refused."
explanation_key = "error.sso.saml.slo_not_a_request"
params = []
remedy = "The request root must be a samlp:LogoutRequest."
since = "0.1.0"

[[entry]]
code = "sso.saml.slo_destination_mismatch"
class = "none"
summary = "The sign-out request was refused."
explanation_key = "error.sso.saml.slo_destination_mismatch"
params = []
remedy = "The LogoutRequest Destination must be this service provider's SLO URL."
since = "0.1.0"

[[entry]]
code = "sso.saml.slo_expired"
class = "none"
summary = "The sign-out request has taken too long."
explanation_key = "error.sso.saml.slo_expired"
params = []
remedy = "The LogoutRequest NotOnOrAfter has passed; refuse it and let the provider retry."
since = "0.1.0"

[[entry]]
code = "sso.saml.slo_lifetime_excessive"
class = "none"
summary = "The sign-out request was refused."
explanation_key = "error.sso.saml.slo_lifetime_excessive"
params = []
remedy = "The LogoutRequest NotOnOrAfter lies further ahead than this tenant allows; refuse it."
since = "0.1.0"

[[entry]]
code = "sso.saml.slo_replay"
class = "none"
summary = "This sign-out request has already been used."
explanation_key = "error.sso.saml.slo_replay"
params = []
remedy = "Refuse a replayed LogoutRequest; the request ID is single use."
since = "0.1.0"

[[entry]]
code = "sso.saml.slo_name_id_missing"
class = "none"
summary = "The sign-out request was incomplete."
explanation_key = "error.sso.saml.slo_name_id_missing"
params = []
remedy = "A LogoutRequest must carry a non-empty saml:NameID."
since = "0.1.0"

[[entry]]
code = "sso.saml.slo_endpoint_missing"
class = "none"
summary = "This sign-in method cannot sign you out here."
explanation_key = "error.sso.saml.slo_endpoint_missing"
params = []
remedy = "Set the service provider's single-logout URL before accepting IdP-initiated logout."
since = "0.1.0"
