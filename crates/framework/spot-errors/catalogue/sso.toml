[[entry]]
code = "sso.saml.xml_invalid"
class = "none"
summary = "The sign-in response could not be read."
explanation_key = "error.sso.saml.xml_invalid"
params = []
remedy = "Check the identity provider sends well-formed SAML XML."
since = "0.1.0"

[[entry]]
code = "sso.saml.not_a_response"
