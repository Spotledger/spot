[package]
name = "spot-mgmt-api"
description = "The management API server library (WP-ADM-01.T4, ADR-44, ADR-097): the axum router for the management API contract, mutual TLS with the operator CA, signed-command intake with the durable nonce store, per-operation authorisation, the command lifecycle and an audit record for every outcome"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# `Clock`: time is an argument; the server reads time only through it.
spot-core = { path = "../spot-core" }
# The typed operation catalogue the API serves and validates against.
spot-mgmt-ops = { path = "../spot-mgmt-ops" }
# The signed command envelope, its verifier and the nonce port (verification is used, not re-implemented).
spot-signed-command = { path = "../spot-signed-command" }
# Signature bytes of the wire envelope (`Signature::from_bytes`); same spec as the signed-command crate.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# The axum/hyper edge, exactly as `spot-sync-http` uses it for its mutual-TLS listener.
axum = { version = "0.8.9", features = ["http2"] }
hyper = { version = "1.11", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.47", features = ["macros", "net", "rt", "sync", "time", "io-util"] }
# Mutual TLS: `ring` chosen explicitly (no process-default provider needed), TLS 1.3 only.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# The subject of a presented client certificate (the operator allow-list key).
x509-parser = "0.18"
# Certificate fingerprints and the idempotency body digest.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Signature encoding on the wire (base64url, no padding).
base64 = "0.22"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util"] }
# Throwaway CAs and certificates for the mTLS tests. Test-only, never shipped.
rcgen = "0.14"
time = "0.3"
tower = { version = "0.5", features = ["util"] }
# Signs test envelopes.
spot-signed-command = { path = "../spot-signed-command", features = ["testing"] }

[lints]
workspace = true
