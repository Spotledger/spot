doctype = "sales_invoice"
field = "status"
level = "read"
flags = ["report"]
kinds = ["follows_doctype"]

[[scenarios]]
name = "an unprotected field is hidden without read"
principal = { user = "dave", roles = [] }
doctype = "sales_invoice"
field = "status"
level = "hidden"
flags = []
