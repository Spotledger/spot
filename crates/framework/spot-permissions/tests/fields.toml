# The field permission matrix, read by tests/fields.rs (one test reads this file).
#
# A row names a principal (as in matrix.toml), the DocType and field, the document facts and
# the expectation: the `level` (`hidden`, `masked`, `read`, `read_reveal`), the `flags` that
# are true (`create`, `update`, `report`, `reveal`, `reveal_bulk`; the rest are false) and the
# reason `kinds` that spoke (sorted, de-duplicated, `assignment` left out). The groups, masks and
# grants are in tests/common/mod.rs.

version = 1
crate = "spot-permissions"

[[scenarios]]
name = "an unprotected field follows read"
principal = { user = "dave", roles = ["Reader"] }
doctype = "sales_invoice"
field = "status"
level = "read"
flags = []
kinds = ["follows_doctype"]

[[scenarios]]
name = "an unprotected field follows write"
principal = { user = "dave", roles = ["Writer"] }
doctype = "sales_invoice"
field = "status"
level = "read"
flags = ["update"]
kinds = ["follows_doctype"]

[[scenarios]]
name = "an unprotected field follows create"
principal = { user = "dave", roles = ["Creator"] }
doctype = "sales_invoice"
field = "status"
level = "read"
flags = ["create"]
kinds = ["follows_doctype"]

[[scenarios]]
name = "an unprotected field follows report"
