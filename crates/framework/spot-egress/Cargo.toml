[package]
name = "spot-egress"
description = "Outbound network policy: egress filter for scripts, WASM apps, webhooks, connectors, mail, templates and the PDF renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
spot-core = { path = "../spot-core" }
hyper = { version = "1.11", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.47", features = ["net", "time", "sync", "rt", "macros"] }
url = "2"
ipnet = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
time = { version = "0.3", features = ["macros"] }
# `ring` is chosen explicitly (as in spot-postgres and spot-mail): rustls panics when two crypto
# providers are enabled in one build and none is installed.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }

[features]
tls = ["rustls", "tokio-rustls", "webpki-roots"]
default = ["tls"]

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util", "test-util"] }
proptest = "1"

[lints]
workspace = true
