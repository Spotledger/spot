# Cloud metadata endpoints to deny by default
# Each endpoint is a known cloud provider's metadata service that must not be accessible

[[host]]
addr = "169.254.169.254"
provider = "AWS"
description = "EC2 instance metadata service"

[[host]]
addr = "169.254.170.2"
provider = "GCP"
description = "Google Cloud metadata service (secondary)"

[[host]]
addr = "168.63.129.16"
provider = "Azure"
description = "Azure instance metadata service"

[[host]]
addr = "100.100.100.200"
provider = "Alibaba"
description = "Alibaba Cloud metadata service"

[[host]]
addr = "192.0.0.192"
provider = "Google Cloud"
description = "Google Cloud metadata service (alternative)"

[[host]]
addr = "fd00:ec2::254"
provider = "AWS"
description = "EC2 instance metadata service (IPv6)"
