# Help for the docaudit error codes. One [[help]] per code and locale; see
# crates/framework/spot-unattended-support/src/help.rs for the fields.

[[help]]
code = "docaudit.audit_off"
what_happened = "A business document type was marked audit off; only a framework-internal document type audited elsewhere may opt out."
why = "The information given did not meet a rule the system checks before it saves anything."
what_to_do = ["Remove the opt-out from the document type; the audit-off list is fixed in the framework crate.", "If it keeps happening, tell your administrator and quote the code docaudit.audit_off."]
audience = "user"

[[help]]
code = "docaudit.chain"
what_happened = "Appending a document audit event to its lane chain, or verifying a chain, failed."
why = "The system hit a problem of its own that you could not have prevented."
what_to_do = ["Check the audit store; a verification failure means the chain was altered and must be restored from a trusted copy.", "If it keeps happening, tell your administrator and quote the code docaudit.chain."]
audience = "operator"

[[help]]
code = "docaudit.encoding"
what_happened = "A document audit event, a diff or a checkpoint could not be encoded or decoded."
why = "The system hit a problem of its own that you could not have prevented."
what_to_do = ["This is a platform defect; capture the record shape and report it, do not retry blindly.", "If it keeps happening, tell your administrator and quote the code docaudit.encoding."]
audience = "operator"

[[help]]
code = "docaudit.guard"
what_happened = "The field guard refused while building or reading a document audit diff."
why = "The system hit a problem of its own that you could not have prevented."
what_to_do = ["Check the protection facts and the trace sink; a full trace queue with fail-closed withholds the diff.", "If it keeps happening, tell your administrator and quote the code docaudit.guard."]
audience = "operator"

[[help]]
code = "docaudit.lane_epoch"
what_happened = "The lane count or epoch of a site checkpoint does not match the configured lanes, so the chains cannot be bound."
why = "The information given did not meet a rule the system checks before it saves anything."
what_to_do = ["Changing the lane count needs a new epoch; sign a fresh site checkpoint under the new epoch.", "If it keeps happening, tell your administrator and quote the code docaudit.lane_epoch."]
audience = "user"

[[help]]
code = "docaudit.outbox_write"
what_happened = "The document audit event could not be written to the outbox, so the operation failed closed and nothing was changed."
why = "A service the action needs is not available at the moment."
what_to_do = ["Check the outbox and the database connection, then retry the operation with the same command id.", "If it keeps happening, tell your administrator and quote the code docaudit.outbox_write."]
audience = "admin"

[[help]]
code = "docaudit.unknown_doctype"
what_happened = "The field guard has no protection facts for the document type, so the audit cannot tell which values to mask."
why = "The item asked for does not exist, or you are not allowed to see it."
what_to_do = ["Register the document type's protection facts in the effective metadata before auditing its documents.", "If it keeps happening, tell your administrator and quote the code docaudit.unknown_doctype."]
audience = "user"
