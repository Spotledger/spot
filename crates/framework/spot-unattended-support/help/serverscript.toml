# Help for the serverscript error codes. One [[help]] per code and locale; see
# crates/framework/spot-unattended-support/src/help.rs for the fields.

[[help]]
code = "serverscript.compile_failed"
what_happened = "A Server Script's TypeScript source did not compile."
why = "The information given did not meet a rule the system checks before it saves anything."
what_to_do = ["Fix the reported syntax error on the source field; the diagnostic names the line and column.", "If it keeps happening, tell your administrator and quote the code serverscript.compile_failed."]
audience = "user"

[[help]]
code = "serverscript.limit_exceeded"
what_happened = "A Server Script exceeded one of its limits."
why = "The system hit a problem of its own that you could not have prevented."
what_to_do = ["Make the script faster and lighter, or raise its timeout; the operation was not saved.", "If it keeps happening, tell your administrator and quote the code serverscript.limit_exceeded."]
audience = "operator"

[[help]]
code = "serverscript.phase_violation"
what_happened = "A Server Script did something its lifecycle phase does not allow."
why = "The system hit a problem of its own that you could not have prevented."
what_to_do = ["Move the work to an event whose phase allows it: derive in before_*, check in validate, act in after_*.", "If it keeps happening, tell your administrator and quote the code serverscript.phase_violation."]
audience = "operator"

[[help]]
code = "serverscript.record_invalid"
what_happened = "A Server Script record is missing or malformed."
why = "The information given did not meet a rule the system checks before it saves anything."
what_to_do = ["Give the script a name, a document type, one of the document events and TypeScript source.", "If it keeps happening, tell your administrator and quote the code serverscript.record_invalid."]
audience = "user"

[[help]]
code = "serverscript.store_failed"
what_happened = "The script store could not load or record what it was asked to."
why = "The system hit a problem of its own that you could not have prevented."
what_to_do = ["Report the failure with the request details; the store's backend is unavailable or misconfigured.", "If it keeps happening, tell your administrator and quote the code serverscript.store_failed."]
audience = "operator"

[[help]]
code = "serverscript.elevation_audit_failed"
what_happened = "An elevated run could not be audited, so it was refused or failed; no elevated write happens without an audit entry."
why = "The system hit a problem of its own that you could not have prevented."
what_to_do = ["Check the site's audit chain; the script can be run again once the audit works.", "If it keeps happening, tell your administrator and quote the code serverscript.elevation_audit_failed."]
audience = "operator"

[[help]]
code = "serverscript.elevation_forbidden"
what_happened = "Only a holder of the scripts.elevate permission may elevate a script or edit an elevated one."
why = "Your account does not have the permission this action needs."
what_to_do = ["Ask a holder of the scripts.elevate permission (the Tenant Administrator by default) to make the change.", "If it keeps happening, tell your administrator and quote the code serverscript.elevation_forbidden."]
audience = "user"

[[help]]
code = "serverscript.elevation_not_allowed"
what_happened = "A scheduled script runs as its run_as user and can never be elevated."
why = "The information given did not meet a rule the system checks before it saves anything."
what_to_do = ["Clear the elevated flag; give the run_as user the rights the script needs instead.", "If it keeps happening, tell your administrator and quote the code serverscript.elevation_not_allowed."]
audience = "user"

[[help]]
code = "serverscript.elevation_reason_required"
what_happened = "An elevated script needs a reason of 20 to 500 characters."
why = "The information given did not meet a rule the system checks before it saves anything."
what_to_do = ["State why the script needs to act as the platform, in 20 to 500 characters.", "If it keeps happening, tell your administrator and quote the code serverscript.elevation_reason_required."]
audience = "user"

[[help]]
code = "serverscript.function_conflict"
what_happened = "Two API scripts claim the same function key, so neither is served."
why = "Something with the same identity already exists."
what_to_do = ["Give one of the two scripts a different module or function name; the message names both scripts.", "If it keeps happening, tell your administrator and quote the code serverscript.function_conflict."]
audience = "user"

[[help]]
code = "serverscript.guest_refused"
what_happened = "An API script runs as the signed-in caller, so a guest or a caller with no identity is refused before the script starts."
why = "Your account does not have the permission this action needs."
what_to_do = ["Sign in and call the function again; an API script can never be called by a guest.", "If it keeps happening, tell your administrator and quote the code serverscript.guest_refused."]
audience = "user"

[[help]]
code = "serverscript.run_as_unavailable"
what_happened = "The user a scheduled script runs as is missing or disabled, so the run was refused; it never falls back to a system principal."
why = "The item is in a state that does not allow this action right now."
what_to_do = ["Enable the user named in the script's run_as field, or name another user, then let the next scheduled run proceed.", "If it keeps happening, tell your administrator and quote the code serverscript.run_as_unavailable."]
audience = "user"

[[help]]
code = "serverscript.schedule_invalid"
what_happened = "A scheduled script's cron expression or time zone cannot be scheduled."
why = "The information given did not meet a rule the system checks before it saves anything."
what_to_do = ["Use six cron fields (seconds first) and an IANA zone name such as Asia/Karachi or UTC.", "If it keeps happening, tell your administrator and quote the code serverscript.schedule_invalid."]
audience = "user"
