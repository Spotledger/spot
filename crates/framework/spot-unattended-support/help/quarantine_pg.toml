# Help for the quarantine_pg error codes. One [[help]] per code and locale; see
# crates/framework/spot-unattended-support/src/help.rs for the fields.

[[help]]
code = "quarantine_pg.migration_failed"
what_happened = "The quarantine store's tables could not be created in the database."
why = "The system hit a problem of its own that you could not have prevented."
what_to_do = ["Check that the database user may create tables, triggers and indexes and that the server is reachable, then retry prepare.", "If it keeps happening, tell your administrator and quote the code quarantine_pg.migration_failed."]
audience = "operator"
