# Help for the webhook error codes. One [[help]] per code and locale; see
# crates/framework/spot-unattended-support/src/help.rs for the fields.

[[help]]
code = "webhook.bulkhead_full"
what_happened = "Too many deliveries to this address are in progress at the same time."
why = "A service the action needs is not available at the moment."
what_to_do = ["Wait for concurrent deliveries to complete or increase the bulkhead limit.", "If it keeps happening, tell your administrator and quote the code webhook.bulkhead_full."]
audience = "admin"

[[help]]
code = "webhook.circuit_open"
what_happened = "Deliveries to this address are paused because it kept failing."
why = "A service the action needs is not available at the moment."
what_to_do = ["The delivery will be retried when the circuit breaker allows probes.", "If it keeps happening, tell your administrator and quote the code webhook.circuit_open."]
audience = "admin"

[[help]]
code = "webhook.condition_evaluation_failed"
what_happened = "Webhook condition evaluation failed."
why = "The system hit a problem of its own that you could not have prevented."
what_to_do = ["Fix the condition expression or the event data it references.", "If it keeps happening, tell your administrator and quote the code webhook.condition_evaluation_failed."]
audience = "operator"

[[help]]
code = "webhook.dead_letter"
what_happened = "The webhook is in dead-letter state."
why = "The system hit a problem of its own that you could not have prevented."
what_to_do = ["Review the delivery log, fix the underlying issue, and replay the delivery.", "If it keeps happening, tell your administrator and quote the code webhook.dead_letter."]
audience = "operator"

[[help]]
code = "webhook.delivery_blocked"
what_happened = "The webhook delivery was blocked by egress policy."
why = "Your account does not have the permission this action needs."
what_to_do = ["Contact your administrator to review the egress policy for this destination.", "If it keeps happening, tell your administrator and quote the code webhook.delivery_blocked."]
audience = "user"

[[help]]
code = "webhook.delivery_failed"
what_happened = "The webhook delivery failed after several attempts."
why = "The system hit a problem of its own that you could not have prevented."
what_to_do = ["Check the delivery log for details. The webhook may be in dead-letter state.", "If it keeps happening, tell your administrator and quote the code webhook.delivery_failed."]
audience = "operator"

[[help]]
code = "webhook.delivery_not_found"
what_happened = "The webhook delivery was not found."
why = "The item asked for does not exist, or you are not allowed to see it."
what_to_do = ["Check the delivery ID and try again.", "If it keeps happening, tell your administrator and quote the code webhook.delivery_not_found."]
audience = "user"

[[help]]
code = "webhook.delivery_rate_limited"
what_happened = "The webhook delivery was rate limited."
why = "A service the action needs is not available at the moment."
what_to_do = ["The delivery will be retried automatically after the specified interval.", "If it keeps happening, tell your administrator and quote the code webhook.delivery_rate_limited."]
audience = "admin"

[[help]]
code = "webhook.disabled"
what_happened = "The webhook is disabled."
why = "Your account does not have the permission this action needs."
what_to_do = ["Enable the webhook in the webhook configuration.", "If it keeps happening, tell your administrator and quote the code webhook.disabled."]
audience = "user"

[[help]]
code = "webhook.intake_failed"
