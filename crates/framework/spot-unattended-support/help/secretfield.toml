# Help for the secretfield error codes. One [[help]] per code and locale; see
# crates/framework/spot-unattended-support/src/help.rs for the fields.

[[help]]
code = "secretfield.ambiguous"
what_happened = "More than one record holds this value in a lookup secret field. The field is not unique, so the record cannot be chosen."
why = "The lookup matched several records and nothing says which one is meant."
what_to_do = ["Make the field unique, or find the record another way.", "If it keeps happening, tell your administrator and quote the code secretfield.ambiguous."]
audience = "admin"

[[help]]
code = "secretfield.audit_failed"
what_happened = "The audit row of a secret operation could not be written, so the operation did not happen. Nothing was set, opened or looked up."
why = "Every use of a secret is recorded in the same step as the use itself, and the record could not be stored (the database was unavailable or refused the write)."
what_to_do = ["Try again in a moment.", "If it keeps happening, tell your administrator and quote the code secretfield.audit_failed."]
audience = "operator"

[[help]]
code = "secretfield.duplicate"
what_happened = "Another record already holds this value in a unique lookup secret field."
why = "The field is declared unique and the value is already taken."
what_to_do = ["Choose a different value.", "If it keeps happening, tell your administrator and quote the code secretfield.duplicate."]
audience = "user"

[[help]]
code = "secretfield.empty_value"
what_happened = "An empty value was given for a secret or for a lookup. Empty values are not accepted."
why = "The value was left blank."
what_to_do = ["Give a non-empty value.", "If it keeps happening, tell your administrator and quote the code secretfield.empty_value."]
audience = "user"

[[help]]
code = "secretfield.inconsistent"
what_happened = "A sealed column holds something other than bytes. The row cannot be read safely."
why = "The stored row was written by something other than the engine, or it was damaged."
what_to_do = ["Restore the row from a backup.", "If it keeps happening, tell your administrator and quote the code secretfield.inconsistent."]
audience = "operator"

[[help]]
code = "secretfield.index_failed"
what_happened = "The blind index of a secret could not be derived. The value cannot be looked up without it."
why = "The key provider does not derive blind-index keys, or the key version is out of range."
what_to_do = ["Check that the key provider derives blind-index keys and that the key version is below 256.", "If it keeps happening, tell your administrator and quote the code secretfield.index_failed."]
audience = "operator"

[[help]]
code = "secretfield.invalid_batch"
what_happened = "The rewrap batch size is outside the allowed range. A batch holds between 1 and 500 records."
why = "The requested batch size was below 1 or above 500."
what_to_do = ["Give a batch size between 1 and 500.", "If it keeps happening, tell your administrator and quote the code secretfield.invalid_batch."]
audience = "admin"

[[help]]
code = "secretfield.invalid_definition"
what_happened = "The secret field's definition cannot be read. The field is set up in a way the engine does not understand."
why = "A secret field takes lookup = true or no setting at all."
what_to_do = ["Fix the document type so the field declares only lookup = true.", "If it keeps happening, tell your administrator and quote the code secretfield.invalid_definition."]
audience = "admin"

[[help]]
code = "secretfield.not_configured"
what_happened = "This site has no secrets vault, so secret fields cannot be used. Nothing was sealed or opened."
why = "The engine was started without a vault."
what_to_do = ["Ask your administrator to configure the secrets vault.", "If it keeps happening, tell your administrator and quote the code secretfield.not_configured."]
audience = "operator"

[[help]]
code = "secretfield.not_lookup"
what_happened = "This secret field is not set up to be searched by value."
why = "Only a field declared with lookup = true can be found this way."
what_to_do = ["Declare lookup = true on the field, or find the record another way.", "If it keeps happening, tell your administrator and quote the code secretfield.not_lookup."]
audience = "admin"

[[help]]
code = "secretfield.open_failed"
what_happened = "The stored secret could not be opened. It may have been altered, moved to another record or field, or its key may be gone."
why = "The sealed value no longer matches the record, field or key it was sealed under."
what_to_do = ["Set the secret again; treat the stored value as lost.", "Check the key ring if every value fails, and quote the code secretfield.open_failed if it keeps happening."]
audience = "operator"

[[help]]
code = "secretfield.rewrap_failed"
what_happened = "A stored secret could not be moved onto the current key. The value was left as it was."
why = "The old key or the new key is missing from the key ring."
what_to_do = ["Check the key ring for both key versions and try again.", "If it keeps happening, tell your administrator and quote the code secretfield.rewrap_failed."]
audience = "operator"

[[help]]
code = "secretfield.seal_failed"
what_happened = "The secret could not be sealed, so nothing was stored."
why = "The key provider or the key ring is not available or not usable."
what_to_do = ["Check the key provider and the key ring, then try again.", "If it keeps happening, tell your administrator and quote the code secretfield.seal_failed."]
audience = "operator"

[[help]]
code = "secretfield.unknown_field"
what_happened = "The document type has no secret field with that name. The field may also have been declared twice."
why = "The field name in the request does not match the document type."
what_to_do = ["Name a field that is declared once with type secret.", "If it keeps happening, tell your administrator and quote the code secretfield.unknown_field."]
audience = "user"

[[help]]
code = "secretfield.unsupported_doctype"
what_happened = "Secrets belong to documents. A row in a child table cannot hold one."
why = "The secret field is declared on a child table."
what_to_do = ["Move the secret field to the parent document type.", "If it keeps happening, tell your administrator and quote the code secretfield.unsupported_doctype."]
audience = "admin"
