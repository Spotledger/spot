[package]
name = "spot-rescue"
description = "Down-patches and the supervised restore-and-re-entry rescue tool (WP-MIG-10.T1, ADR-22): the declared down steps of applied patches run in reverse through the apply engine's StepRunner, and a restored pre-migration snapshot is followed by causal, batched re-entry of later documents through the old version with ADR-071 identity, checkpoints and item outcomes, a two-person restore ticket and a final invariant pass before users return"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The site id and the argument-passed time (no clock is read here).
spot-core = { path = "../spot-core" }
# `ApplyStep`/`ApplyStepKind` and the plan digest that a down-patch step is checkpointed under.
spot-migration-plan = { path = "../spot-migration-plan" }
# The apply engine's `StepRunner`, `AdmissionGate` and `SnapshotPort`: rescue drives exactly the
# same seams as apply, and the maintenance gate stays the one switch that admits users.
spot-migration-apply = { path = "../spot-migration-apply" }
# `PatchDecl`: every down-patch comes from the release metadata's declared, reversible patch.
spot-release-meta = { path = "../spot-release-meta" }
# `Principal`: every re-entered operation runs as the identity that originally committed it.
spot-permissions = { path = "../spot-permissions" }
# Stable serde for plans, journal records, items and reports.
serde = { version = "1", features = ["derive"] }
# The original operation payloads (ADR-055 value encoding) and prepared old-version payloads.
serde_json = "1"
# Typed errors with stable `rescue.*` codes.
thiserror = "2"

[dev-dependencies]
# `#[tokio::test]` and a deterministic multi-thread runtime for the kill-and-resume cases.
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
