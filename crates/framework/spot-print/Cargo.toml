[package]
name = "spot-print"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# PDF renderer (WP-PLT-13, SPK-03): Typst embedded as a library. Pinned with `=`
# because the Typst API changes between minor releases. The crates have no
# cargo features to trim (SPK-03). `typst::comemo` is used for cache eviction so
# the comemo version always matches Typst's.
typst = "=0.15.1"
typst-pdf = "=0.15.1"
typst-layout = "=0.15.1"
spot-template = { path = "../spot-template" }
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
time = { version = "0.3.55", default-features = false, features = ["std"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
lopdf = "0.42"
rust_decimal = "1.43"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
