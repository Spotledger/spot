[package]
name = "spot-journal-segment"
description = "The sealed journal segment format (WP-JRN-03.T1, ADR-061 s5): a pure library that writes and reads a segment of journal entries as zstd blocks with per-block SHA-256 checksums, a block index footer and a header that commits to the hash of the previous segment, plus the chain verifier and the sealing policy"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# Block compression (the segment is the cold, recoverable copy of the journal).
zstd = { version = "0.13", default-features = false }
# SHA-256 for block and header/footer checksums and the segment hash (no CRC crate: one primitive).
sha2 = "0.10"
# The feed position (generation, seq) carried by every entry.
spot-events-contract = { path = "../../../contracts/events" }
# Typed errors with stable `journal_segment.*` codes.
thiserror = "2"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
