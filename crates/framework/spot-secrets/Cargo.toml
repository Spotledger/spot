[package]
name = "spot-secrets"
description = "Envelope encryption with versioned keys, key providers, sealed secret values and redaction (WP-SEC-03.T1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
# The blind index: HMAC-SHA256 over a value, keyed by HKDF-SHA256 of the KEK. Both crates are
# already in the workspace tree (spot-auth, spot-audit-chain and others use them).
hmac = "0.12"
rand = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt", "sync"] }
zeroize = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt", "sync", "macros"] }

[lints]
workspace = true
