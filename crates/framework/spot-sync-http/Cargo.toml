[package]
name = "spot-sync-http"
description = "The sync transport binding (WP-EDG-02.T2, ADR-062, ADR-078): edge-initiated HTTP endpoints for hello, pull and push, mutual-TLS node identity through a node directory, long-poll with heartbeats, newline-delimited streaming batches, retries with the resilience kit, and an in-process loopback transport for tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# `Deadline` and `RetryPolicy`: the ADR-072 shapes the T1 crate already carries, reused here so
# the binding and the state machines agree on what a deadline and a backoff are.
spot-sync-protocol = { path = "../spot-sync-protocol" }
# `SourceId` (`<site>#<partition>`, ADR-056) names the stream a batch travels in.
spot-events-contract = { path = "../../../contracts/events" }
# `Clock`: the server reads monotonic time only through an injected clock (time is an argument).
spot-core = { path = "../spot-core" }
# The axum/hyper edge, the router and the body streaming, exactly as `spot-http` uses them.
axum = { version = "0.8.9", features = ["http2"] }
http-body-util = "0.1"
hyper = { version = "1.11", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tokio = { version = "1.47", features = ["macros", "net", "rt", "sync", "time", "io-util"] }
# `ReceiverStream`: the long-poll response is an NDJSON stream fed by a channel.
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
# Stable serde names on the wire; a consumer ignores fields it does not know (ADR-056).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The client certificate's SHA-256 fingerprint (pinning) and the batch framing.
sha2 = "0.10"
# The X.509 subject of a presented client certificate, so the node directory can map it.
x509-parser = "0.18"
# Mutual TLS for node identity (ADR-062 section 3). `ring` is chosen explicitly, as in
# spot-egress and spot-mail: rustls panics when two crypto providers are enabled and none is set.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util", "test-util"] }
# Throwaway CA, server and client certificates for the 127.0.0.1 mTLS tests. Test-only, never
# shipped; already in the workspace lock via spot-mail's and spot-sso's dev-dependencies.
rcgen = "0.14"
# The manual clock's origin, so a deadline test is deterministic.
time = "0.3"

[lints]
workspace = true
