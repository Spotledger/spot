[package]
name = "spot-lineage"
description = "Traceability and lineage queries (WS8, WP-DAG-05.T1, ADR-50): the named business questions (document chain, batch trace, BOM explosion, where-used) compiled to permission-aware graph queries over spot-graph-query, with a per-DocType chain configuration in the metadata text form and an independent in-memory oracle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The typed, permission-aware graph query API every lineage query compiles to.
spot-graph-query = { path = "../spot-graph-query" }
# Edge types by canonical name, compiled to storage steps (for the oracle and plan inspection).
spot-graph-model = { path = "../spot-graph-model" }
# The record ids, names and typed values the queries and results carry.
spot-storage-contract = { path = "../../../contracts/storage" }
# The read decision the oracle applies, node by node.
spot-permissions = { path = "../spot-permissions" }
# Typed errors with stable `lineage.*` codes.
thiserror = "2"
# The chain configuration is metadata text (TOML), parsed as data, never hand-built.
toml = "0.9"

[dev-dependencies]
# Fixtures: the in-memory backend and its traversal.
spot-storage-fake = { path = "../../backends/spot-storage-fake" }
# Effective metadata for the graph model and the permission snapshot in tests.
spot-meta = { path = "../spot-meta" }
# Exact decimal fixtures for the bill-of-materials tests, the same parser the money layer uses.
spot-money = { path = "../spot-money" }
# Randomised acyclic document graphs for the property test.
proptest = "1"

[lints]
workspace = true
