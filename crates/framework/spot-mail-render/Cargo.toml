[package]
name = "spot-mail-render"
description = "Named e-mail templates (subject, text and HTML bodies) loaded from the site's and the apps' template folders and rendered with spot-template into an OutgoingMessage, with per-locale fallback (WP-PLT-11.T14)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The sandboxed engine every body and subject renders through.
spot-template = { path = "../spot-template" }
# `OutgoingMessage` and `Mailbox`.
spot-mail = { path = "../spot-mail" }
# The preview command's JSON context.
serde_json = "1"
# `$decimal`, `$date` and `$datetime` context values: exact, never a float.
rust_decimal = { version = "1", default-features = false, features = ["std"] }
time = { version = "0.3", features = ["parsing", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[lints]
workspace = true
