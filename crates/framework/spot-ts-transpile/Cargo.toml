[package]
name = "spot-ts-transpile"
description = "Spotledger TypeScript transpiler (WP-EXT-08.T2): strips types to plain JavaScript on save with source maps, per ADR-054 step 2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
oxc_allocator = "0.153.0"
oxc_ast = "0.153.0"
oxc_ast_visit = "0.153.0"
oxc_codegen = "0.153.0"
oxc_diagnostics = "0.153.0"
oxc_parser = "0.153.0"
oxc_sourcemap = "9"
oxc_span = "0.153.0"
oxc_transformer = "0.153.0"
oxc_semantic = "0.153.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true