[package]
name = "spot-dag"
description = "Spotledger DAG definition layer (WS8, WP-DAG-01, ADR-13): typed model, validation with stable dag.* codes, in-memory compiler with deterministic ready-set, content hash and version registry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# Model serialisation (JSON only; `arbitrary_precision` is deliberately off so
# a float number can never round-trip silently — it is rejected by the model).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SHA-256 content hashing (WP-DAG-01 §4).
sha2 = "0.10"
# Typed errors with stable `dag.*` codes.
thiserror = "2"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true