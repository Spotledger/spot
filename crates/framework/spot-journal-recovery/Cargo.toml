[package]
name = "spot-journal-recovery"
description = "The per-tenant recovery report built from real inputs (WP-JRN-07.T3, ADR-061 s8 and s9): journal target, durability policy, verification history, snapshots, key backup, exclusions and the chain check, read through traits, and the single 'could I recover this tenant?' verdict with named blockers whose reasons are catalogue keys with parameters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The report model the inputs reuse (position, journal target, durability policy, key backup
# status, exclusion reason, blob cross-check).
spot-journal-audit = { path = "../spot-journal-audit" }
# The verification driver and its report: the chain and manifest findings.
spot-journal-verify = { path = "../spot-journal-verify" }
# The signed manifest's verifying keys, an argument of the verification.
spot-journal-manifest = { path = "../spot-journal-manifest" }
# Listing the snapshots.
spot-journal-snapshot = { path = "../spot-journal-snapshot" }
# The object-store seam.
spot-journal-store = { path = "../spot-journal-store" }
# The report and the verdict are plain data with a stable JSON form.
serde = { version = "1", features = ["derive"] }
# Typed errors with stable `journal_recovery.*` codes.
thiserror = "2"

[dev-dependencies]
# The golden JSON is read back and searched.
serde_json = "1"
# Drives the boxed store futures in tests without an async runtime.
futures = "0.3"

[lints]
workspace = true
