[package]
name = "spot-audit-store"
description = "The PostgreSQL audit store (WP-AI-11.T2): an append-only chain with a compare-and-set head, a database role that cannot rewrite history and a trigger that refuses to, the agent decision sink, the scheduled verification job and the review digest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The chain, its records, entries, checkpoints and the contract suite this store must pass.
spot-audit-chain = { path = "../../framework/spot-audit-chain" }
# The decision sink and the authoriser the audited wrapper drives.
spot-agent-tiers = { path = "../../framework/spot-agent-tiers" }
# The job handler result the verification body returns.
spot-jobs = { path = "../../framework/spot-jobs" }
# `AppenderStore`, the durable state of the lane appender this crate implements (WP-AI-11.T5), and
# `SiteCheckpoint`, the signed value it stores.
spot-doc-audit = { path = "../../framework/spot-doc-audit" }
# The one shared blocking bridge the synchronous `AppenderStore` reaches the database through
# (ADR-082 addendum 1, class C).
spot-pg-bridge = { path = "../spot-pg-bridge" }
# `FeedPosition`, the outbox bookmark the appender stores.
spot-storage-contract = { path = "../../../contracts/storage" }
# The pool the caller builds; this store owns its SQL objects and the `spot_audit_app` role.
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-time-0_3"] }
# A bounded channel between the synchronous decision sink and the drain.
tokio = { version = "1", default-features = false, features = ["sync"] }
# Records and checkpoints are persisted as JSON; the canonical hash is recomputed from them.
serde_json = "1"

[dev-dependencies]
# The migrator the audit tables must pass (its live-schema reader and planner).
spot-pg-migrate = { path = "../spot-pg-migrate" }
# Per-test scratch databases and a raw client for the superuser tamper path.
spot-postgres = { path = "../spot-postgres", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
