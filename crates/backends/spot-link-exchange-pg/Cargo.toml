[package]
name = "spot-link-exchange-pg"
description = "PostgreSQL stores for link exchange (WP-CTL-10.T3, ADR-058 rules 8, 9, 13 and 14): the sender outbox with its producer events, the receiver inbox with parking, the delivery notice feed with a gapless commit-ordered cursor, and the retention sweep, all in the tenant's own schema, with the delivery notice appended in the same transaction as the inbox write"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The `OutboxStore`, `InboxStore` and `NoticeFeed` ports this crate implements, and the entry,
# message and notice types they carry.
spot-link-exchange = { path = "../../framework/spot-link-exchange" }
# `LinkId`, `Party`, `Topic`, the audit port and the signer the retention sweep builds an
# `Outbox` and `Inbox` from.
spot-tenant-link = { path = "../../framework/spot-tenant-link" }
# `TenantId`: the tenant a store belongs to, and the schema name derived from it.
spot-tenancy = { path = "../../framework/spot-tenancy" }
# `AppError`, for the schema-preparation code.
spot-app-api = { path = "../../../contracts/app-api" }
# `JobHandlerRegistry`: the retention sweep registers itself as a job.
spot-jobs = { path = "../../framework/spot-jobs" }
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
# The runtime the synchronous store traits block on while awaiting the database.
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync"] }
uuid = { version = "1.26", default-features = false, features = ["std", "v7"] }
serde = "1"
serde_json = "1"

[dev-dependencies]
# The migrator the tables must pass (its live-schema reader and planner).
spot-pg-migrate = { path = "../spot-pg-migrate" }
# The empty catalogue the migrator plans against.
spot-storage-contract = { path = "../../../contracts/storage" }
spot-postgres = { path = "../spot-postgres", features = ["testing"] }
spot-iam-access = { path = "../../framework/spot-iam-access" }
spot-audit-chain = { path = "../../framework/spot-audit-chain" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
