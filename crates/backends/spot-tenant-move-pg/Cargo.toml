[package]
name = "spot-tenant-move-pg"
description = "PostgreSQL implementation of the tenant-move store (WP-CTL-02.T2, ADR-082 class C): the persisted move record and its state history in the control schema, reached through the shared blocking bridge."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The `MoveStore` trait, `MoveRecord` and the stable `tenant_move.*` errors this crate returns.
spot-tenant-move = { path = "../../framework/spot-tenant-move" }
# `TenantId`: the key of a move.
spot-tenancy = { path = "../../framework/spot-tenancy" }
# The one shared blocking bridge (ADR-082 addendum 1); this crate never writes its own `block_on`.
spot-pg-bridge = { path = "../spot-pg-bridge" }
# The pool whose size the constructor validates the bridge against.
deadpool-postgres = "0.14"
# The driver: transactions, SQLSTATE codes.
tokio-postgres = "0.7"
# The record's existing serde form is the stored document; no second encoding.
serde_json = "1"
# The constructor asks the ambient runtime flavor (a current-thread runtime is refused).
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
# Per-test scratch databases.
spot-postgres = { path = "../spot-postgres", features = ["testing"] }
# The setup runtime that prepares and inspects the scratch database from outside the bridge.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

# The fake `FingerprintSource` of the abort test names its `Fingerprint` type.
spot-rehearsal = { path = "../../framework/spot-rehearsal" }

[lints]
workspace = true
