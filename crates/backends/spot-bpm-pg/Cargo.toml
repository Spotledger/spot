[package]
name = "spot-bpm-pg"
description = "PostgreSQL CaseStore for the BPM engine (WP-BPM-02.T2): durable spot_bpm_case, spot_bpm_case_var and spot_bpm_node_outcome tables, an exactly-once node-outcome guard, and the job and scheduler adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The `CaseStore`/`CaseStoreFactory` traits, the Case record types and the job adapter types.
spot-bpm-engine = { path = "../../framework/spot-bpm-engine" }
# The DAG run state (`Run`, `RunPlan`, `Transition`, `Step`) the Case wraps.
spot-dag-exec = { path = "../../framework/spot-dag-exec" }
# `NodeId` and the compiled-graph types the run pins.
spot-dag = { path = "../../framework/spot-dag" }
# `AppError`/`ErrorClass` for the schema-migration error and the `OffsetDateTime` instants.
spot-app-api = { path = "../../../contracts/app-api" }
# The job engine types the jobs adapter enqueues through.
spot-jobs = { path = "../../framework/spot-jobs" }
# The PostgreSQL job store the jobs adapter writes to (WP-PLT-06.T2).
spot-jobs-pg = { path = "../spot-jobs-pg" }
# The scheduler's lease/fence model the timer adapter is guarded by (WP-PLT-07).
spot-scheduler = { path = "../../framework/spot-scheduler" }
# The connection pool the caller builds; the store owns its three tables.
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-time-0_3", "with-serde_json-1"] }
# The node state and output payloads are stored as jsonb.
serde_json = "1"
time = "0.3.55"

[dev-dependencies]
# The migrator the tables must pass (its live-schema reader and planner).
spot-pg-migrate = { path = "../spot-pg-migrate" }
# The empty catalogue the migrator plans against.
spot-storage-contract = { path = "../../../contracts/storage" }
# Per-test scratch databases and a raw client for the plan and transaction-age checks.
spot-postgres = { path = "../spot-postgres", features = ["testing"] }
# `from_text`, to build the process a Case runs for the end-to-end tests.
spot-bpm-model = { path = "../../framework/spot-bpm-model" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }
# The scheduler's instants, to acquire a lease in the adapter tests.
jiff = { version = "0.2", default-features = false, features = ["std"] }

[lints]
workspace = true
