[package]
name = "spot-event-stream-pg"
description = "PostgreSQL ConsumerStore for the event stream engine (WP-INT-02.T2): durable consumer records and per-partition checkpoints and parking, a compare-and-set advance, tenant (site) scoped, with the shared contract suite and race tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The ConsumerStore trait, the record type and the error vocabulary this store implements.
spot-event-stream = { path = "../../framework/spot-event-stream" }
# `Position` (generation, seq) of a checkpoint.
spot-events-contract = { path = "../../../contracts/events" }
# A database failure is reported as a storage error inside `StreamError::Feed`.
spot-storage-contract = { path = "../../../contracts/storage" }
# `AppError`/`ErrorClass` for the schema-migration error.
spot-app-api = { path = "../../../contracts/app-api" }
# Every statement is scoped by the site.
spot-core = { path = "../../framework/spot-core" }
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-time-0_3", "with-serde_json-1"] }
# The consumer definition is stored as jsonb.
serde_json = "1"
time = "0.3.55"

[dev-dependencies]
spot-event-stream = { path = "../../framework/spot-event-stream", features = ["testing"] }
spot-postgres = { path = "../spot-postgres", features = ["testing"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
