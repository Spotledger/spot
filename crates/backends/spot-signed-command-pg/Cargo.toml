[package]
name = "spot-signed-command-pg"
description = "PostgreSQL NonceStore (WP-ADM-01.T3, ADR-082): the signed-command replay window kept in one table, claimed by one atomic statement, so a command cannot be replayed after a restart or on another node, and a store that cannot answer refuses the command"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The `NonceStore` port, `KeyId`, `StoreError` and the default skew this store implements.
spot-signed-command = { path = "../../framework/spot-signed-command" }
# The connection pool the caller builds; the store owns its one table.
deadpool-postgres = "0.14"
tokio-postgres = "0.7"

[dev-dependencies]
# The contract suite every nonce store must pass.
spot-signed-command = { path = "../../framework/spot-signed-command", features = ["testing"] }
# The migrator the table must pass (its live-schema reader and planner).
spot-pg-migrate = { path = "../spot-pg-migrate" }
spot-storage-contract = { path = "../../../contracts/storage" }
# Per-test scratch databases and a raw client for the schema checks.
spot-postgres = { path = "../spot-postgres", features = ["testing"] }
# Every setup code has a catalogue entry.
spot-errors = { path = "../../framework/spot-errors" }
# The command parameters in the verifier test.
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
