id = "rnd-01-insert-int"
rule = "SEM-RND-01"
title = "int edge values written by insert read back through query and read"
setup = ['e0 code="t:e0" qty="i:9223372036854775807"', 'e1 code="t:e1" qty="i:-9223372036854775808"', 'e2 code="t:e2" qty="i:0"', 'e3 code="t:e3" qty="i:-1"', 'e4 code="t:e4" qty="i:1"']
