# Document-level round trips: every value kind at its edge values, written by insert and by update,
# read back by load, query (in a transaction) and read (outside one).

[[case]]
id = "rnd-01-insert-text"
rule = "SEM-RND-01"
title = "text edge values written by insert read back through query and read"
setup = ['e0 code="t:e0" note="t:"', 'e1 code="t:e1" note="t:  "', 'e2 code="t:e2" note="t:\u{301}\u{301}"', 'e3 code="t:e3" note="trep:38:9"', 'e4 code="t:e4" note="t:\u{1F600}x"', 'e5 code="t:e5" note="trep:1000:x"', 'e6 code="t:e6" note="t:Ali"']
op = "query"
query = { select = ["note"], filter = '(prefix code "e")', order = ["code"] }
expect = { rows = [["t:"], ["t:  "], ["t:́́"], ["trep:38:9"], ["t:😀x"], ["trep:1000:x"], ["t:Ali"]] }

[[case]]
id = "rnd-01-load-text"
rule = "SEM-RND-01"
title = "the first text edge value written by insert reads back through load"
setup = ['e0 code="t:e0" note="t:"']
op = "load"
doc = "e0"
fields = ["note"]
expect = { rows = [["t:"]] }

[[case]]
id = "rnd-02-update-text"
rule = "SEM-RND-02"
title = "text edge values written by update read back through query and read"
setup = ['e0 code="t:e0"', 'e1 code="t:e1"', 'e2 code="t:e2"', 'e3 code="t:e3"', 'e4 code="t:e4"', 'e5 code="t:e5"', 'e6 code="t:e6"', 'update e0 note="t:"', 'update e1 note="t:  "', 'update e2 note="t:\u{301}\u{301}"', 'update e3 note="trep:38:9"', 'update e4 note="t:\u{1F600}x"', 'update e5 note="trep:1000:x"', 'update e6 note="t:Ali"']
op = "query"
query = { select = ["note"], filter = '(prefix code "e")', order = ["code"] }
expect = { rows = [["t:"], ["t:  "], ["t:́́"], ["trep:38:9"], ["t:😀x"], ["trep:1000:x"], ["t:Ali"]] }

[[case]]
id = "rnd-02-load-text"
rule = "SEM-RND-02"
title = "a text edge value replaced by update reads back through load"
setup = ['e0 code="t:e0" note="t:  "', 'update e0 note="t:"']
op = "load"
doc = "e0"
fields = ["note"]
expect = { rows = [["t:"]] }

