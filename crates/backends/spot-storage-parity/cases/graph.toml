# Graph traversal (SEM-GRA-01..08, contracts/storage graph.rs). Every case runs on the fake and on PostgreSQL.
# The expected nodes were computed by an independent reference traversal; an id orders by the
# moment its name is first mentioned (setup lines in order, then the start nodes).

[[case]]
id = "gra-01-a-chain-reports-each-node-once-at-its-depth"
rule = "SEM-GRA-01"
title = "a chain a to d gives each node once at its depth, the start at 0"
catalog = "graph"
setup = [
  'd code="t:d"',
  'c code="t:c" next="id:d"',
  'b code="t:b" next="id:c"',
  'a code="t:a" next="id:b"',
]
op = "traverse"
traversal = { start = ["item:a"], edges = ["item.next"], direction = "out", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:a@0", "item:b@1<a:next", "item:c@2<b:next", "item:d@3<c:next"] }

[[case]]
id = "gra-01-a-shortcut-gives-the-smaller-depth"
rule = "SEM-GRA-01"
title = "c is reachable at depth 1 through ref and at depth 2 through next: reported once, at 1"
catalog = "graph"
setup = [
  'c code="t:c"',
  'b code="t:b" next="id:c"',
  'a code="t:a" next="id:b" ref="id:c"',
]
op = "traverse"
traversal = { start = ["item:a"], edges = ["item.next", "item.ref"], direction = "out", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:a@0", "item:c@1<a:ref", "item:b@1<a:next"] }

[[case]]
id = "gra-01-a-missing-start-node-is-omitted"
rule = "SEM-GRA-01"
title = "a start node that does not exist is left out, the other one is reported"
catalog = "graph"
setup = [
  'b code="t:b"',
  'a code="t:a" next="id:b"',
]
op = "traverse"
traversal = { start = ["item:a", "item:zz"], edges = ["item.next"], direction = "out", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:a@0", "item:b@1<a:next"] }

[[case]]
id = "gra-01-only-missing-start-nodes-give-an-empty-result"
rule = "SEM-GRA-01"
title = "when no start node exists the result is empty"
catalog = "graph"
setup = [
  'b code="t:b"',
  'a code="t:a" next="id:b"',
]
op = "traverse"
traversal = { start = ["item:q", "item:r"], edges = ["item.next"], direction = "out", max_depth = 5, max_nodes = 100 }
expect = { nodes = [] }

[[case]]
id = "gra-01-two-starts-whose-frontiers-meet-report-the-node-once"
rule = "SEM-GRA-01"
title = "two start nodes pointing at one node: it is reported once, the smaller start is its predecessor"
catalog = "graph"
setup = [
  'x code="t:x"',
  'b code="t:b" next="id:x"',
  'a code="t:a" next="id:x"',
]
op = "traverse"
traversal = { start = ["item:a", "item:b"], edges = ["item.next"], direction = "out", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:b@0", "item:a@0", "item:x@1<b:next"] }

[[case]]
id = "gra-01-a-start-inside-the-reach-of-another-stays-at-depth-zero"
rule = "SEM-GRA-01"
title = "a start node that another start reaches stays at depth 0"
catalog = "graph"
setup = [
  'c code="t:c"',
  'b code="t:b" next="id:c"',
  'a code="t:a" next="id:b"',
]
op = "traverse"
traversal = { start = ["item:a", "item:b"], edges = ["item.next"], direction = "out", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:b@0", "item:a@0", "item:c@1<b:next"] }

[[case]]
id = "gra-01-a-deleted-node-is-no-longer-reachable"
rule = "SEM-GRA-01"
title = "a was deleted: incoming from b gives b only"
catalog = "graph"
setup = [
  'c code="t:c"',
  'b code="t:b" next="id:c"',
  'a code="t:a" next="id:b"',
  'delete a',
]
op = "traverse"
traversal = { start = ["item:b"], edges = ["item.next"], direction = "in", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:b@0"] }

[[case]]
id = "gra-01-a-traversal-sees-the-transactions-own-writes"
rule = "SEM-GRA-01"
title = "z is inserted in the same transaction as the traversal and is walked from"
catalog = "graph"
setup = [
  'b code="t:b"',
  'a code="t:a" next="id:b"',
]
write = [
  'z code="t:z" next="id:a"',
]
op = "traverse"
traversal = { start = ["item:z"], edges = ["item.next"], direction = "out", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:z@0", "item:a@1<z:next", "item:b@2<a:next"] }

[[case]]
id = "gra-02-nodes-of-one-depth-come-in-id-order"
rule = "SEM-GRA-02"
title = "three nodes pointing at the hub come back in id order, which is creation order here"
catalog = "graph"
setup = [
  'hub code="t:hub"',
  'b code="t:b" next="id:hub"',
  'c code="t:c" next="id:hub"',
  'd code="t:d" next="id:hub"',
]
op = "traverse"
traversal = { start = ["item:hub"], edges = ["item.next"], direction = "in", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:hub@0", "item:b@1<hub:next", "item:c@1<hub:next", "item:d@1<hub:next"] }

[[case]]
id = "gra-02-the-order-is-the-id-not-the-name"
rule = "SEM-GRA-02"
title = "created d, c, b the ids order d, c, b: the result follows the id, not the alphabet"
catalog = "graph"
setup = [
  'hub code="t:hub"',
  'd code="t:d" next="id:hub"',
  'c code="t:c" next="id:hub"',
  'b code="t:b" next="id:hub"',
]
op = "traverse"
traversal = { start = ["item:hub"], edges = ["item.next"], direction = "in", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:hub@0", "item:d@1<hub:next", "item:c@1<hub:next", "item:b@1<hub:next"] }

[[case]]
id = "gra-02-depth-comes-before-entity-and-id"
rule = "SEM-GRA-02"
title = "the start item, then depth 1 (item before party), then depth 2"
catalog = "graph"
setup = [
  'p code="t:p" @entity=party',
  'b code="t:b" owner="id:p"',
  'a code="t:a" next="id:b" owner="id:p"',
]
op = "traverse"
traversal = { start = ["item:a"], edges = ["item.next", "item.owner"], direction = "out", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:a@0", "item:b@1<a:next", "party:p@1<a:owner"] }

[[case]]
id = "gra-02-entity-orders-nodes-of-equal-depth"
rule = "SEM-GRA-02"
title = "item sorts before party at the same depth"
catalog = "graph"
setup = [
  'p code="t:p" @entity=party',
  'a code="t:a" owner="id:p"',
  'b code="t:b" next="id:a"',
]
op = "traverse"
traversal = { start = ["item:b"], edges = ["item.next", "item.owner"], direction = "both", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:b@0", "item:a@1<b:next", "party:p@2<a:owner"] }

[[case]]
id = "gra-03-the-smaller-predecessor-wins-a-diamond"
rule = "SEM-GRA-03"
title = "p1 and p2 both reach t at depth 2: the predecessor is the one with the smaller id"
catalog = "graph"
setup = [
  't code="t:t"',
  'p1 code="t:p1" next="id:t"',
  'p2 code="t:p2" next="id:t"',
  's code="t:s" next="id:p1" ref="id:p2"',
]
op = "traverse"
traversal = { start = ["item:s"], edges = ["item.next", "item.ref"], direction = "out", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:s@0", "item:p1@1<s:next", "item:p2@1<s:ref", "item:t@2<p1:next"] }

[[case]]
id = "gra-03-the-smaller-id-not-the-smaller-name-wins"
rule = "SEM-GRA-03"
title = "created p2 first, so p2 has the smaller id and is the predecessor although its name is larger"
catalog = "graph"
setup = [
  't code="t:t"',
  'p2 code="t:p2" next="id:t"',
  'p1 code="t:p1" next="id:t"',
  's code="t:s" next="id:p1" ref="id:p2"',
]
op = "traverse"
traversal = { start = ["item:s"], edges = ["item.next", "item.ref"], direction = "out", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:s@0", "item:p2@1<s:ref", "item:p1@1<s:next", "item:t@2<p2:next"] }

[[case]]
id = "gra-03-the-via-names-the-edge-type-used"
rule = "SEM-GRA-03"
title = "the predecessor reached t through ref, and the via says ref"
catalog = "graph"
setup = [
  't code="t:t"',
  'p1 code="t:p1" ref="id:t"',
  'p2 code="t:p2" next="id:t"',
  's code="t:s" next="id:p1" ref="id:p2"',
]
op = "traverse"
traversal = { start = ["item:s"], edges = ["item.next", "item.ref"], direction = "out", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:s@0", "item:p1@1<s:next", "item:p2@1<s:ref", "item:t@2<p1:ref"] }

[[case]]
id = "gra-04-a-cycle-of-three-terminates"
rule = "SEM-GRA-04"
title = "a to b to c to a: each node once"
catalog = "graph"
setup = [
  'a code="t:a"',
  'b code="t:b"',
  'c code="t:c"',
  'update a next="id:b"',
  'update b next="id:c"',
  'update c next="id:a"',
]
op = "traverse"
traversal = { start = ["item:a"], edges = ["item.next"], direction = "out", max_depth = 10, max_nodes = 100 }
expect = { nodes = ["item:a@0", "item:b@1<a:next", "item:c@2<b:next"] }

[[case]]
id = "gra-04-a-cycle-backwards"
rule = "SEM-GRA-04"
title = "the three-cycle followed backwards from a gives c then b"
catalog = "graph"
setup = [
  'a code="t:a"',
  'b code="t:b"',
  'c code="t:c"',
  'update a next="id:b"',
  'update b next="id:c"',
  'update c next="id:a"',
]
op = "traverse"
traversal = { start = ["item:a"], edges = ["item.next"], direction = "in", max_depth = 10, max_nodes = 100 }
expect = { nodes = ["item:a@0", "item:c@1<a:next", "item:b@2<c:next"] }

[[case]]
id = "gra-04-a-self-loop-reports-nothing-twice"
rule = "SEM-GRA-04"
title = "a points at itself: the start is reported once"
catalog = "graph"
setup = [
  'a code="t:a"',
  'update a next="id:a"',
]
op = "traverse"
traversal = { start = ["item:a"], edges = ["item.next"], direction = "out", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:a@0"] }

[[case]]
id = "gra-04-a-two-cycle-with-both-directions"
rule = "SEM-GRA-04"
title = "a and b point at each other, followed both ways: two nodes, once each"
catalog = "graph"
setup = [
  'a code="t:a"',
  'b code="t:b"',
  'update a next="id:b"',
  'update b next="id:a"',
]
op = "traverse"
traversal = { start = ["item:a"], edges = ["item.next"], direction = "both", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:a@0", "item:b@1<a:next"] }

[[case]]
id = "gra-05-outgoing-follows-the-link-forward"
