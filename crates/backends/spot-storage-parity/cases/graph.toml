]
op = "traverse"
traversal = { start = ["item:a"], edges = ["item.next"], direction = "both", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:a@0", "item:b@1<a:next"] }

[[case]]
id = "gra-06-only-the-named-edge-is-followed-next"
