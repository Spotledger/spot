  'a code="t:a" next="id:b"',
]
op = "traverse"
traversal = { start = ["item:b"], edges = ["item.next"], direction = "in", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:b@0", "item:a@1<b:next"] }

[[case]]
id = "gra-05-both-follows-either-way"
rule = "SEM-GRA-05"
title = "from b both: b, then c and a at depth 1 in id order"
catalog = "graph"
setup = [
  'c code="t:c"',
  'b code="t:b" next="id:c"',
  'a code="t:a" next="id:b"',
]
op = "traverse"
traversal = { start = ["item:b"], edges = ["item.next"], direction = "both", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:b@0", "item:c@1<b:next", "item:a@1<b:next"] }

[[case]]
id = "gra-05-a-node-reached-both-ways-appears-once"
rule = "SEM-GRA-05"
