traversal = { start = ["item:b"], edges = ["item.next"], direction = "out", max_depth = 5, max_nodes = 100 }
expect = { nodes = ["item:b@0", "item:c@1<b:next"] }

[[case]]
id = "gra-05-incoming-follows-the-link-backwards"
rule = "SEM-GRA-05"
title = "from b incoming: b and a"
catalog = "graph"
setup = [
  'c code="t:c"',
