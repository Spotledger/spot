[package]
name = "spot-pg-migrate"
description = "Online schema migration for the PostgreSQL backend: diff the live schema against the catalogue, plan the safe changes, apply them, refuse the rest (WP-STO-11)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
spot-storage-contract = { path = "../../../contracts/storage" }
spot-postgres = { path = "../spot-postgres" }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = "0.8"
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
spot-postgres = { path = "../spot-postgres", features = ["testing"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
