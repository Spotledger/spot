resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.98.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
float_arithmetic = "deny"
unwrap_used = "deny"
expect_used = "warn"

# Dev and test builds carry line tables only (function names and file:line in
# panics and backtraces, no local variables for a debugger). Debug info
# dominates the size of target/debug. Opt back in locally for interactive
# debugging with CARGO_PROFILE_DEV_DEBUG=2. See docs/build-profile.md.
[profile.dev]
debug = "line-tables-only"

# Third-party crates carry no debug info at all: nobody steps into them, and
# they are the bulk of the debug info in target/. Our own crates are unaffected.
[profile.dev.package."*"]
debug = false

# `cargo test` uses the test profile, which inherits dev; spelled out so the
# intent survives a change to dev.
[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false
