# The full, slow verification for the exported tree (WP-OSS-03.T2, the project process notes).
# Ported from the private nightly.yml: GitHub-hosted runners, one run a night on main, never
# blocks anything (the public repository takes no pull requests). Triggers are the daily
# schedule (as in the private workflow) and a manual run; no secrets, read-only token.
#
# Dropped from the private file: the `report` job (it opened a `nightly-red` issue with
# `issues: write`; the public repository starts with Issues off, and the red-main loop is
# plan section 4.7: the sync bot opens the issue in the private repository), the
# `tools/plan/validate.py` step (the plan is private), and every SPOT_RUNNER / self-hosted /
# SPOT_INTEGRATION_BRANCH expression. The branch is main.
name: nightly
on:
  schedule:
    - cron: "0 21 * * *" # as the private nightly.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  # No debug info in CI test builds: the workspace test target otherwise outgrew the hosted
  # runner's disk ("No space left on device" while compiling spot-cli tests). Backtraces keep
  # function names; only line tables and variable info are dropped.
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  rust:
    name: rust full (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: main }
      - if: runner.os == 'Linux'
        name: free disk space on the hosted runner (the full builds need more than the 14 GB it starts with)
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - name: install the toolchain pinned in rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - if: runner.os == 'Linux'
        name: start PostgreSQL 18 with its extensions
        shell: bash
        run: bash tools/ci/start-postgres.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - if: runner.os != 'Linux'
        name: ignored and slow tests
        run: cargo test --locked --workspace -- --ignored
      - if: runner.os == 'Linux'
        name: ignored and slow tests
        shell: bash
        run: cargo test --locked --workspace --exclude spot-idle-connections -- --ignored
      # The 10,000-connection run needs 20,612 descriptors; a skipped run is a red nightly.
      - if: runner.os == 'Linux'
        name: 10,000 idle connections
        shell: bash
        timeout-minutes: 20
        run: |
          ulimit -n 65536 || { echo "cannot raise the descriptor limit to 65536 (hard limit: $(ulimit -Hn)); see docs/process/idle-connections.md" >&2; exit 1; }
          SPOT_IDLE_REQUIRE=1 cargo test --locked -p spot-idle-connections --test idle_10k -- --ignored --nocapture
      - if: failure() && runner.os == 'Linux'
        name: explain a PostgreSQL failure
        shell: bash
        run: bash tools/ci/pg-diagnose.sh
      - if: always() && runner.os == 'Linux' && env.SPOT_PG_DIR != ''
        name: stop the throwaway PostgreSQL
        shell: bash
        run: ${SPOT_PG_BIN:-/usr/lib/postgresql/18/bin}/pg_ctl -D "$SPOT_PG_DIR/data" stop -m immediate >/dev/null 2>&1 || true

  python:
    name: python suites and gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: install the pinned Python packages the checks import
        run: python -m pip install PyYAML==6.0.3
      - name: start PostgreSQL 18 with its extensions
        shell: bash
        run: bash tools/ci/start-postgres.sh
      - run: python tools/ci/run_python_suites.py
      - name: lint gates
        shell: bash
        run: |
          for g in tools/lints/*/run.sh; do
            [ -f "$g" ] || continue
            # G6 diffs HEAD against HEAD~1 on main; the first commit of the repository has none.
            if [ "$g" = tools/lints/contracts/run.sh ] && ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then echo "skip $g: no parent commit"; continue; fi
            echo "::group::$g"; bash "$g"; echo "::endgroup::"
          done

  dotnet:
    # lint-allow: no-postgres the .NET build and its tests use no database.
    name: dotnet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: main }
      - if: runner.os == 'Linux'
        name: free disk space on the hosted runner (the full builds need more than the 14 GB it starts with)
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { global-json-file: clients/avalonia/global.json }
      - shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" tools/ci/dotnet_build.py clients/avalonia/Spotledger.Client.sln
      - run: dotnet test clients/avalonia/Spotledger.Client.sln -c Release --no-build

  l7-l8-profiles:
    name: L7 nightly and L8 profiles
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { ref: main }
      - if: runner.os == 'Linux'
        name: free disk space on the hosted runner (the full builds need more than the 14 GB it starts with)
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - name: install the toolchain pinned in rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: start PostgreSQL 18 with its extensions
        shell: bash
        run: bash tools/ci/start-postgres.sh
      - name: run the L7 nightly and L8 profiles
        shell: bash
        run: bash tools/ci/nightly-profiles/run.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-profiles
          path: target/nightly-profiles/
          if-no-files-found: warn
          retention-days: 14
