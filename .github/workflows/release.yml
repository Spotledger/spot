# Public release workflow (WP-OSS-08.T4, the project process notes sections 2 to 4).
#
# Run by hand only: the single trigger is workflow_dispatch. There is no tag-push trigger, no
# schedule and no other event, so nothing releases automatically (the architecture owner, 2026-11-11).
#
#   publish = false (default)  dry run: runs every gate that needs no tag, builds and checks the
#                              packages, keeps dist/ as a workflow artefact. No tag, no Release.
#   publish = true             the annotated tag must already exist (a maintainer pushes it with
#                              `git tag -a` and `git push`; this workflow never creates tags).
#                              After every gate, the one job with a write scope creates the
#                              GitHub Release and attaches dist/.
#
# Decisions (the project process notes, section 5):
#   D1/D2  nothing is signed and there are no attestations: artefacts are only checksummed.
#   D3     the container image is not built or published in 0.x; the Containerfile is still checked.
#   D5     the build runs on ubuntu-22.04 for an older glibc baseline.
# No credential other than the per-run GitHub token appears in this file. The tag input reaches a
# shell only through env:, never through an expression inside run:.
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, vX.Y.Z or vX.Y.Z-rc.N (for publish = true it must already exist and be annotated)"
        required: true
        type: string
      publish:
        description: "Create the GitHub Release (false = dry run: build and check only)"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  gate:
    # lint-allow: no-postgres the gate reads git history and the CI run status; it runs no test or database.
    name: release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # A publish checks out the tag; a dry run needs no tag and checks out the head of main.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.publish && format('refs/tags/{0}', inputs.tag) || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: the tag has the shape of a release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "refused: '$TAG' is not vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi
      - name: record the commit being released
        id: commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: inputs.publish
        name: tag exists, is annotated, is on main, CI is green on it (signature only when required)
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_SIGNED: ${{ vars.RELEASE_REQUIRE_SIGNED }}
        run: |
          args=(--tag "$TAG" --repo "$GITHUB_REPOSITORY" --workflow ci.yml)
          if [ "$REQUIRE_SIGNED" = "true" ]; then
            args+=(--require-signed --keys release-keys/spotledger-release.asc)
          fi
          python3 tools/release/tag_gate.py "${args[@]}"
      - if: "!inputs.publish"
        name: dry run, CI is green on the head of main (no tag exists to check)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "tools/release")
          import tag_gate
          reasons = tag_gate.check_ci(os.environ["GITHUB_REPOSITORY"], "ci.yml", os.environ["SHA"], token=os.environ.get("GITHUB_TOKEN"))
          for reason in reasons:
              print("REFUSED " + reason)
          sys.exit(1 if reasons else 0)
          PY
      - name: the tag matches the manifest version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: python3 tools/release/check_release.py version --tag "$TAG"
      - name: licence and copyright-holder check
        shell: bash
        run: python3 tools/release/check_release.py licence

  build:
    # lint-allow: no-postgres no cargo test and no python suites run here: the gate job requires green CI on this same commit. A future test step must first run `bash tools/ci/start-postgres.sh` and set SPOT_REQUIRE_PG=1.
    name: build and check the packages
    needs: gate
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: install the toolchain pinned in rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: install the packaging tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm dpkg-dev
      - name: build the release binary
        shell: bash
        run: cargo build --release --locked -p spot-cli
      - name: the binary starts
        shell: bash
        run: |
          target/release/spot --version
          target/release/spot --help
      - name: packaging tool tests (they need no database)
        shell: bash
        run: python3 -m unittest discover -s tools/packaging/tests
      - name: build the tarball, deb and rpm
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          mkdir -p dist
          python3 tools/packaging/build.py tarball --binary target/release/spot --version "$version" --out dist
          python3 tools/packaging/build.py deb --binary target/release/spot --version "$version" --out dist
          python3 tools/packaging/build.py rpm --binary target/release/spot --version "$version" --out dist
      - name: check every package
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          shopt -s nullglob
          for f in dist/*.tar.gz; do python3 tools/packaging/check.py tarball "$f"; done
          for f in dist/*.deb; do python3 tools/packaging/check.py deb "$f" --version "$version"; done
          for f in dist/*.rpm; do python3 tools/packaging/check.py rpm "$f" --version "$version"; done
          for ext in tar.gz deb rpm; do
            n=$(ls dist/*."$ext" 2>/dev/null | wc -l)
            if [ "$n" -ne 1 ]; then echo "expected exactly one .$ext in dist, found $n" >&2; exit 1; fi
          done
          # The container image is not built or published in 0.x (design note D3); only the
          # Containerfile is checked.
          python3 tools/packaging/check.py containerfile
      - name: SBOM and checksums
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 tools/security/sbom.py --out dist/spot-"${TAG#v}".cdx.json
          python3 tools/release/check_release.py checksums --dir dist
          test -s dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    # lint-allow: no-postgres publishing downloads the built files and creates a Release; it runs no test.
    name: create the GitHub Release
    needs: [gate, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # lint-allow: contents release asset upload
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist
      - name: refuse a tag that already has a Release, or whose commit moved
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "refused: '$TAG' is not a release tag" >&2; exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "refused: a release for $TAG already exists; assets are never overwritten" >&2; exit 1
          fi
          now=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          if [ "$now" != "$SHA" ]; then
            echo "refused: tag $TAG now points at $now, the gate checked $SHA" >&2; exit 1
          fi
      - name: write the release notes
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          {
            echo "Status: pre-release, not for production."
            echo
            echo "Source commit: \`$SHA\`"
            echo
            echo "This is a development version: nothing is signed, artefacts are only checksummed."
            echo
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            awk '{ printf "| %s | `%s` |\n", $2, $1 }' dist/SHA256SUMS
            echo
            echo "Verify the download with \`sha256sum -c SHA256SUMS\`; see https://github.com/$GITHUB_REPOSITORY/blob/$SHA/docs/releasing.md"
          } > notes.md
      - name: create the Release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$TAG" in *-rc.*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Spotledger Runtime $TAG" --notes-file notes.md "${flags[@]}"
