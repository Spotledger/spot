# Gate G7 on the pinned reference corpus (WP-TST-13.T2), for the exported tree. Runs on
# GitHub-hosted runners; the public repository takes no pull requests, so the triggers are push
# to main, a weekly schedule and a manual run. No secrets. the project process notes.
name: hygiene
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    # lint-allow: no-postgres the hygiene scan compares source text with a reference corpus; it touches no database.
    name: hygiene scan and seeded recall
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: fingerprint the pin and the normaliser
        id: pin
        run: |
          stamp=$(python3 - <<'PY'
          import hashlib, tomllib
          from pathlib import Path
          document = tomllib.loads(Path("tools/lints/hygiene/reference.toml").read_text())
          shas = "".join(entry["commit"] for entry in document["references"])
          normaliser = hashlib.sha256(Path("tools/lints/hygiene/hygiene.py").read_bytes()).hexdigest()[:12]
          print(f"hygiene-{shas[:16]}-{normaliser}")
          PY
          )
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/spot-hygiene
          key: ${{ steps.pin.outputs.stamp }}
      - name: validate the pin (offline)
        run: python tools/lints/hygiene/reference.py --check-pin
      - name: fetch the pinned corpus and build the index if not cached
        run: |
          index=$(python tools/lints/hygiene/reference.py --print-index-path)
          if [ ! -f "$index" ]; then
            time python tools/lints/hygiene/reference.py --fetch --build
          else
            echo "index cached: $index"
          fi
      - name: scan the repository against the pinned index
        run: |
          index=$(python tools/lints/hygiene/reference.py --print-index-path)
          export SPOT_HYGIENE_INDEX="$index"
          time bash tools/lints/hygiene/run.sh
      - name: seeded-copy recall on the real corpus
        run: |
          index=$(python tools/lints/hygiene/reference.py --print-index-path)
          time python tools/lints/hygiene/reference.py --seeded-recall --index "$index"
      - name: false-positive rate on this repository
        run: |
          index=$(python tools/lints/hygiene/reference.py --print-index-path)
          time python tools/lints/hygiene/reference.py --false-positives --index "$index"
