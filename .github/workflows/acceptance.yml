# Manual acceptance run for the exported tree (WP-OSS-03.T2, the project process notes).
#
# The private acceptance.yml ran a task PR's acceptance commands, read from the plan with
# tools/pipeline/acceptance.py. Neither the PRs, the plan nor that tool exist in the public
# repository, so the same idea is a maintainer-triggered run of one crate's tests, one .NET test
# project, or one Python suite directory, on a hosted runner with the real PostgreSQL. It has no
# push and no schedule trigger (the private one ran on pull requests only, so any schedule
# would be more often), no secrets and a read-only token. Inputs reach the shell through env:,
# are checked against a strict pattern first, and never sit inside a run: expression.
name: acceptance
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "What to run"
        type: choice
        options: [rust-crate, dotnet-project, python-suites]
        default: rust-crate
      target:
        description: "Crate name (rust-crate), project path under clients/ (dotnet-project) or suite directory under tools/ (python-suites)"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: acceptance (${{ inputs.kind }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KIND: ${{ inputs.kind }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: check the inputs
        shell: bash
        run: |
          case "$KIND" in
            rust-crate) re='^[A-Za-z0-9_-]+$' ;;
            dotnet-project) re='^clients/[A-Za-z0-9_./-]+$' ;;
            python-suites) re='^tools/[A-Za-z0-9_./-]+$' ;;
            *) echo "unknown kind: $KIND" >&2; exit 2 ;;
          esac
          if ! printf '%s' "$TARGET" | grep -Eq "$re" || printf '%s' "$TARGET" | grep -q '\.\.'; then
            echo "target \"$TARGET\" is not allowed for $KIND" >&2; exit 2
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: runner.os == 'Linux'
        name: free disk space on the hosted runner (the full builds need more than the 14 GB it starts with)
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: install the pinned Python packages the checks import
        run: python -m pip install PyYAML==6.0.3
      - if: inputs.kind == 'rust-crate'
        name: install the toolchain pinned in rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup show active-toolchain
      - if: inputs.kind == 'rust-crate'
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - if: inputs.kind != 'dotnet-project'
        name: start PostgreSQL 18 with its extensions
        shell: bash
        run: bash tools/ci/start-postgres.sh
      - if: inputs.kind == 'dotnet-project'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { global-json-file: clients/avalonia/global.json }
      - if: inputs.kind == 'rust-crate'
        name: run the crate's tests
        shell: bash
        run: cargo test --locked -p "$TARGET"
      - if: inputs.kind == 'dotnet-project'
        name: build and run the project's tests
        shell: bash
        run: dotnet test "$TARGET" -c Release
      - if: inputs.kind == 'python-suites'
        name: run the Python suites in the directory
        shell: bash
        run: python -m unittest discover -s "$TARGET"
      - if: failure() && inputs.kind != 'dotnet-project'
        name: explain a PostgreSQL failure
        shell: bash
        run: bash tools/ci/pg-diagnose.sh
      - if: always() && inputs.kind != 'dotnet-project' && env.SPOT_PG_DIR != ''
        name: stop the throwaway PostgreSQL
        shell: bash
        run: ${SPOT_PG_BIN:-/usr/lib/postgresql/18/bin}/pg_ctl -D "$SPOT_PG_DIR/data" stop -m immediate >/dev/null 2>&1 || true
