# Public CI for the exported tree (WP-OSS-03.T1, the project process notes).
#
# GitHub-hosted runners only. The public repository takes no pull requests, so the triggers are
# push to main, a weekly schedule and a manual run; there is no pull_request trigger and there
# are no secrets. tools/opensource-ci/workflow_lint.py enforces these rules on this directory.
#
# Every job that runs tests first runs `bash tools/ci/start-postgres.sh`: PostgreSQL 18 with
# postgis, btree_gist, pg_trgm, unaccent and vector, exporting SPOT_TEST_PG_URL and
# SPOT_REQUIRE_PG=1 so a PostgreSQL-backed test fails instead of skipping. A bare
# `services: postgres` container is not acceptable: the official image has neither PostGIS nor
# pgvector. Windows runs only on the weekly schedule and on a manual run.
name: ci
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # No debug info in CI test builds: the workspace test target otherwise outgrew the hosted
  # runner's disk ("No space left on device" while compiling spot-cli tests). Backtraces keep
  # function names; only line tables and variable info are dropped.
  CARGO_PROFILE_DEV_DEBUG: "0"
jobs:
  python:
    name: python suites, licence lint, workflow lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: install the pinned Python packages the checks import
        shell: bash
        run: python -m pip install PyYAML==6.0.3
      - if: runner.os == 'Linux'
        name: start PostgreSQL 18 with its extensions
        shell: bash
        run: bash tools/ci/start-postgres.sh
      - name: workflow lint
        run: python tools/opensource-ci/workflow_lint.py .github/workflows
      - name: licence lint
        run: python tools/lints/license/check.py
      - name: python suites
        run: python tools/ci/run_python_suites.py
      - if: always() && runner.os == 'Linux' && env.SPOT_PG_DIR != ''
        name: stop the throwaway PostgreSQL
        shell: bash
        run: ${SPOT_PG_BIN:-/usr/lib/postgresql/18/bin}/pg_ctl -D "$SPOT_PG_DIR/data" stop -m immediate >/dev/null 2>&1 || true

  rust:
    name: rust (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        # The workspace has hundreds of integration-test binaries; their build output does not fit on
        # one hosted runner. Each shard tests every fourth crate (by sorted name) on its own runner.
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: runner.os == 'Linux'
        name: free disk space on the hosted runner (the full builds need more than the 14 GB it starts with)
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
          # The workspace's test binaries do not fit beside the checkout on the system disk (the
          # linker died with a bus error, the symptom of a full disk). The runner's second disk,
          # /mnt, has about 66 GB: build there. rust-cache reads the target directory from cargo.
          sudo mkdir -p /mnt/cargo-target
          sudo chown "$(id -u):$(id -g)" /mnt/cargo-target
          echo "CARGO_TARGET_DIR=/mnt/cargo-target" >> "$GITHUB_ENV"
          df -h /mnt
      - name: install the toolchain pinned in rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with: { save-if: false } # the test target is far over the 10 GB cache limit; restoring is enough
      - if: runner.os == 'Linux'
        name: start PostgreSQL 18 with its extensions
        shell: bash
        run: bash tools/ci/start-postgres.sh
      # Linux only: `cargo fmt --all` hands rustfmt every source file on one command line, which
      # Windows refuses (os error 206), and formatting does not depend on the platform.
      - if: matrix.shard == 1 && runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - if: matrix.shard == 1
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test this shard of the workspace (every fourth crate by sorted name)
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          packages=$(cargo metadata --no-deps --format-version 1 | "$PY" -c '
          import json, sys
          m = json.load(sys.stdin)
          members = set(m["workspace_members"])
          names = sorted(p["name"] for p in m["packages"] if p["id"] in members)
          print(" ".join("-p " + n for n in names[int(sys.argv[1]) - 1::4]))
          ' "${{ matrix.shard }}")
          echo "shard ${{ matrix.shard }}/4: $(echo "$packages" | wc -w | tr -d ' ') arguments"
          # shellcheck disable=SC2086
          cargo test --locked --no-fail-fast $packages
      # ADR-061 section 6: a patch that changes a stored shape ships the upcaster that rewrites
      # the images written before it. Linux only: the journal fixtures are byte files.
      - if: runner.os == 'Linux' && matrix.shard == 1
        name: every declared shape change has its upcaster
        run: cargo run --locked --quiet -p spot-journal-compat --bin check_shapes
      # Checked every run, not trusted: all five extensions must exist in the test database.
      - if: runner.os == 'Linux'
        name: the five required PostgreSQL extensions exist
        shell: bash
        run: |
          have=$(psql "$SPOT_TEST_PG_URL" -Atc "select extname from pg_extension")
          echo "$have"
          missing=""
          for ext in postgis btree_gist pg_trgm unaccent vector; do
            echo "$have" | grep -qx "$ext" || missing="$missing $ext"
          done
          if [ -n "$missing" ]; then echo "missing PostgreSQL extensions:$missing" >&2; exit 1; fi
      - if: failure() && runner.os == 'Linux'
        name: explain a PostgreSQL failure
        shell: bash
        run: bash tools/ci/pg-diagnose.sh
      - if: always() && runner.os == 'Linux'
        name: disk report (where the space went)
        shell: bash
        run: |
          df -h / /mnt || true
          du -sh "${CARGO_TARGET_DIR:-target}" ~/.cargo ~/.rustup /var/lib/docker /tmp 2>/dev/null || true
      - if: always() && runner.os == 'Linux' && env.SPOT_PG_DIR != ''
        name: stop the throwaway PostgreSQL
        shell: bash
        run: ${SPOT_PG_BIN:-/usr/lib/postgresql/18/bin}/pg_ctl -D "$SPOT_PG_DIR/data" stop -m immediate >/dev/null 2>&1 || true

  deny:
    # lint-allow: no-postgres cargo deny reads manifests and the lock file; it runs no tests.
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with: { command: check }

  gates:
    # lint-allow: no-postgres the lint gates read source files; none runs a test or a database.
    name: lint gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 2 } # the contracts gate (G6) diffs HEAD against HEAD~1 on main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: run the lint gates
        shell: bash
        run: |
          for g in tools/lints/*/run.sh; do
            [ -f "$g" ] || continue
            # G6 diffs HEAD against HEAD~1 on main; the first commit of the repository has none.
            if [ "$g" = tools/lints/contracts/run.sh ] && ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then echo "skip $g: no parent commit"; continue; fi
            echo "::group::$g"; bash "$g"; echo "::endgroup::"
          done

  docs:
    # lint-allow: no-postgres the contract site build reads contracts and builds rustdoc; it runs no tests.
    name: contract documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: python tools/docsite/build.py --out out/docsite --check

  dotnet:
    # lint-allow: no-postgres the .NET build and its tests use no database.
    name: dotnet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: runner.os == 'Linux'
        name: free disk space on the hosted runner (the full builds need more than the 14 GB it starts with)
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - name: find the solution
        id: detect
        shell: bash
        run: |
          sln=$(ls clients/avalonia/*.sln 2>/dev/null | head -1 || true)
          if [ -z "$sln" ]; then echo "No .NET solution; skipping."; else echo "sln=$sln" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.sln != ''
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { global-json-file: clients/avalonia/global.json }
      - if: steps.detect.outputs.sln != ''
        shell: bash
        env:
          SLN: ${{ steps.detect.outputs.sln }}
        run: |
          py=$(command -v python3 || command -v python)
          "$py" tools/ci/dotnet_build.py "$SLN"
      - if: steps.detect.outputs.sln != '' && runner.os != 'Windows'
        shell: bash
        env:
          SLN: ${{ steps.detect.outputs.sln }}
        run: dotnet test "$SLN" -c Release --no-build
      # Windows: the screenshot and accessibility baselines are recorded on Linux (font
      # rasterization differs per OS) and the hostile-file-name refusal tests write names Windows
      # cannot create; those suites run on Linux, everything else runs here.
      - if: steps.detect.outputs.sln != '' && runner.os == 'Windows'
        shell: bash
        env:
          SLN: ${{ steps.detect.outputs.sln }}
        run: |
          dotnet test "$SLN" -c Release --no-build \
            --filter "FullyQualifiedName!~ScreenshotTests&FullyQualifiedName!~ShellRtlMatrixTests&FullyQualifiedName!~UrduScreenMatrixTests&FullyQualifiedName!~GalleryAccessibilityTests&FullyQualifiedName!~RefusalTextHardeningTests"
