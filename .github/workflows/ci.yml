# Public CI for the exported tree (WP-OSS-03.T1, the project process notes).
#
# GitHub-hosted runners only. The triggers are push to main, a pull request from a branch of this
# same repository (the required checks must report on it), a weekly schedule and a manual run.
# A pull request runs with a read-only token and no secrets, and every job carries the
# same-repository guard, so a fork's pull request runs nothing. tools/opensource-ci/workflow_lint.py
# enforces these rules on this directory.
#
# Every job that runs tests first runs `bash tools/ci/start-postgres.sh`: PostgreSQL 18 with
# postgis, btree_gist, pg_trgm, unaccent and vector, exporting SPOT_TEST_PG_URL and
# SPOT_REQUIRE_PG=1 so a PostgreSQL-backed test fails instead of skipping. A bare
# `services: postgres` container is not acceptable: the official image has neither PostGIS nor
# pgvector. Windows runs only on the weekly schedule and on a manual run; a pull request runs
# Linux only, like a push.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # No debug info in CI test builds: the workspace test target otherwise outgrew the hosted
  # runner's disk ("No space left on device" while compiling spot-cli tests). Backtraces keep
  # function names; only line tables and variable info are dropped.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # No incremental state either: a CI build runs once, and the incremental directories double
  # the size of every crate's output (shard 3 of the first public run filled the 145 GB disk).
  CARGO_INCREMENTAL: "0"
jobs:
  python:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: python suites, licence lint, workflow lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: install the pinned Python packages the checks import
        shell: bash
        run: python -m pip install PyYAML==6.0.3
      - if: runner.os == 'Linux'
        name: start PostgreSQL 18 with its extensions
        shell: bash
        run: bash tools/ci/start-postgres.sh
      # The server runs in a container; the backup tests need client tools of the same major
      # version on the host (tools/ci/install-pg-client.sh says why).
      - if: runner.os == 'Linux'
        name: install the PostgreSQL 18 client tools
        shell: bash
        run: bash tools/ci/install-pg-client.sh
      - name: workflow lint
        shell: bash
        run: |
          python tools/opensource-ci/workflow_lint.py .github/workflows
      - name: licence lint
        run: python tools/lints/license/check.py
      - name: python suites
        run: python tools/ci/run_python_suites.py
      - if: always() && runner.os == 'Linux' && env.SPOT_PG_DIR != ''
        name: stop the throwaway PostgreSQL
        shell: bash
        run: ${SPOT_PG_BIN:-/usr/lib/postgresql/18/bin}/pg_ctl -D "$SPOT_PG_DIR/data" stop -m immediate >/dev/null 2>&1 || true

  rust:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: rust (${{ matrix.os }}, shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        # The workspace has hundreds of integration-test binaries; their build output does not fit on
        # one hosted runner. Each shard tests a quarter of the crates (balanced by test binaries) on its own runner.
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: runner.os == 'Linux'
        name: free disk space on the hosted runner (the full builds need more than the 14 GB it starts with)
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/share/dotnet /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /opt/az
          df -h /
          # /mnt is a directory on the same 145 GB disk as / (the first public run showed both df
          # lines identical), not a second disk. The target directory lives there only by habit;
          # the space comes from the cleanup above and from the chunked test run below.
          sudo mkdir -p /mnt/cargo-target
          sudo chown "$(id -u):$(id -g)" /mnt/cargo-target
          echo "CARGO_TARGET_DIR=/mnt/cargo-target" >> "$GITHUB_ENV"
          df -h /mnt
      - name: install the toolchain pinned in rust-toolchain.toml
        shell: bash
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with: { save-if: false } # the test target is far over the 10 GB cache limit; restoring is enough
      - if: runner.os == 'Linux'
        name: start PostgreSQL 18 with its extensions
        shell: bash
        run: bash tools/ci/start-postgres.sh
      # The server runs in a container; the backup tests need client tools of the same major
      # version on the host (tools/ci/install-pg-client.sh says why).
      - if: runner.os == 'Linux'
        name: install the PostgreSQL 18 client tools
        shell: bash
        run: bash tools/ci/install-pg-client.sh
      # The L3 mail-intake case needs the fake IMAP server's certificate to be one the process
      # trusts (harness/rust/l3-http/src/cases/mail_intake.rs): a throwaway self-signed one, added
      # to a copy of the system roots so nothing else loses its trust store.
      - if: runner.os == 'Linux'
        name: certificate for the L3 mail-intake case
        shell: bash
        run: |
          d="$RUNNER_TEMP/l3-imap"
          mkdir -p "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=127.0.0.1 \
            -addext subjectAltName=IP:127.0.0.1 -addext basicConstraints=critical,CA:FALSE \
            -keyout "$d/key.pem" -out "$d/cert.pem"
          cat /etc/ssl/certs/ca-certificates.crt "$d/cert.pem" > "$d/trusted.pem"
          {
            echo "L3_IMAP_CERT=$d/cert.pem"
            echo "L3_IMAP_KEY=$d/key.pem"
            echo "SSL_CERT_FILE=$d/trusted.pem"
          } >> "$GITHUB_ENV"
      # Linux only: `cargo fmt --all` hands rustfmt every source file on one command line, which
      # Windows refuses (os error 206), and formatting does not depend on the platform.
      - if: matrix.shard == 1 && runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - if: matrix.shard == 1
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: test this shard of the workspace (crates balanced by test binaries, four crates at a time)
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          NAMES=$(cargo metadata --no-deps --format-version 1 | "$PY" -c '
          import json, sys
          m = json.load(sys.stdin)
          members = set(m["workspace_members"])
          pk = [p for p in m["packages"] if p["id"] in members]
          # Balanced by test binaries (each one is a link of its own): spot-cli alone has 240, so
          # taking every fourth crate by name left shard 3 with 650 binaries and the others 360 to
          # 420. Greedy by weight; shard 1 starts heavier because it also runs fmt and clippy.
          # The 248 test binaries of spot-cli are four times the cost of any other (v0.1.13 run: 18 min to
          # build and 31 min to run, against 33 min for a whole shard of 560 ordinary binaries), so a
          # crate with 100 or more of them counts four times each and ends up on a shard of its own.
          def weight(p):
              n = sum(1 for t in p["targets"] if "test" in t["kind"])
              return 1 + n * (4 if n >= 100 else 1)
          load = [60, 0, 0, 0]
          shards = [[], [], [], []]
          for p in sorted(pk, key=lambda p: (-weight(p), p["name"])):
              i = load.index(min(load))
              shards[i].append(p["name"])
              load[i] += weight(p)
          print(" ".join(sorted(shards[int(sys.argv[1]) - 1])))
          ' "${{ matrix.shard }}")
          echo "shard ${{ matrix.shard }}/4: $(echo "$NAMES" | wc -w | tr -d ' ') crates"
          # Build, run and delete in chunks of four crates: one `cargo test` over the whole shard
          # keeps every test binary on disk at once (105 GB for shard 3, a full disk and a linker
          # bus error). Dependencies stay cached between chunks; only the test executables go.
          # harness/rust/l9-scale is the scale and fault harness (tier M load, a 3-node cluster, a
          # soak, a volume seed). Its budget tests need dedicated hardware and take over an hour on a
          # hosted runner (the volume test alone 41 minutes); they run in the nightly L9 profiles
          # (tools/ci/nightly-profiles/l9). Every other l9-scale test runs here, alone in its chunk.
          L9_SKIP=(--skip a_metadata_change_on_node_a_is_visible_on_b_and_c_and_there_is_one_leader
            --skip a_node_cut_off_from_postgres_refuses_writes_and_recovers
            --skip a_rolling_restart_under_5_writes_per_second_loses_no_acknowledged_write
            --skip killing_the_leader_moves_the_lease_within_two_ttls_and_a_session_survives_the_loss
            --skip pool_exhaustion_queues_and_the_connections_return_to_the_baseline
            --skip postgres_connections_killed_under_load_are_absorbed_without_losing_a_write
            --skip the_soak_runs_with_its_events_and_the_series_stay_within_the_leak_budgets
            --skip tier_m_under_load_with_a_second_site_loaded_beside_it
            --skip the_volume_profile_seeds_100k_rows_and_meets_its_operation_budgets)
          # One chunk must not be able to eat the job: a hung test binary fails its chunk after
          # CHUNK_SECONDS, with the crate names printed, and the loop goes on. (The log of a job
          # cancelled by timeout-minutes is deleted by GitHub, so a hang used to leave nothing to read.)
          # Every output line carries the time it arrived, so the slow test binary shows in the log.
          CHUNK_SECONDS=${CHUNK_SECONDS:-3000}
          run_timed() { # run_timed <label> <command...>
            local label=$1; shift
            local t0=$SECONDS s
            echo "[$(date +%T)] start: $label"
            if timeout --version >/dev/null 2>&1; then
              timeout --kill-after=60 "$CHUNK_SECONDS" "$@" 2>&1 | while IFS= read -r l; do printf '[%(%T)T] %s\n' -1 "$l"; done
            else
              "$@" 2>&1 | while IFS= read -r l; do printf '[%(%T)T] %s\n' -1 "$l"; done
            fi
            s=${PIPESTATUS[0]}
            echo "[$(date +%T)] end after $((SECONDS - t0)) s, exit $s: $label"
            if [ "$s" = 124 ] || [ "$s" = 137 ]; then
              echo "::error::chunk timed out after ${CHUNK_SECONDS} s (a hung test?): $label"
            fi
            return "$s"
          }
          failed_chunks=""
          rc=0
          run_chunk() { # run_chunk <build|grouped|doc>: the chunk is in $chunk, trailing test arguments in $extra
            if [ "$1" = doc ]; then
              : > "$RUNNER_TEMP/test-exes.json"  # doc-tests build nothing ahead of the run
            else
              cargo test --locked --no-run --message-format=json "${chunk[@]}" > "$RUNNER_TEMP/test-exes.json" </dev/null || rc=1
            fi
            run_timed "cargo test ${chunk[*]}" cargo test --locked --no-fail-fast "${chunk[@]}" "${extra[@]}" </dev/null || { rc=1; failed_chunks="$failed_chunks [${chunk[*]}]"; }
            "$PY" -c '
          import json, os, sys
          for line in open(sys.argv[1]):
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              exe = m.get("executable")
              if m.get("reason") == "compiler-artifact" and exe and m.get("profile", {}).get("test"):
                  try:
                      os.remove(exe)
                  except OSError:
                      pass
          ' "$RUNNER_TEMP/test-exes.json"
          }
          # A crate with many test targets (spot-cli has 248, each a large statically linked executable)
          # is run in groups of about 40 targets: one `cargo test -p spot-cli` keeps every executable on
          # disk at once (v0.1.15: 114 GB, "No space left on device" while linking). big-crates.txt has one
          # line per group: the crate, then its cargo target arguments: `--lib --bins --examples` first,
          # one `--doc` line (doc-tests run once per crate, not once per group), then `--test a --test b ...`.
          BIG_FILE="$RUNNER_TEMP/big-crates.txt"
          "$PY" -c '
          import json, subprocess, sys
          LIMIT, GROUP = 60, 40
          m = json.loads(subprocess.run(["cargo", "metadata", "--no-deps", "--format-version", "1"],
                                        check=True, capture_output=True, text=True).stdout)
          members = set(m["workspace_members"])
          want = set(sys.argv[1:])
          for p in sorted((p for p in m["packages"] if p["id"] in members and p["name"] in want), key=lambda p: p["name"]):
              tests = sorted(t["name"] for t in p["targets"] if "test" in t["kind"])
              if len(tests) < LIMIT:
                  continue
              k = -(-len(tests) // GROUP)
              size = -(-len(tests) // k)
              print(p["name"], "--lib --bins --examples")
              if any(set(t["kind"]) & {"lib", "rlib", "proc-macro"} for t in p["targets"]):
                  print(p["name"], "--doc")
              for i in range(0, len(tests), size):
                  print(p["name"], " ".join("--test " + t for t in tests[i:i + size]))
          ' $NAMES > "$BIG_FILE"
          cut -d" " -f1 "$BIG_FILE" | sort | uniq -c | while read -r c n; do echo "grouped: $n in $c groups"; done
          set -- $NAMES
          while [ $# -gt 0 ]; do
            chunk=(); n=0; extra=(); big=""
            while [ $# -gt 0 ] && [ $n -lt 4 ]; do
              if [ "$1" = l9-scale ]; then
                [ $n -gt 0 ] && break
                chunk+=(-p l9-scale); extra=(-- "${L9_SKIP[@]}"); shift; break
              fi
              if grep -q "^$1 " "$BIG_FILE"; then
                [ $n -gt 0 ] && break
                big=$1; shift; break
              fi
              chunk+=(-p "$1"); shift; n=$((n+1))
            done
            if [ -n "$big" ]; then
              while IFS= read -r line <&3; do
                read -r -a g <<< "$line"
                chunk=(-p "${g[0]}" "${g[@]:1}"); extra=()
                mode=grouped; [ "${g[1]}" = --doc ] && mode=doc
                run_chunk "$mode"
              done 3< <(grep "^$big " "$BIG_FILE")
              continue
            fi
            run_chunk build
          done
          [ -z "$failed_chunks" ] || echo "::error::failing chunks:$failed_chunks"
          exit $rc
      # ADR-061 section 6: a patch that changes a stored shape ships the upcaster that rewrites
      # the images written before it. Linux only: the journal fixtures are byte files.
      - if: runner.os == 'Linux' && matrix.shard == 1
        name: every declared shape change has its upcaster
        run: cargo run --locked --quiet -p spot-journal-compat --bin check_shapes
      # Checked every run, not trusted: all five extensions must exist in the test database.
      - if: runner.os == 'Linux'
        name: the five required PostgreSQL extensions exist
        shell: bash
        run: |
          have=$(psql "$SPOT_TEST_PG_URL" -Atc "select extname from pg_extension")
          echo "$have"
          missing=""
          for ext in postgis btree_gist pg_trgm unaccent vector; do
            echo "$have" | grep -qx "$ext" || missing="$missing $ext"
          done
          if [ -n "$missing" ]; then echo "missing PostgreSQL extensions:$missing" >&2; exit 1; fi
      - if: failure() && runner.os == 'Linux'
        name: explain a PostgreSQL failure
        shell: bash
        run: bash tools/ci/pg-diagnose.sh
      - if: always() && runner.os == 'Linux'
        name: disk report (where the space went)
        shell: bash
        run: |
          df -h / /mnt || true
          du -sh "${CARGO_TARGET_DIR:-target}" ~/.cargo ~/.rustup /var/lib/docker /tmp 2>/dev/null || true
      - if: always() && runner.os == 'Linux' && env.SPOT_PG_DIR != ''
        name: stop the throwaway PostgreSQL
        shell: bash
        run: ${SPOT_PG_BIN:-/usr/lib/postgresql/18/bin}/pg_ctl -D "$SPOT_PG_DIR/data" stop -m immediate >/dev/null 2>&1 || true

  deny:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # lint-allow: no-postgres cargo deny reads manifests and the lock file; it runs no tests.
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with: { command: check }

  gates:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # lint-allow: no-postgres the lint gates read source files; none runs a test or a database.
    name: lint gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 2 } # the contracts gate (G6) diffs HEAD against HEAD~1 on main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: run the lint gates
        shell: bash
        run: |
          for g in tools/lints/*/run.sh; do
            [ -f "$g" ] || continue
            # G6 diffs HEAD against HEAD~1 on main; the first commit of the repository has none.
            if [ "$g" = tools/lints/contracts/run.sh ] && ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then echo "skip $g: no parent commit"; continue; fi
            echo "::group::$g"; bash "$g"; echo "::endgroup::"
          done

  docs:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # lint-allow: no-postgres the contract site build reads contracts and builds rustdoc; it runs no tests.
    name: contract documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - name: install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - run: python tools/docsite/build.py --out out/docsite --check

  dotnet:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # lint-allow: no-postgres the .NET build and its tests use no database.
    name: dotnet (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: runner.os == 'Linux'
        name: free disk space on the hosted runner (the full builds need more than the 14 GB it starts with)
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/share/dotnet /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium /opt/az
          df -h /
      - name: find the solution
        id: detect
        shell: bash
        run: |
          sln=$(ls clients/avalonia/*.sln 2>/dev/null | head -1 || true)
          if [ -z "$sln" ]; then echo "No .NET solution; skipping."; else echo "sln=$sln" >> "$GITHUB_OUTPUT"; fi
      - if: steps.detect.outputs.sln != ''
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { global-json-file: clients/avalonia/global.json }
      - if: steps.detect.outputs.sln != ''
        shell: bash
        env:
          SLN: ${{ steps.detect.outputs.sln }}
        run: |
          py=$(command -v python3 || command -v python)
          "$py" tools/ci/dotnet_build.py "$SLN"
      - if: steps.detect.outputs.sln != '' && runner.os != 'Windows'
        shell: bash
        env:
          SLN: ${{ steps.detect.outputs.sln }}
        run: dotnet test "$SLN" -c Release --no-build
      # Windows: the screenshot and accessibility baselines are recorded on Linux (font
      # rasterization differs per OS) and the hostile-file-name refusal tests write names Windows
      # cannot create; those suites run on Linux, everything else runs here.
      - if: steps.detect.outputs.sln != '' && runner.os == 'Windows'
        shell: bash
        env:
          SLN: ${{ steps.detect.outputs.sln }}
        run: |
          dotnet test "$SLN" -c Release --no-build \
            --filter "FullyQualifiedName!~ScreenshotTests&FullyQualifiedName!~ShellRtlMatrixTests&FullyQualifiedName!~UrduScreenMatrixTests&FullyQualifiedName!~GalleryAccessibilityTests&FullyQualifiedName!~RefusalTextHardeningTests"
