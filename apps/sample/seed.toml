# The sample app's demo seed (WP-DX-05.T1).
#
# 2 projects, 6 tasks, 8 labels, 5 time entries — as drafts. Ids are placeholders
# the installer (WP-PRD-01.T2 `spot install-app --seed`) replaces with real record
# ids at import; names resolve through the `ref` values, which name a row's `code`
# or `name` within the same file. The Time Entries stay drafts, so the controller
# roll-up has not run and `task.logged_hours` is still null everywhere a save has
# not touched it.

