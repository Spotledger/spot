# Checklist Item: the child table of `task.checklist` (WP-DX-05.T1).
#
# A child DocType: its rows exist only inside a parent Task. `done` is the one
# bool of the app's field sets, exercised by the typed-view row accessors.
name = "checklist_item"
label = "Checklist Item"
app = "sample"
module = "tasks"
is_child = true

[[fields]]
name = "text"
label = "Text"
type = "text"
max_chars = 200
required = true

[[fields]]
name = "done"
label = "Done"
type = "bool"
in_list_view = true