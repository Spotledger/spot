# The platform's own app (WP-IAM-02.T2): the records the platform keeps about who can sign in,
# what they may do, and which keys and sessions exist. Loaded before every other app. It holds
# data only (DocTypes, grants, bootstrap records); behaviour lives in spot-iam-directory,
# spot-auth and the sign-in service. No hooks yet.
[app]
name = "platform"
version = "0.1.0"
title = "Platform"

# The function service drops the rate-limit buckets that have been idle for a while (WP-PLT-17.T6).
# The registry also bounds itself when a call finds too many buckets; this is the timetable that
# keeps the memory flat between calls. The job is registered by the host's function service.
[[schedules]]
name = "function_evict_idle"
cron = "0 */5 * * * *"
step = "platform:function_evict_idle"
queue = "short"
budget_ms = 30000

# The weekly check that the edge set equals the link fields (WP-DAG-04.T6). The host's
# edge-integrity service registers the job; the report and its gauges are on /metrics.
# Sunday 03:30 UTC (the manifest's day-of-week 7 is Sunday, like 0).
[[schedules]]
name = "edge_verify"
cron = "0 30 3 * * 7"
step = "platform:edge_verify"
queue = "long"
budget_ms = 3600000
